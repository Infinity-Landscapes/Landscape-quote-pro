<title>Infinity Quote Builder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --green-50:#f2f8ea;
    --green-100:#e2f0d3;
    --green-300:#b7dd8a;
    --green-500:#8bc34a;
    --green-600:#71a838;
    --green-700:#56822b;
    --green-800:#3f611f;
    /* Filled buttons/tabs with white text: dark enough for 4.5:1 contrast in both themes. */
    --primary:#56822b;
    --primary-hover:#46701f;
    /* Brand colours for printed documents (letter, payment plan) and the menu banner — light
       values in both themes, replaced by the business's own colours when it has a logo/colour. */
    --brand-50:#f2f8ea; --brand-100:#e2f0d3; --brand-500:#8bc34a; --brand-600:#71a838; --brand-700:#56822b; --brand-800:#3f611f;
    --panel:#f4f7f2;
    --ink:#262b28;
    --ink-soft:#4b524d;
    --muted:#767f76;
    --paper:#ffffff;
    --bg:#f6f7f2;
    --bg-raised:#ffffff;
    --line:#e2e5dc;
    --line-soft:#edefe8;
    --danger:#c1503a;
    --danger-bg:#fbeae6;
    --warn:#a97327;
    --warn-bg:#faf1e3;
    --ok:#3f8b52;
    --ok-bg:#e9f4ea;
    --shadow: 0 1px 2px rgba(38,43,40,.04), 0 6px 20px -8px rgba(38,43,40,.12);
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef1ec; --ink-soft:#c9cec6; --muted:#95998f;
      --paper:#20241f; --bg:#171a16; --bg-raised:#1d211c;
      --line:#333730; --line-soft:#2a2e26;
      --green-50:#20291a; --green-100:#26331c; --green-700:#9ccc65; --green-800:#b7dd8a; --panel:#252a23;
      --danger-bg:#3a2420; --warn-bg:#332a17; --ok-bg:#1c2e1f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ink:#eef1ec; --ink-soft:#c9cec6; --muted:#95998f;
    --paper:#20241f; --bg:#171a16; --bg-raised:#1d211c;
    --line:#333730; --line-soft:#2a2e26;
    --green-50:#20291a; --green-100:#26331c; --green-700:#9ccc65; --green-800:#b7dd8a; --panel:#252a23;
    --danger-bg:#3a2420; --warn-bg:#332a17; --ok-bg:#1c2e1f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    font-size:14px;
    line-height:1.5;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Poppins',system-ui,sans-serif;
    letter-spacing:-0.01em;
  }
  .eyebrow{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    letter-spacing:.11em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--green-700);
  }
  a{color:var(--green-700);}
  button{font-family:inherit;}
  ::selection{background:var(--green-300);}

  #app{max-width:1180px;margin:0 auto;padding:20px 16px 64px;min-height:100%;}

  /* ---------- shell / nav ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 4px 20px;
    flex-wrap:wrap;
    row-gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .topbar-actions{display:flex;gap:8px;flex:none;}
  /* ---- First-time tour + Help/FAQ ---- */
  #tourLayer{position:fixed;inset:0;z-index:99990;}
  #tourLayer .tour-block{position:absolute;inset:0;}
  #tourLayer.no-spot .tour-block{background:rgba(10,16,6,.55);}
  #tourLayer .tour-spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(10,16,6,.55);outline:3px solid var(--green-300);pointer-events:none;transition:all .18s ease;}
  #tourLayer .tour-tip{position:fixed;left:50%;transform:translateX(-50%);width:min(440px, calc(100vw - 32px));max-height:min(62vh, 520px);overflow:auto;
    background:var(--bg-raised);color:var(--ink);border-radius:16px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.35);}
  #tourLayer .tour-tip.dock-bottom{bottom:16px;}
  #tourLayer .tour-tip.dock-top{top:16px;}
  #tourLayer .tour-tip.dock-centre{top:50%;transform:translate(-50%,-50%);}
  #tourLayer .tour-tip.dock-side{transform:none;width:min(380px, calc(100vw - 32px));}
  #tourLayer .tour-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;}
  #tourLayer .tour-count{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  #tourLayer .tour-x{background:none;border:0;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;padding:4px 6px;font-family:inherit;text-decoration:underline;}
  #tourLayer h3{margin:2px 0 6px;font-family:'Poppins';font-size:18px;}
  #tourLayer .tour-body{font-size:14px;line-height:1.5;}
  #tourLayer .tour-body p{margin:0 0 8px;}
  #tourLayer .tour-body ul,#tourLayer .tour-body ol{margin:0 0 8px;padding-left:20px;}
  #tourLayer .tour-body li{margin-bottom:4px;}
  #tourLayer .tour-dots{display:flex;gap:5px;justify-content:center;margin:8px 0 10px;flex-wrap:wrap;}
  #tourLayer .tour-dots span{width:6px;height:6px;border-radius:50%;background:var(--line);}
  #tourLayer .tour-dots span.on{background:var(--primary);width:16px;border-radius:3px;}
  #tourLayer .tour-btns{display:flex;justify-content:space-between;gap:10px;}
  #tourLayer .tour-btns .btn{flex:1;}
  details.faq{border-top:1px solid var(--line);padding:10px 0;}
  details.faq:first-of-type{border-top:0;}
  details.faq summary{cursor:pointer;font-weight:700;list-style-position:outside;}
  details.faq .faq-a{margin-top:6px;color:var(--muted);font-size:14px;line-height:1.55;}

  .brand-mark{width:34px;height:34px;flex:none;}
  .brand-logo{display:block;object-fit:contain;flex:none;}
  .brand-initials{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--primary);color:#fff;font-family:'Poppins';font-weight:800;font-size:14px;}
  .brand-word{font-family:'Poppins';font-weight:800;font-size:17px;letter-spacing:.02em;line-height:1.1;}
  .brand-word small{display:block;font-family:'Manrope';font-weight:600;font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;}

  .nav-tabs{display:flex;gap:4px;background:var(--bg-raised);border:1px solid var(--line);padding:4px;border-radius:12px;box-shadow:var(--shadow);flex-wrap:wrap;}
  .nav-tab{
    border:none;background:transparent;color:var(--ink-soft);font-weight:700;font-size:12.5px;
    padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap;
  }
  .nav-tab.active{background:var(--primary);color:#fff;}
  .nav-tab:hover:not(.active){background:var(--green-50);color:var(--green-800);}

  .icon-btn{
    border:1px solid var(--line);background:var(--bg-raised);color:var(--ink-soft);
    width:36px;height:36px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{border-color:var(--green-500);color:var(--green-700);}

  /* ---------- generic building blocks ---------- */
  .card{
    background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow); padding:22px;
  }
  .card + .card{margin-top:16px;}
  .stack{display:flex;flex-direction:column;gap:16px;}
  .stack > *{min-width:0;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:160px;}
  /* Buttons in a row (Yes/No, Back/Next, Cancel/OK, ‹ Today ›) sit side by side on a phone. */
  .row > .btn, .row > button:not(.icon-btn){min-width:0;flex:1 1 auto;}
  .row > .icon-btn{flex:none;min-width:0;}
  a.btn{text-decoration:none;}
  .row > input[type=checkbox], .row > input[type=radio]{flex:none;min-width:0;}
  .center-col{max-width:440px;margin:40px auto;}

  label{display:block;font-weight:700;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .field{margin-bottom:14px;}
  input[type=text],input[type=email],input[type=tel],input[type=number],input[type=password],input[type=date],input[type=time],select,textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;
    background:var(--paper);color:var(--ink);font-size:14px;font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green-500);outline-offset:1px;border-color:var(--green-500);}
  textarea{resize:vertical;min-height:70px;}
  .hint{font-size:12px;color:var(--muted);margin-top:4px;}
  .checkline{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;cursor:pointer;background:var(--paper);}
  .checkline input{width:16px;height:16px;accent-color:var(--green-600);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 20px;border-radius:10px;font-weight:700;font-size:13.5px;
    border:1.5px solid transparent;cursor:pointer;font-family:inherit;
  }
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-hover);}
  .btn-primary:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink-soft);}
  .btn-ghost:hover{border-color:var(--green-500);color:var(--green-700);}
  .btn-danger{background:transparent;border-color:var(--line);color:var(--danger);}
  .btn-danger:hover{background:var(--danger-bg);border-color:var(--danger);}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}

.btnbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;}
  /* Quote wizard: Back / Next (and the running total) stay pinned to the bottom of the screen. */
  .wiz-bar{position:sticky;bottom:0;z-index:20;background:var(--bg-raised);margin-left:-8px;margin-right:-8px;padding:10px 8px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
  .wiz-total{display:flex;flex-direction:column;align-items:center;line-height:1.15;font-size:11px;color:var(--muted);flex:1;min-width:0;}
  .wiz-total b{font-size:15px;color:var(--ink);white-space:nowrap;}
  .wiz-bar .btn{padding-left:12px;padding-right:12px;flex:0 1 auto;}

  .pill{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:11px;padding:4px 10px;border-radius:99px;letter-spacing:.02em;}
  .pill-draft{background:var(--warn-bg);color:var(--warn);}
  .pill-sent{background:var(--green-100);color:var(--green-800);}
  .pill-ongoing{background:var(--ok-bg);color:var(--ok);}
  .pill-finished{background:var(--line-soft);color:var(--ink-soft);}
  .pill-cancelled{background:var(--danger-bg);color:var(--danger);}
  .profit-bar{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--danger),var(--warn),var(--ok));margin:8px 0 4px;}
  .profit-bar .marker{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-50%);box-shadow:0 0 0 2px var(--paper);}
  .overrun-badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--danger-bg);color:var(--danger);margin-left:6px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;padding:6px 8px;border-bottom:1.5px solid var(--line);}
  td{padding:8px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .tbl-wrap{overflow-x:auto;}

  .service-tile{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--paper);cursor:pointer;
  }
  .service-tile.on{border-color:var(--green-500);background:var(--green-50);}
  .service-tile .t{font-weight:700;font-size:13.5px;}
  .service-tile .s{font-size:11.5px;color:var(--muted);}
  .toggle{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.15s;}
  .toggle.on{background:var(--green-600);}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3);}
  .toggle.on::after{left:18px;}

  .meas-row{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px;}
  .meas-row.two{grid-template-columns:1.6fr 1fr auto;}
  .meas-row.four{grid-template-columns:1.3fr 0.8fr 0.8fr 0.9fr auto;}
  .meas-row.six{grid-template-columns:1.1fr repeat(5,minmax(0,0.8fr)) auto;gap:6px;}
  .meas-row.six input{padding-left:8px;padding-right:6px;}
  .meas-head{margin-bottom:2px;font-size:11px;font-weight:700;color:var(--muted);line-height:1.2;align-items:end;}
  .meas-head .icon-btn-spacer{width:36px;}
  /* Per-field labels: hidden on wide screens (the column headings do the job), shown on a phone
     where the headings are hidden and the row's fields stack. */
  .mf-lbl{display:none;}
  @media (max-width:760px){
    .mf-lbl{display:block;font-size:11px;margin-bottom:3px;}
    .meas-row{border:1px solid var(--line);border-radius:10px;padding:10px;gap:8px;}
  }
  .kicker-num{font-family:'Poppins';font-weight:800;font-size:26px;line-height:1;}
  .kfig{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--green-50);min-width:120px;}
  .kfig .l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--green-700);}
  .kfig .v{font-family:'Poppins';font-weight:700;font-size:17px;}

  .totals-line{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px;}
  .totals-line.grand{border-top:1.5px solid var(--ink);margin-top:6px;padding-top:12px;font-weight:800;font-size:16px;}

  .wizard-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
  .wstep{font-size:11px;font-weight:700;padding:7px 12px;border-radius:99px;background:var(--line-soft);color:var(--muted);}
  .wstep.active{background:var(--primary);color:#fff;}
  .wstep.done{background:var(--green-100);color:var(--green-800);cursor:pointer;}
  .wstep.done:hover{background:var(--green-200,#c9e8ae);}

  .empty{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty .em-ic{font-size:34px;margin-bottom:10px;}

  .letter{
    background:#fff;color:#26302a;max-width:760px;margin:0 auto;border-radius:10px;overflow:hidden;
    box-shadow:var(--shadow); border:1px solid var(--line);
  }
  .letter-head{padding:26px 34px 18px;}
  .letter-head img{height:64px;display:block;}
  .letter-rule{height:4px;background:linear-gradient(90deg,var(--brand-500),var(--brand-700));}
  .letter-name{font-family:'Poppins';font-weight:800;font-size:24px;color:var(--brand-700);line-height:1.2;}
  .letter-foot-band{margin-top:20px;padding:14px 34px;background:var(--brand-700);color:#fff;font-size:12px;line-height:1.6;}
  .letter-foot-band b{font-size:13px;}
  .letter-body{padding:30px 34px 10px;font-size:14px;line-height:1.65;color:#2c352e;}
  .letter-body h4{font-family:'Poppins';font-size:14.5px;margin:20px 0 6px;color:#26302a;}
  .letter-body ul{margin:4px 0 10px 18px;padding:0;}
  .letter-body li{margin-bottom:3px;}
  .letter-body table.letter-mats{width:100%;border-collapse:collapse;font-size:13px;margin:2px 0 14px;}
  .letter-body table.letter-mats td{padding:4px 0;border-bottom:1px solid #e3e8df;color:#2c352e;vertical-align:top;}
  .letter-body table.letter-mats td.q{text-align:right;white-space:nowrap;padding-left:14px;color:#5d685f;}
  .letter-total-box{background:var(--brand-50);border:1px solid var(--brand-100);border-radius:10px;padding:14px 18px;margin:18px 0;font-size:15px;}
  .letter-total-box b{font-family:'Poppins';font-size:19px;}
  .letter-foot img{width:100%;display:block;margin-top:20px;}

  /* Payment plan — styled to match the business's existing invoice template */
  .invoice-doc{
    background:#fff;color:#231f20;max-width:760px;margin:0 auto;border-radius:10px;overflow:hidden;
    box-shadow:var(--shadow); border:1px solid var(--line); padding:34px 40px 30px;font-size:13px;line-height:1.55;
  }
  .invoice-brand{font-family:'Poppins';font-weight:500;font-size:26px;color:var(--brand-500);margin:0 0 14px;letter-spacing:.01em;}
  .invoice-companyinfo{font-size:12.5px;line-height:1.6;color:#231f20;margin-bottom:26px;}
  .invoice-meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:22px;font-size:12.5px;flex-wrap:wrap;}
  .invoice-meta .lbl{font-weight:800;}
  .invoice-meta .right{text-align:right;}
  .invoice-intro{font-size:13px;margin:0 0 20px;color:#3a423c;}
  .invoice-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:26px;}
  .invoice-table th{background:#ebebeb;text-align:left;font-weight:800;padding:8px 12px;border:1px solid #d8d8d8;white-space:nowrap;text-transform:none;letter-spacing:normal;color:#231f20;font-size:12.5px;}
  .invoice-table th.num,.invoice-table td.num{text-align:right;}
  .invoice-table td{padding:8px 12px;border:1px solid #e4e4e4;}
  .invoice-table tr:nth-child(even) td{background:#f6f6f6;}
  .invoice-table tr.total td{background:#ebebeb;font-weight:800;border-top:1px solid #d8d8d8;}
  .invoice-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-top:10px;}
  .invoice-thanks{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:800;font-size:30px;color:var(--brand-500);}
  .invoice-bank{font-size:12px;line-height:1.6;color:#231f20;text-align:right;}
  .invoice-bank b{font-size:12px;}
  @media print{
    .no-print{display:none !important;}
    body{background:#fff;}
    .letter{box-shadow:none;border:none;}
  }

  .two-col{display:grid;grid-template-columns:1.3fr .8fr;gap:16px;align-items:start;}
  .two-col > *{min-width:0;}
  @media (max-width:760px){ .two-col{grid-template-columns:1fr;} .meas-row{grid-template-columns:1fr;} .meas-row.two{grid-template-columns:1fr;} .meas-row.four{grid-template-columns:1fr;} .meas-row.six{grid-template-columns:1fr;} .meas-head{display:none;} }

  /* ---------- mobile ---------- */
  @media (max-width:640px){
    #app{padding:14px 12px 56px;}
    .card{padding:16px;}
    .card + .card{margin-top:12px;}
    .topbar{padding:6px 2px 16px;}
    .brand-word{font-size:15.5px;}
    .topbar .nav-tabs{order:3;flex:1 1 100%;justify-content:center;}
    .topbar .brand{flex:1 1 0;}
    .nav-tab{padding:9px 13px;font-size:12px;}
    .icon-btn{width:42px;height:42px;}
    .btn{padding:12px 18px;}
    .btnbar{flex-wrap:wrap;row-gap:10px;}
    .btnbar > .row{width:100%;justify-content:flex-end;}
    h2{font-size:18px !important;}
    .letter-head{padding:20px 20px 14px;}
    .letter-head img{height:52px;}
    .letter-body{padding:22px 20px 8px;}
    .letter-total-box{padding:12px 14px;}
    .invoice-doc{padding:20px 18px 18px;font-size:12.5px;}
    .invoice-brand{font-size:20px;}
    .invoice-meta{flex-direction:column;gap:10px;}
    .invoice-meta .right{text-align:left;}
    .invoice-bottom{flex-direction:column;align-items:flex-start;gap:16px;}
    .invoice-bank{text-align:left;}
    .invoice-thanks{font-size:24px;}
    .invoice-table th,.invoice-table td{padding:6px 8px;}
    .kfig{min-width:100px;padding:10px 12px;}
    .center-col{margin:24px auto;}
    /* prevent iOS Safari auto-zoom on focus */
    input[type=text],input[type=email],input[type=tel],input[type=number],input[type=password],input[type=date],input[type=time],select,textarea{
      font-size:16px;
    }
  }
  @media (max-width:400px){
    [data-extra] input, [data-extra] .hint{min-width:0 !important;flex:1 1 100% !important;}
  }

  .msg{padding:10px 14px;border-radius:9px;font-size:13px;font-weight:600;margin-bottom:14px;}
  .msg-err{background:var(--danger-bg);color:var(--danger);}
  .msg-ok{background:var(--ok-bg);color:var(--ok);}

    if(c==='digOutDepth' && key && S.settings && S.settings.digOutDepthDefaults && S.settings.digOutDepthDefaults[key]!=null){

    } else {

  });

  // necessary?") always carries the value on its rows, prefilled from the business default, so it
  // is already there the moment the option is ticked — see rowColsFor.
  const def = SERVICES[key];
  // Fixed starting values for extra per-row fields (e.g. Block Retaining Wall's footing width/depth).

  if(def && def.depthCol && r.digOutDepth===undefined){
    const dd = S.settings && S.settings.digOutDepthDefaults && S.settings.digOutDepthDefaults[key];
    r.digOutDepth = dd!=null ? String(dd) : '150';
  }
  return r;
}

// per-row "Dig-out depth (mm)" when it has a `depthCol` option and that option is ticked.
function rowColsFor(def, options){

    cols: withDepth ? def.cols.concat(["digOutDepth"]) : def.cols,

    // Edging is extra labour on top of laying the patio itself — add its own person-days on top

    const days = ruq(personDays/(ctx.peopleOnSite||1));
    // Dig-out depth: the top 50mm is always sand/bedding (unchanged ratio below); the remainder
    // is the Type 1 MOT depth. MOT quantity scales proportionally from the long-standing baseline
    // of area÷5 tonnes at 100mm of MOT. A dig-out of 50mm or less leaves no MOT layer at all.
    const digOutDepth = Number(opt.digOutDepth)||0;
    const motDepth = Math.max(0, digOutDepth - 50);
    const motQty = ru((area/5) * (motDepth/100));
    // Slab type is a normal materials-list pick now (like gravel's style) — its price/unit come
    // from ctx.price(name)/ctx.unit(name) via priceSection's standard 2-element tuple below, same
    // as every other plain material. Jointing compound and edging style still look up their own
    // tenant-built library entry (their own price AND ratio) — see ctx.pavingJointingCompounds/
    // pavingEdgingStyles (ctxFor) and the "Paving" card in Settings → Pricing for how tenants
    // add/remove these. ctx.netPrice applies the same Inc-VAT stripping every other price gets.
    const jc = opt.jointingCompound ? (ctx.pavingJointingCompounds||[]).find(x=>x.name===opt.jointingCompound) : null;
    const jcQty = (jc && jc.coverage>0) ? ru(area/jc.coverage) : 0;
    const jcPrice = jc ? ctx.netPrice(jc.price, jc.vatIncluded) : 0;
    const es = opt.edging ? (ctx.pavingEdgingStyles||[]).find(x=>x.name===opt.edgingStyle) : null;
    // Edging quantity is a straight multiply, not rounded up — unlike the slab area and jointing
    // compound quantity above, the user's own spec for this ratio didn't call for rounding.
    const esQty = es ? edgingLen*(Number(es.piecesPerMetre)||0) : 0;
    const esPrice = es ? ctx.netPrice(es.price, es.vatIncluded) : 0;
    const primerCoverage = ctx.pavingPrimerCoverage||20;
    const mats = [
      ["Geotextile membrane", area],
      ["Type 1 MOT", motQty],
      ["Sharp sand", ru(area/10)],
      ["Cement", ru(area*6/10)],
      ["Paving primer", ru(area/primerCoverage)],
      [opt.style||'', opt.style? area:0],
      [opt.jointingCompound||'', jcQty, opt.jointingCompound? jcPrice:0, '', 'unit'],
      [es? opt.edgingStyle:'', esQty, es? esPrice:0, '', 'each'],
      ["Patio cleaner", ru(area/20)],
      ["Recessed manhole cover", opt.covers? (Number(opt.coverCount)||0):0],
      ["Consumables", area>0?1:0],
    ];
    const plant = [["Plate Compactor",1,days],["Cement Mixer",1,days]];
    const blockers = [];
    if(area>0){
      if(!opt.style) blockers.push("Select a slab type");
      if(!jc) blockers.push("Select a jointing compound");
      else if(!(jc.coverage>0)) blockers.push(`The jointing compound "${jc.name}" needs a coverage figure`);
      if(opt.edging && edgingLen>0 && !es) blockers.push("Select an edging style for the edging length entered");
    }
    return {area, days, personDays, digOutDepth, blockers, materials:mats, plant, keyFigures:[["Total area",area.toFixed(2)+" m²"],["Days required",days]]};
  }},

gravel: { label:"Gravel areas & paths", group:"Hard landscaping", unitLabel:"Area", cols:["desc","width","length","digOutDepth"],
  colLabels:["Description","Width (m)","Length (m)","Dig-out depth (mm)"],
  options:[
    // October 2026 rework: gravel type is a tenant-added materials-list pick priced per tonne (no
    // built-in styles or default); dig-out depth is per row; edging is either a tenant-built edging
    // style or "Steel edging", which adds the separate Steel Edging service for that run.
    {key:"style",label:"Gravel type",type:"select",options:[],default:"",customizable:"gravel",
      hint:"Pick a gravel you've already added, or add a new one (price per tonne) — it's saved to your materials for future quotes too."},
    {key:"gravelDepth",label:"Gravel depth (mm)",type:"number",default:50,
      hint:"Depth of the finished gravel layer. The Type 1 MOT depth on each row is that row's dig-out depth minus this."},
    {key:"edging",label:"Edging needed?",type:"yesno",default:false},
    {key:"edgingStyle",label:"Edging style",type:"select",source:"gravelEdgingStyles",extraOptions:[{value:GRAVEL_STEEL_EDGING,label:"Steel edging"}],
      default:"",showIf:"edging",placeholder:"Select an edging style…", addLabel:"edging style", addFields:["piecesPerMetre","price"],
      hint:"Pick an edging style you've added, add a new one, or choose Steel edging — that adds the Steel Edging service to this quote, where you enter its length."},
    {key:"edgingLength",label:"Edging length (m)",type:"number",default:"",placeholder:"Total edging length",
      showIf:o=>!!o.edging && o.edgingStyle!==GRAVEL_STEEL_EDGING},
    {key:"edgingProductivity",label:"Edging productivity (m/day/person)",type:"number",default:12,
      showIf:o=>!!o.edging && o.edgingStyle!==GRAVEL_STEEL_EDGING, hint:"How much edging ONE PERSON lays per day — override for this job if needed."},
    {key:"productivity",label:"Productivity (m²/day/person)",type:"number",default:16.7,hint:"How much ONE PERSON lays per day — override for this job if needed."},
  ],
  calc(rows, opt, ctx){
    // Per row in whole mm (r6/ru round to 6dp first). Gravel and MOT tonnages are summed across
    // rows unrounded and rounded up ONCE on the total.
    const blockers = [];
    const gravelDepth = (opt.gravelDepth===undefined || opt.gravelDepth==='') ? 50 : (Number(opt.gravelDepth)||0);
    const cov = Number(ctx.gravelCoverage)||10, base = Number(ctx.gravelBaselineDepth)||50;
    const motCov = Number(ctx.gravelMotCoverage)||5, motBase = Number(ctx.gravelMotBaselineDepth)||100;
    // A row saved before the rework has no digOutDepth of its own — fall back to that job's old
    // single dig-out option (or 150).
    const legacyDepth = Number(opt.digOutDepth)>0 ? Number(opt.digOutDepth) : 150;
    let area=0, gravelT=0, motT=0, volumeM3=0; const depths=[];
    rows.forEach(r=>{
      const wm = Number(r.width)||0, lm = Number(r.length)||0;
      if(!(wm*lm>0)) return;
      const a = r6(wm*lm);
      const d = r.digOutDepth===undefined ? legacyDepth : (Number(r.digOutDepth)||0);
      area += a; depths.push(d); volumeM3 += a*(d/1000);
      gravelT += (a/cov)*(gravelDepth/base);
      motT += (a/motCov)*(Math.max(0, d-gravelDepth)/motBase);
    });
    const hasArea = area>0;
    if(depths.some(d=>gravelDepth>=d)) blockers.push(`Gravel depth (${gravelDepth}mm) must be less than every row's dig-out depth — there's no room left for the Type 1 MOT`);
    if(hasArea){
      if(!opt.style) blockers.push("Select a gravel type");
      else if(!(ctx.price(opt.style)>0)) blockers.push("The gravel price can't be £0");
    }
    // Edging: a tenant-built style is priced here; Steel edging is priced by its own section.
    const steel = !!opt.edging && opt.edgingStyle===GRAVEL_STEEL_EDGING;
    const legacyEdging = !!opt.edging && opt.edgingStyle===undefined && opt.edgingType!==undefined;
    const es = (opt.edging && !steel && opt.edgingStyle) ? (ctx.gravelEdgingStyles||[]).find(x=>x.name===opt.edgingStyle) : null;
    const edgingLen = (opt.edging && !steel) ? (Number(opt.edgingLength)||0) : 0;
    if(opt.edging && !steel && !legacyEdging && hasArea){
      if(!es) blockers.push("Select an edging style (or Steel edging)");
      else if(!(edgingLen>0)) blockers.push("Enter the edging length (m)");
      else if(!(Number(es.piecesPerMetre)>0)) blockers.push("The edging style's pieces per metre must be greater than 0");
      else if(!(Number(es.price)>0)) blockers.push("The edging style price can't be £0");
    }
    const esQty = es ? ru(edgingLen*(Number(es.piecesPerMetre)||0)) : 0;
    const personDays = (area/(Number(opt.productivity)||16.7)) + (es ? edgingLen/(Number(opt.edgingProductivity)||12) : 0);
    const days = ruq(personDays/(ctx.peopleOnSite||1));
    const edgingLine = es ? [opt.edgingStyle, esQty, ctx.netPrice(es.price, es.vatIncluded), '', 'each']
      : legacyEdging ? (opt.edgingType==="Block edging" ? ["Edging blocks", ru(20*edgingLen)] : ["Edging for gravel", edgingLen])
      : ['', 0];
    const mats = [
      ["Geotextile membrane", 2*area],
      ["Type 1 MOT", ru(motT)],
      [opt.style||'', opt.style ? ru(gravelT) : 0],
      edgingLine,
      ["Consumables", hasArea ? (ctx.gravelConsumablesQty!=null ? Number(ctx.gravelConsumablesQty) : 1) : 0],
    ];
    const plant = [["Plate Compactor",1,days]];
    const digOutDepth = hasArea ? (volumeM3/area)*1000 : 0;
    return {area, days, personDays, digOutDepth, blockers, materials:mats, plant, keyFigures:[["Total area",area.toFixed(2)+" m²"],["Days required",days]]};
  }},

    {key:"productivity",label:"Productivity (m²/day/person)",type:"number",default:16.7,hint:"How much ONE PERSON lays per day — override for this job if needed."},
