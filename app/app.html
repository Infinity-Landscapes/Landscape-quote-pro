blockpaving: { label:"Block paving", group:"Hard landscaping", unitLabel:"Area", cols:["desc","width","length","digOutDepth"],
  colLabels:["Description","Width (m)","Length (m)","Dig-out depth (mm)"],
  options:[
    // October 2026: style is a normal `customizable` materials-list pick now, like Paving's slab
    // type — no built-in default block any more, tenants add their own (see
    // CUSTOM_STYLE_SECTIONS.block / customStyleOptionsListHtml). Jointing compound and edging
    // style are tenant-built product libraries, mirroring pavingJointingCompounds/
    // pavingEdgingStyles exactly, under their own blockJointingCompounds/blockEdgingStyles keys —
    // see ctxFor and the "Block paving" card in Settings → Pricing.
    {key:"style",label:"Block style",type:"select",options:[],default:"",customizable:"block",
      hint:"Pick a block you've already added, or add a new one — it's saved to your materials for future quotes too."},
    {key:"jointingCompound",label:"Jointing compound",type:"select",source:"blockJointingCompounds",default:"",placeholder:"Select a jointing compound…",
      addLabel:"jointing compound", addFields:["price","coverage"], addFieldDefaults:{coverage:8},
      hint:"Pick one you've already added, or add a new one — it's saved to your Block paving settings for future quotes too."},
    // No "edging needed?" gate — a blank length (the default) simply means no edging, and the old
    // automatic perimeter calculation is gone entirely; the user enters however much they need.
    {key:"edgingLength",label:"Edging length (m)",type:"number",default:"",placeholder:"Leave blank for no edging"},
    {key:"edgingStyle",label:"Edging style",type:"select",source:"blockEdgingStyles",default:"",placeholder:"Select an edging style…",
      addLabel:"edging style", addFields:["piecesPerMetre","price"],
      hint:"Pick one you've already added, or add a new one — it's saved to your Block paving settings for future quotes too."},
    {key:"edgingProductivity",label:"Edging productivity (m/day/person)",type:"number",default:12,hint:"How much edging ONE PERSON lays per day — override for this job if needed."},
    {key:"productivity",label:"Productivity (m²/day/person)",type:"number",default:5,hint:"How much ONE PERSON lays per day — override for this job if needed."},
  ],
  calc(rows, opt, ctx){
    const area = sum(rows.map(r=>r.width*r.length));
    // Dig-out depth is now set per measurement row (default 250mm — see mkRow/digOutDepthDefaults)
    // rather than once for the whole job. The area-weighted AVERAGE depth below feeds the shared
    // Waste removal & site clearance pool exactly like every other spoil-generating service (see
    // priceSection's digOutDepth carry-through) — multiplying it back by this section's own area
    // in calcWasteRemoval exactly recovers the real summed dig-out volume, so no precision is lost.
    // A row saved before this rework (a resumed draft or an edited old quote) has no digOutDepth
    // key at all — fall back to that job's old single job-level depth option (or 250) for it, so
    // it still reprices sensibly instead of silently collapsing to 0mm. A row where the user
    // has deliberately cleared the field (key present, blank) still counts as 0.
    const legacyDepth = Number(opt.digOutDepth)>0 ? Number(opt.digOutDepth) : 250;
    const rowDepth = r => (r.digOutDepth===undefined ? legacyDepth : (Number(r.digOutDepth)||0));
    const volumeM3 = sum(rows.map(r=>(Number(r.width)||0)*(Number(r.length)||0)*(rowDepth(r)/1000)));
    const digOutDepth = area>0 ? (volumeM3/area)*1000 : 0;
    const edgingLen = Number(opt.edgingLength)||0;
    // Person-days is the total, crew-size-independent labour effort — main laying plus edging,
    // both at their own (overridable) per-person daily rates, using the unrounded figures
    // throughout; `days` is that split across however many people are on site, rounded up to the
    // nearest quarter day — see priceSection for how each feeds labour cost vs. plant-hire/running
    // costs duration.
    const personDays = (area/(Number(opt.productivity)||5)) + (edgingLen/(Number(opt.edgingProductivity)||12));
    const days = ruq(personDays/(ctx.peopleOnSite||1));
    // Sub-base: Type 1 MOT depth = dig-out depth − surface build-up (the laying course + the
    // block itself). MOT quantity scales from the long-standing baseline of area×3/10 tonnes at a
    // 150mm MOT depth — both the baseline rate and baseline depth are editable settings, so at the
    // defaults (250mm dig-out, 100mm surface build-up -> 150mm MOT depth) 40m² still needs
    // ROUNDUP(40×0.3×(150/150)) = 12 tonnes.
    const surfaceBuildUp = ctx.blockPavingSurfaceBuildUp!=null ? Number(ctx.blockPavingSurfaceBuildUp) : 100;
    const motBaselineRate = ctx.blockPavingMotBaselineRate!=null ? Number(ctx.blockPavingMotBaselineRate) : 0.3;
    const motBaselineDepth = ctx.blockPavingMotBaselineDepth!=null ? Number(ctx.blockPavingMotBaselineDepth) : 150;
    const motDepth = Math.max(0, digOutDepth - surfaceBuildUp);
    const motQty = ru(area * motBaselineRate * (motDepth/(motBaselineDepth||150)));
    // Edging: sand = edging length ÷ 10 (rounded up to whole tonnes), cement uses the same
    // count as the sand — both ratios are fixed, not editable, per the spec.
    const sand = ru(edgingLen/10);
    // Block cost gets a wastage % uplift (default 10%, editable) for cuts/offcuts — applied ONLY
    // to the block purchase, never to any other material.
    const wastagePercent = ctx.blockPavingWastagePercent!=null ? Number(ctx.blockPavingWastagePercent) : 10;
    const blockQty = area * (1 + wastagePercent/100);
    // Jointing compound and edging style each look up their own tenant-built library entry (own
    // price AND ratio) — see ctx.blockJointingCompounds/blockEdgingStyles (ctxFor) and the "Block
    // paving" card in Settings → Pricing for how tenants add/remove these. ctx.netPrice applies
    // the same Inc-VAT stripping every other price gets.
    const jc = opt.jointingCompound ? (ctx.blockJointingCompounds||[]).find(x=>x.name===opt.jointingCompound) : null;
    const jcQty = (jc && jc.coverage>0) ? ru(area/jc.coverage) : 0;
    const jcPrice = jc ? ctx.netPrice(jc.price, jc.vatIncluded) : 0;
    const es = opt.edgingStyle ? (ctx.blockEdgingStyles||[]).find(x=>x.name===opt.edgingStyle) : null;
    // Edging quantity is a straight multiply, not rounded up, same as Paving's edging style.
    const esQty = es ? edgingLen*(Number(es.piecesPerMetre)||0) : 0;
    const esPrice = es ? ctx.netPrice(es.price, es.vatIncluded) : 0;
    const consumablesQty = ctx.blockPavingConsumablesQty!=null ? Number(ctx.blockPavingConsumablesQty) : 1;
    const mats = [
      ["Geotextile membrane", area],
      ["Type 1 MOT", motQty],
      ["Sharp sand", sand],
      ["Cement", sand],
      ["Limestone 2-6mm", ru(area/10)],
      [opt.style||'', opt.style? blockQty:0],
      [opt.jointingCompound||'', jcQty, opt.jointingCompound? jcPrice:0, '', 'unit'],
      [es? opt.edgingStyle:'', esQty, es? esPrice:0, '', 'each'],
      ["Consumables", area>0? consumablesQty:0],
    ];
    const plant = [["Plate Compactor",1,days],["Cement Mixer",1,days]];
    return {area, days, personDays, digOutDepth, motDepth, materials:mats, plant, keyFigures:[["Total area",area.toFixed(2)+" m²"],["Avg dig-out depth",digOutDepth.toFixed(0)+" mm"]]};
  }},

resinbound: { label:"Resin bound", group:"Hard landscaping", unitLabel:"Area", cols:["desc","width","length"],
  colLabels:["Description","Width (m)","Length (m)"],
  options:[
    {key:"system",label:"Resin system",type:"select",options:["Addagrip Addagrid","Resin path on concrete"],default:"Addagrip Addagrid",hint:"Addagrip Addagrid is the standard grid-and-resin driveway build. Resin path on concrete is a simpler site-mixed concrete base with resin kits poured over the top."},
    {key:"digOutDepth",label:"Dig-out depth (mm)",type:"number",default:115,
      hint:"How deep the sub-base/ground is excavated (115mm matches the resin-path-on-concrete build) — feeds the shared Waste removal & site clearance totals."},
    {key:"productivity",label:"Productivity (m²/day/person)",type:"number",default:5,hint:"How much ONE PERSON lays per day — override for this job if needed."},
  ],
  calc(rows, opt, ctx){
    const area = sum(rows.map(r=>r.width*r.length));
    // Full perimeter — each row treated as its own rectangle, so 2×(width+length) per row.
    const edge = 2 * (sum(rows.map(r=>Number(r.width)||0)) + sum(rows.map(r=>Number(r.length)||0)));
    const personDays = area/(Number(opt.productivity)||5);
    const days = ruq(personDays/(ctx.peopleOnSite||1));
    // 1 prep day per 40m², for either resin system — a fixed labour block that's added straight
    // onto labour cost (see priceSection's extraLabourDays) regardless of crew size, same as before.
    const prepDays = area<=0 ? 0 : ruq(area/40);
    let mats;
    if(opt.system==="Resin path on concrete"){
      // Simpler build: geotextile membrane laid for ground stability (1m² per m²), then a
      // site-mixed concrete base (1 bag ballast + 1 bag sharp sand per 10m², 1.2 bags of cement
      // per m² rounded up to the nearest whole bag), then resin kits poured over the top —
      // 1 kit per 4m², delivered in batches of up to 8 kits per delivery charge, plus a flat
      // consumables allowance for this system.
      const resinKitQty = ru(area/4);
      mats = [
        ["Geotextile membrane", area],
        ["Ballast", ru(area/10)],
        ["Sharp sand", ru(area/10)],
        ["Cement", ru(area*1.2)],
        ["Resin kit", resinKitQty],
        ["Resin delivery", ru(resinKitQty/8)],
        ["Consumables (resin path)", area>0?1:0],
      ];
    } else {
      const kitQty = ru(area/1.9);
      mats = [
        ["Addagrip geofabric membrane", ru(area/50)],
        ["Type 3 MOT", ru(area*3/10)],
        ["Addagrip Terrabase grid system", ru(area/25)],
        ["Edging for resin", ru(2*edge)],
        ["Limestone 2-6mm", ru(area/10)],
        ["Addagrip anti slip glass", ru(area/30)],
        ["Addagrip Catalyst", area>0?1:0],
        ["Addagrip terrabase UV 30mm driveway kit", kitQty],
        ["Delivery – Addagrip Terrabase UV 30mm kit", ru(kitQty/10)],
        ["Consumables", area>0?1:0],
      ];
    }
    const plant = [["Plate Compactor",1,days],["Resin mixer",1,days]];
    const digOutDepth = Number(opt.digOutDepth)||115;
    return {area, days, personDays, digOutDepth, extraLabourDays:prepDays, materials:mats, plant, keyFigures:[["Total area",area.toFixed(2)+" m²"],["Prep days",prepDays]]};
  }},

artificialturf: { label:"Artificial turf", group:"Planting & beds", unitLabel:"Area", cols:["desc","width","length","digOutDepth"],
  colLabels:["Description","Width (m)","Length (m)","Dig-out depth (mm)"],
  options:[
    // October 2026 rework: per-row dig-out depth (default 75mm); tenant-built turf (per m²),
    // grano dust (per tonne), seam tape (per roll), infill sand (per bag) and edging styles; the
    // edging length is typed (not worked out from row perimeters); "Steel edging" hands the edge
    // to the Steel Edging service as Gravel/Flower Beds do. See calc().
    {key:"turfProduct",label:"Artificial turf (£ per m²)",type:"select",source:"atTurf",default:"",placeholder:"Select a turf…",
      sourceLabel:e=>`${e.name} — £${(Number(e.price)||0).toFixed(2)} per m²`, addLabel:"artificial turf (price per m²)", addFields:["price"],
      hint:"Quantity = ROUNDUP(area × (1 + wastage %)) — the wastage % is in Settings → Pricing → Artificial turf."},
    {key:"grano",label:"Grano dust (£ per tonne)",type:"select",source:"atGrano",default:"",placeholder:"Select a grano dust…",
      addLabel:"grano dust (price per tonne)", addFields:["price"]},
    {key:"infill",label:"Infill sand (£ per bag)",type:"select",source:"atInfill",default:"",placeholder:"Select an infill sand…",
      addLabel:"infill sand (price per bag)", addFields:["price"]},
    {key:"edgingStyle",label:"Edging style",type:"select",source:"atEdgingStyles",extraOptions:[{value:GRAVEL_STEEL_EDGING,label:"Steel edging"}],
      default:"",placeholder:"No edging / select a style…", addLabel:"edging style", addFields:["piecesPerMetre","price"],
      hint:"A non-steel edging is set in a concrete edge restraint. Steel edging adds the Steel Edging service, where you enter its length."},
    {key:"edgingLength",label:"Edging length (m)",type:"number",default:"",placeholder:"Blank = no edging",
      showIf:o=>o.edgingStyle!==GRAVEL_STEEL_EDGING},
    {key:"seamTape",label:"Adhesive seam tape (£ per roll)",type:"select",source:"atSeamTape",default:"",placeholder:"Select a seam tape…",
      showIf:o=>o.edgingStyle!==GRAVEL_STEEL_EDGING && Number(o.edgingLength)>0,
      addLabel:"seam tape (price per roll)", addFields:["price"], hint:"Rolls = ROUNDUP(edging length ÷ the roll length in Settings)."},
    {key:"edgingProductivity",label:"Edging productivity (m/day/person)",type:"number",default:12,
      showIf:o=>o.edgingStyle!==GRAVEL_STEEL_EDGING && Number(o.edgingLength)>0, hint:"How much edging ONE PERSON lays per day — override for this job if needed."},
    {key:"productivity",label:"Productivity (m²/day/person)",type:"number",default:5,hint:"How much ONE PERSON lays per day — override for this job if needed."},
  ],
  calc(rows, opt, ctx){
    const blockers = [];
    // A quote saved before the rework (no turf choice, no per-row depth) prices the old way.
    if(opt.turfProduct===undefined && !rows.some(r=>r.digOutDepth!==undefined)){
      const area = sum(rows.map(r=>(Number(r.width)||0)*(Number(r.length)||0)));
      const edge = 2 * (sum(rows.map(r=>Number(r.width)||0)) + sum(rows.map(r=>Number(r.length)||0)));
      const personDays = area/(Number(opt.productivity)||5);
      const days = ruq(personDays/(ctx.peopleOnSite||1));
      const ss = ru(edge/10), bl = ru(edge/10);
      return {area, days, personDays, digOutDepth: Number(opt.digOutDepth)||75, materials:[["Type 1 MOT", ru(area/5)],["Geotextile membrane", area],["Grano dust", ru(area/10)],["Sharp sand", ss],["Ballast", bl],["Cement", 6*ss+6*bl],["Artificial turf", ru(area*1.2)],["Adhesive seam tape", ru(edge/20)],["Infill sand", ru(area/5)],["Consumables", area>0?1:0]],
        plant:[["Plate Compactor",1,days],["Cement Mixer",1,days]], keyFigures:[["Total area",area.toFixed(2)+" m²"],["Edge length",edge.toFixed(2)+" m"]]};
    }
    const buildUp = ctx.atSurfaceBuildUp!=null ? Number(ctx.atSurfaceBuildUp) : 25;
    const motRate = ctx.atMotRate!=null ? Number(ctx.atMotRate) : 0.3;
    const motBase = Number(ctx.atMotBaselineDepth)||150;
    let area = 0, volumeM3 = 0, motT = 0;
    rows.forEach((r,ri)=>{
      const wm = Number(r.width)||0, lm = Number(r.length)||0;
      if(!(wm*lm>0)) return;
      const a = r6((r6(wm*1000)*r6(lm*1000))/1e6);
      const d = Number(r.digOutDepth)||0;
      area += a; volumeM3 += a*(d/1000);
      if(buildUp>=d) blockers.push(`Row ${ri+1}${(r.desc||'').trim()?` (${r.desc.trim()})`:''}: the dig-out depth (${d}mm) must be deeper than the ${buildUp}mm surface build-up`);
      motT += a*motRate*(Math.max(0, d-buildUp)/motBase);
    });
    const has = area>0;
    const find = (lib, name) => name ? (ctx[lib]||[]).find(x=>x.name===name) : null;
    const turf = find('atTurf', opt.turfProduct), grano = find('atGrano', opt.grano), infill = find('atInfill', opt.infill);
    const steel = opt.edgingStyle===GRAVEL_STEEL_EDGING;
    const es = steel ? null : find('atEdgingStyles', opt.edgingStyle);
    const edgingLen = steel ? 0 : (Number(opt.edgingLength)||0);
    const concrete = !!es && edgingLen>0;
    const tape = edgingLen>0 ? find('atSeamTape', opt.seamTape) : null;
    if(has){
      if(!turf) blockers.push("Select an artificial turf");
      if(!grano) blockers.push("Select a grano dust");
      if(!infill) blockers.push("Select an infill sand");
      if(edgingLen>0){
        if(!es) blockers.push("Select an edging style for the edging length entered");
        else if(!(Number(es.piecesPerMetre)>0)) blockers.push("The edging style's pieces per metre must be greater than 0");
        if(!tape) blockers.push("Select an adhesive seam tape");
      }
    }
    const lib = (prod, qty, unit) => [prod.name, qty, ctx.netPrice(prod.price, prod.vatIncluded), '', unit];
    const mats = [["Type 1 MOT", has ? ru(motT) : 0], ["Geotextile membrane", r6(area)]];
    if(grano) mats.push(lib(grano, has ? ru(area/10) : 0, 'tonne'));
    if(turf) mats.push(lib(turf, has ? ru(area*(1+(Number(ctx.atWastagePercent)||0)/100)) : 0, 'm²'));
    if(infill) mats.push(lib(infill, has ? ru(area/(Number(ctx.atInfillCoverage)||5)) : 0, 'bag'));
    if(tape) mats.push(lib(tape, ru(edgingLen/(Number(ctx.atSeamTapeRollLength)||20)), 'roll'));
    if(concrete){
      const ss = ru(edgingLen/10), bl = ru(edgingLen/10);
      mats.push(lib(es, ru(edgingLen*(Number(es.piecesPerMetre)||0)), 'each'));
      mats.push(["Sharp sand", ss], ["Ballast", bl], ["Cement", 6*ss + 6*bl]);
    }
    mats.push(["Consumables", has ? (ctx.atConsumablesQty!=null ? Number(ctx.atConsumablesQty) : 1) : 0]);
    if(has) bldZeroPriceBlockers(mats, [], ctx).forEach(x=>blockers.push(x));
    const personDays = area/(Number(opt.productivity)||5) + (concrete ? edgingLen/(Number(opt.edgingProductivity)||12) : 0);
    const days = ruq(personDays/(ctx.peopleOnSite||1));
    const plant = [["Plate Compactor",1,days]];
    if(concrete) plant.push(["Cement Mixer",1,days]);
    // Each row's area and its own depth feed the shared waste pool (area-weighted).
    const digOutDepth = has ? (volumeM3/area)*1000 : 0;
    return {area, days, personDays, digOutDepth, blockers, materials:mats, plant, keyFigures:[["Total area",area.toFixed(2)+" m²"],["Days required",days]]};
  }},

concretebase: { label:"Concrete base", group:"Hard landscaping", unitLabel:"Area", cols:["desc","width","length","digOutDepth"],
  colLabels:["Description","Width (m)","Length (m)","Dig-out depth (mm)"],
  // October 2026 rework: per-row dig-out (default 200mm); concrete depth = dig-out − the fixed MOT
  // depth setting; each row can be mixed on site or ready-mix, with or without mesh (rows render
  // as cards — see concreteRowHtml). See calc().
  rowHtml:(r,i,o)=>concreteRowHtml(r,i,o),
  options:[
    {key:"shutteringProduct",label:"Shuttering (£ per board)",type:"select",source:"cbShuttering",default:"",placeholder:"Select shuttering…",
      sourceLabel:e=>`${e.name} — ${Number(e.lengthMm)||0}mm board`, addLabel:"shuttering board", addFields:["price","lengthMm"]},
    {key:"shutteringLength",label:"Shuttering length (m)",type:"number",default:"",placeholder:"Blank = no shuttering",
      hint:"Boards = ROUNDUP(length ÷ board length) × boards high (concrete depth ÷ board height, rounded up)."},
    {key:"screwProduct",label:"Screws (£ per box)",type:"select",source:"cbScrews",default:"",placeholder:"Select screws…",addLabel:"screws (price per box)",addFields:["price"]},
    {key:"productivity",label:"Productivity (m²/day/person)",type:"number",default:5,hint:"How much ONE PERSON lays per day — override for this job if needed."},
  ],
  calc(rows, opt, ctx){
    // A quote saved before the rework (single job-level concrete depth) prices the old way.
    if(opt.depth!==undefined && !rows.some(r=>r.digOutDepth!==undefined)){
      const area = sum(rows.map(r=>(Number(r.width)||0)*(Number(r.length)||0)));
      const edge = 2 * (sum(rows.map(r=>Number(r.width)||0)) + sum(rows.map(r=>Number(r.length)||0)));
      const personDays = area/(Number(opt.productivity)||5);
      const days = ruq(personDays/(ctx.peopleOnSite||1));
      const f = (Number(opt.depth)||100)/100;
      const ss = ru(area/10*f), bl = ru(area/10*f);
      return {area, days, personDays, digOutDepth:Number(opt.depth)||100, materials:[["Type 1 MOT", ru(area/5*f)],["Rebar mesh", ru(area/5*f)],["Shuttering timber", ru(edge/2.4)*2],["Sharp sand", ss],["Ballast", bl],["Cement", 6*ss+6*bl],["Box of 5x80mm screws", area>0?1:0],["Consumables", area>0?1:0]],
        plant:[["Plate Compactor",1,days],["Cement Mixer",1,days]], keyFigures:[["Total area",area.toFixed(2)+" m²"],["Edge length",edge.toFixed(2)+" m"]]};
    }
    const blockers = [];
    const motDepth = ctx.cbMotDepth!=null ? Number(ctx.cbMotDepth) : 100;
    const motRate = ctx.cbMotRate!=null ? Number(ctx.cbMotRate) : 0.3;
    const motBase = Number(ctx.cbMotBaselineDepth)||150;
    const find = (lib, name) => name ? (ctx[lib]||[]).find(x=>x.name===name) : null;
    let area = 0, digVol = 0, motT = 0, mixedVol = 0, maxConc = 0;
    const readyMix = {}, mesh = {};
    rows.forEach((r,ri)=>{
      const wm = Number(r.width)||0, lm = Number(r.length)||0;
      if(!(wm*lm>0)) return;
      const label = `Row ${ri+1}${(r.desc||'').trim()?` (${r.desc.trim()})`:''}`;
      const a = r6((r6(wm*1000)*r6(lm*1000))/1e6);
      const D = cbRowDig(r, opt, motDepth);
      area += a; digVol += a*(D/1000);
      motT += a*motRate*(motDepth/motBase);
      if(D<=motDepth){ blockers.push(`${label}: the dig-out depth (${D}mm) must be deeper than the ${motDepth}mm MOT depth`); return; }
      const cd = D - motDepth;
      maxConc = Math.max(maxConc, cd);
      const vol = a*(cd/1000);
      if(r.readyMix){
        const rm = find('cbReadyMix', r.readyMixProduct);
        if(!rm) blockers.push(`${label}: pick a ready-mix concrete`);
        else { const e = readyMix[rm.name] || (readyMix[rm.name] = {qty:0, prod:rm}); e.qty += vol; }
      } else mixedVol += vol;
      if(r.rebar!==false){
        const m = find('cbMesh', r.meshProduct);
        if(!m) blockers.push(`${label}: pick a rebar mesh`);
        else {
          const sheet = ((Number(m.widthMm)||0)*(Number(m.lengthMm)||0))/1e6;
          if(!(sheet>0)) blockers.push(`The mesh "${m.name}" needs a sheet width and length`);
          else { const e = mesh[m.name] || (mesh[m.name] = {qty:0, prod:m}); e.qty += a/sheet; }
        }
      }
    });
    const has = area>0;
    const lib = (prod, qty, unit) => [prod.name, qty, ctx.netPrice(prod.price, prod.vatIncluded), '', unit];
    const mats = [["Type 1 MOT", has ? ru(motT) : 0]];
    // Mixed on site: scale the baseline (10m² at 100mm = 1m³ → 1t ballast, 1t sharp sand, 12 bags).
    if(mixedVol>0){
      const baseVol = (Number(ctx.cbBaseArea)||10)*((Number(ctx.cbBaseDepth)||100)/1000);
      const scale = baseVol>0 ? mixedVol/baseVol : 0;
      mats.push(["Sharp sand", ru(scale*(Number(ctx.cbSharpSand)||0))], ["Ballast", ru(scale*(Number(ctx.cbBallast)||0))], ["Cement", ru(scale*(Number(ctx.cbCement)||0))]);
    }
    // Ready-mix is ordered in 0.5m³ steps — round each product's total volume up to the next 0.5.
    Object.values(readyMix).forEach(({qty,prod})=>mats.push(lib(prod, ru(qty*2)/2, 'm³')));
    Object.values(mesh).forEach(({qty,prod})=>mats.push(lib(prod, ru(qty), 'sheet')));
    const shutLen = Number(opt.shutteringLength)||0;
    if(shutLen>0 && has){
      const sh = find('cbShuttering', opt.shutteringProduct);
      if(!sh) blockers.push("Select a shuttering board for the shuttering length entered");
      else if(!(Number(sh.lengthMm)>0)) blockers.push(`The shuttering "${sh.name}" needs a board length (mm)`);
      else {
        const high = ru(maxConc/(Number(ctx.cbBoardHeight)||150));
        mats.push(lib(sh, ru(r6(shutLen*1000)/Number(sh.lengthMm))*high, 'board'));
      }
    }
    if(has){
      const sc = find('cbScrews', opt.screwProduct);
      if(!sc) blockers.push("Select the screws");
      else mats.push(lib(sc, ctx.cbScrewsQty!=null ? Number(ctx.cbScrewsQty) : 1, 'box'));
    }
    mats.push(["Consumables", has ? (ctx.cbConsumablesQty!=null ? Number(ctx.cbConsumablesQty) : 1) : 0]);
    const personDays = area/(Number(opt.productivity)||5);
    const days = ruq(personDays/(ctx.peopleOnSite||1));
    const plant = [["Plate Compactor",1,days]];
    if(mixedVol>0) plant.push(["Cement Mixer",1,days]);
    if(has) bldZeroPriceBlockers(mats, plant, ctx).forEach(x=>blockers.push(x));
    // Each row's area and its full dig-out depth feed the shared waste pool (area-weighted).
    const digOutDepth = has ? (digVol/area)*1000 : 0;
    return {area, days, personDays, digOutDepth, motDepth, blockers, materials:mats, plant, keyFigures:[["Total area",area.toFixed(2)+" m²"],["Days required",days]]};
  }},

brickwall: { label:"Block Retaining Wall", group:"Walls", unitLabel:"Area", cols:["desc","length","height","footingLength","footingWidth","footingDepth"],
  colLabels:["Description","Length (m)","Height (m)","Footing length (m)","Footing width (mm)","Footing depth (mm)"],
  // Footing length follows the row's wall length until overwritten (see the data-mf listener).
  rowDefaults:{footingWidth:450, footingDepth:300},
  options:[
    {key:"faceSkin",label:"Face skin?",type:"yesno",default:false},
    {key:"faceProduct",label:"Face skin product",type:"select",source:"brickwallFaceProducts",default:"",showIf:"faceSkin",placeholder:"Select a face product…",
      addLabel:"face product", addFields:["price","facePricedPer","piecesPerM2","thicknessMm"],
      hint:"Pick a face product you've added, or add a new one — priced per piece (with pieces per m²) or per m², plus its thickness for the coping width."},
    {key:"rebar",label:"Rebar in footing?",type:"yesno",default:false},
    {key:"rebarProduct",label:"Rebar",type:"select",source:"brickwallRebar",default:"",showIf:"rebar",placeholder:"Select a rebar…",
      addLabel:"rebar", addFields:["price","lengthMm"],
      hint:"Pick a rebar you've added, or add a new one (price per bar and bar length in mm)."},
    {key:"coping",label:"Coping?",type:"yesno",default:false},
    {key:"copingProduct",label:"Coping",type:"select",source:"brickwallCopings",default:"",showIf:"coping",placeholder:"Select a coping…",
      extraOptions:()=>((S.settings.customStyleOptions && S.settings.customStyleOptions.paving)||[]).map(n=>({value:COPING_SLAB_PREFIX+n, label:n+" (paving slab, per m²)"})),
      addLabel:"coping", addFields:["price","copingPricedPer"],
      hint:"Pick one of your paving slab types or a coping product, or add a new coping (per metre or per m²). Per-m² coping is sized from the wall thickness, face skin and overhang."},
    {key:"compost",label:"Compost needed?",type:"yesno",default:false},
    {key:"compostArea",label:"Compost area (m²)",type:"number",default:0,showIf:"compost"},
    {key:"productivity",label:"Productivity (m²/day/person)",type:"number",default:2.7,hint:"How much wall area ONE PERSON builds per day — override for this job if needed."},
  ],
  calc(rows, opt, ctx){
    // Whole mm per row (r6/ru round to 6dp first). The footings are the dig-out: their plan area
    // and volume feed the shared waste pool (wasteArea + area-weighted footing depth).
    const blockers = [];
    const rebarLines = Number(ctx.brickwallRebarLines)||0;
    const lap = Number(ctx.brickwallRebarLap)||0;
    const rebar = opt.rebar && opt.rebarProduct ? (ctx.brickwallRebar||[]).find(x=>x.name===opt.rebarProduct) : null;
    const barLen = rebar ? (Number(rebar.lengthMm)||0) : 0;
    let wallArea=0, wallLen=0, footArea=0, footVol=0, rebarQty=0; const widths=[], depths=[];
    rows.forEach(r=>{
      const lm = Number(r.length)||0, hm = Number(r.height)||0;
      wallArea += lm*hm; wallLen += lm;
      const flm = (r.footingLength===undefined || r.footingLength==='') ? lm : (Number(r.footingLength)||0);
      const fw = r.footingWidth===undefined ? 450 : (Number(r.footingWidth)||0);
      const fd = r.footingDepth===undefined ? 300 : (Number(r.footingDepth)||0);
      if(!(flm>0 && fw>0 && fd>0)) return;
      const FL = r6(flm*1000);
      footArea += flm*(fw/1000);
      footVol += flm*(fw/1000)*(fd/1000);
      widths.push(fw); depths.push(fd);
      if(rebar && barLen-lap>0) rebarQty += ru(FL/(barLen-lap)) * rebarLines;
    });
    const hasWall = wallLen>0;
    // Footing concrete, scaled from the editable baseline (10m² at 100mm = 1m³ -> 1t ballast,
    // 1t sharp sand, 12 bags cement by default).
    const baseVol = (Number(ctx.brickwallFootingBaseArea)||10) * ((Number(ctx.brickwallFootingBaseDepth)||100)/1000);
    const scale = baseVol>0 ? footVol/baseVol : 0;
    const ballast = r6(scale*(Number(ctx.brickwallFootingBallast)||0));
    const sharpSand = r6(scale*(Number(ctx.brickwallFootingSharpSand)||0));
    const footingCement = scale*(Number(ctx.brickwallFootingCement)||0);
    // Skins: inside skin always concrete blocks; optional tenant face product.
    const face = opt.faceSkin && opt.faceProduct ? (ctx.brickwallFaceProducts||[]).find(x=>x.name===opt.faceProduct) : null;
    const skins = opt.faceSkin ? 2 : 1;
    const blocks = ru(wallArea*(Number(ctx.brickwallBlocksPerM2)||0));
    let faceQty = 0;
    if(face) faceQty = face.facePricedPer==="m2" ? wallArea : ru(wallArea*(Number(face.piecesPerM2)||0));
    const sand = ru(wallArea/14)*skins;
    const feb = ru(wallArea/10)*skins;
    const cement = ru(footingCement + 6*sand);
    const wallTies = opt.faceSkin ? ru(wallArea/10) : 0;
    const peaShingle = ru((wallArea/6)/3);
    // Coping: a paving slab type (per m², materials-list price) or a tenant coping product.
    let copingLine = ['', 0], copingErr = null;
    if(opt.coping && hasWall){
      const cp = opt.copingProduct||'';
      const isSlab = cp.indexOf(COPING_SLAB_PREFIX)===0;
      const slabName = isSlab ? cp.slice(COPING_SLAB_PREFIX.length) : '';
      const lib = !isSlab && cp ? (ctx.brickwallCopings||[]).find(x=>x.name===cp) : null;
      const perM2 = isSlab || (lib && lib.copingPricedPer==="m2");
      const faceThk = opt.faceSkin ? (face && face.thicknessMm!=null && face.thicknessMm!=='' ? Number(face.thicknessMm) : null) : 0;
      const widthMm = (Number(ctx.brickwallWallThickness)||0) + (faceThk||0) + 2*(Number(ctx.brickwallCopingOverhang)||0);
      const qty = perM2 ? ru(wallLen*widthMm/1000) : wallLen;
      if(!isSlab && !lib) copingErr = "Select a coping";
      else if(perM2 && opt.faceSkin && face && faceThk==null) copingErr = "Add a thickness to the face product — it's needed for the coping width";
      else if(isSlab){ if(!(ctx.price(slabName)>0)) copingErr = "The coping price can't be £0"; copingLine = [slabName, qty]; }
      else { if(!(Number(lib.price)>0)) copingErr = "The coping price can't be £0"; copingLine = [cp, qty, ctx.netPrice(lib.price, lib.vatIncluded), '', perM2?'m²':'m']; }
    }
    if(hasWall){
      if(footVol>0 && !(ctx.price("Sharp sand")>0)) blockers.push("Sharp sand has no price — enter one in Materials (it's shared with Paving and Block paving)");
      if(opt.faceSkin){
        if(!face) blockers.push("Select a face skin product");
        else if(face.facePricedPer!=="m2" && !(Number(face.piecesPerM2)>0)) blockers.push("The face product needs a pieces-per-m² figure");
        else if(!(Number(face.price)>0)) blockers.push("The face product price can't be £0");
        if(wallTies>0 && !(ctx.price("Wall ties")>0)) blockers.push("Wall ties have no price — enter one in Materials");
      }
      if(opt.rebar){
        if(!rebar) blockers.push("Select a rebar");
        else if(!(barLen-lap>0)) blockers.push("The rebar's bar length must be longer than the lap allowance");
        else if(!(Number(rebar.price)>0)) blockers.push("The rebar price can't be £0");
      }
      if(peaShingle>0 && !(ctx.price("Pea shingle")>0)) blockers.push("Pea shingle has no price — enter one in Materials");
      if(copingErr) blockers.push(copingErr);
    }
    const personDays = (wallArea/(Number(opt.productivity)||2.7)) + (opt.coping ? wallLen/(Number(ctx.brickwallFinishingProductivity)||10) : 0);
    const days = ruq(personDays/(ctx.peopleOnSite||1));
    const mats = [
      ["Ballast", ballast],
      ["Sharp sand", sharpSand],
      ["Building sand", sand],
      ["Cement", cement],
      ["Feb", feb],
      ["Concrete blocks", blocks],
      face ? [opt.faceProduct, faceQty, ctx.netPrice(face.price, face.vatIncluded), '', face.facePricedPer==="m2"?'m²':'each'] : ['', 0],
      ["Wall ties", wallTies],
      rebar ? [opt.rebarProduct, rebarQty, ctx.netPrice(rebar.price, rebar.vatIncluded), '', 'each'] : ['', 0],
      ["Blackjack DPM", ru(wallArea/10)],
      ["Pea shingle", peaShingle],
      ["Geotextile membrane", ru(wallArea)],
      copingLine,
      ["Multi purpose peat free compost", opt.compost ? ru((Number(opt.compostArea)||0)/5) : 0],
      ["Consumables", hasWall ? (ctx.brickwallConsumablesQty!=null ? Number(ctx.brickwallConsumablesQty) : 1) : 0],
    ];
    const plant = [["Plate Compactor",1,days],["Cement Mixer",1,days]];
    const digOutDepth = footArea>0 ? (footVol/footArea)*1000 : 0;
    return {area:wallArea, wasteArea:footArea, days, personDays, digOutDepth, blockers, materials:mats, plant,
      keyFigures:[["Wall area",wallArea.toFixed(2)+" m²"],["Wall length",wallLen.toFixed(2)+" m"],["Footing volume",footVol.toFixed(3)+" m³"]]};
  }},

sleeperwall: { label:"Sleeper retaining wall", group:"Walls", unitLabel:"Area", cols:["desc","length","height"],
  colLabels:["Description","Length (m)","Height (m)"],
  options:[
    // October 2026: sleepers and screws are tenant-built products with no default. The post is the
    // same 100x100mm stock post as Timber decking, sharing its stock length / in-ground depth /
    // postcrete bags settings. See calc().
    {key:"sleeper",label:"Sleeper",type:"select",source:"sleeperProducts",default:"",placeholder:"Select a sleeper…",
      addLabel:"sleeper", addFields:["price","lengthMm","heightMm"],
      hint:"Pick a sleeper you've added, or add a new one (price per sleeper, length and height in mm)."},
    {key:"screws",label:"Screws",type:"select",source:"sleeperScrews",default:"",placeholder:"Select a screw…",
      addLabel:"screw", addFields:["price","screwsPerBox"],
      hint:"Pick a screw you've added, or add a new one (price per box and screws per box)."},
    {key:"productivity",label:"Productivity (m²/day/person)",type:"number",default:10,hint:"How much wall area ONE PERSON builds per day — override for this job if needed."},
  ],
  calc(rows, opt, ctx){
    // Whole mm per row (r6/ru/rd round to 6dp first).
    const blockers = [];
    const sl = opt.sleeper ? (ctx.sleeperProducts||[]).find(x=>x.name===opt.sleeper) : null;
    const slLen = sl ? (Number(sl.lengthMm)||0) : 0, slHt = sl ? (Number(sl.heightMm)||0) : 0;
    // A quote saved before the rework has no sleeper/screw choice — those two lines keep the old
    // fixed sleeper (2.4m × 200mm) and one-box-per-4-sleepers rule; everything else is new.
    const legacy = opt.sleeper===undefined && opt.screws===undefined;
    const spacing = Number(ctx.sleeperPostSpacing)||1200;
    let area=0, totalLen=0, sleepers=0, legacySleepers=0, posts=0, tallest=0;
    rows.forEach(r=>{
      const lm = Number(r.length)||0, hm = Number(r.height)||0;
      if(!(lm>0 && hm>0)) return;
      const L = r6(lm*1000), H = r6(hm*1000);
      area += lm*hm; totalLen += lm; tallest = Math.max(tallest, H);
      if(slLen>0 && slHt>0) sleepers += ru(L/slLen) * ru(H/slHt);
      legacySleepers += ru(lm/2.4) * ru(hm/0.2);
      posts += ru(L/spacing) + 1;   // includes an end post on every run
    });
    const hasArea = area>0;
    const personDays = area/(Number(opt.productivity)||10);
    const days = ruq(personDays/(ctx.peopleOnSite||1));
    // Posts cut from stock lengths: cut = in-ground depth + tallest row height.
    const stockLen = Number(ctx.timberPostStockLength)||2400;
    const cutLen = (Number(ctx.compositePostInGroundDepth)||0) + tallest;
    const cuts = cutLen>0 ? rd(stockLen/cutLen) : 0;
    let stockPosts = 0;
    if(posts>0){
      if(cuts<1) blockers.push("Wall height needs a longer post than the stock length");
      else stockPosts = ru(posts/cuts);
    }
    const postcrete = posts * (Number(ctx.timberPostcreteBagsPerPost)||0);
    const scr = opt.screws ? (ctx.sleeperScrews||[]).find(x=>x.name===opt.screws) : null;
    const perBox = scr ? (Number(scr.screwsPerBox)||0) : 0;
    const boxes = perBox>0 ? ru(sleepers*(Number(ctx.sleeperScrewsPerSleeper)||0)/perBox) : 0;
    const dpm = ru(area/10);
    if(hasArea){
      if(!legacy){
        if(!sl) blockers.push("Select a sleeper");
        else if(!(slLen>0 && slHt>0)) blockers.push("The sleeper's length and height must be greater than 0");
        else if(!(Number(sl.price)>0)) blockers.push("The sleeper price can't be £0");
        if(!scr) blockers.push("Select a screw product");
        else if(!(perBox>0)) blockers.push("The screw product needs a screws-per-box figure");
        else if(!(Number(scr.price)>0)) blockers.push("The screw price can't be £0");
      }
      if(stockPosts>0 && !(ctx.price("100x100mm Treated timber post")>0)) blockers.push("The 100x100mm post has no price — enter one in Materials");
      if(postcrete>0 && !(ctx.price("Postcrete")>0)) blockers.push("Postcrete has no price — enter one in Materials");
      if(dpm>0 && !(ctx.price("Blackjack DPM")>0)) blockers.push("Blackjack DPM has no price — enter one in Materials");
    }
    const mats = [
      legacy ? ["Sleeper", legacySleepers] : [sl? opt.sleeper:'', sl? sleepers:0, sl? ctx.netPrice(sl.price, sl.vatIncluded):0, '', 'each'],
      ["100x100mm Treated timber post", stockPosts],
      ["Postcrete", postcrete],
      legacy ? ["Box of 150mm hex head timber screws", ru(legacySleepers/4)] : [scr? opt.screws:'', scr? boxes:0, scr? ctx.netPrice(scr.price, scr.vatIncluded):0, '', 'box'],
      ["Blackjack DPM", dpm],
      ["Consumables", hasArea ? (ctx.sleeperConsumablesQty!=null ? Number(ctx.sleeperConsumablesQty) : 1) : 0],
    ];
    return {area, days, personDays, blockers, materials:mats, plant:[], keyFigures:[["Wall area",area.toFixed(2)+" m²"],["Wall length",totalLen.toFixed(2)+" m"]]};
  }},

pond: { label:"Pond", group:"Features", unitLabel:"Area", cols:["desc","length","width","digOutDepth"],
  colLabels:["Description","Length (m)","Width (m)","Dig-out depth (mm)"],
  // October 2026 rework: each row is its own pond with its own dig-out depth (default from
  // Settings, 600mm) and its own liner, pump and filter (tenant-built products). Rows render as
  // cards — see pondRowHtml.
  rowDefaults:{pumpQty:1, filterQty:1},
  rowHtml:(r,i,o)=>pondRowHtml(r,i,o),
  options:[
    {key:"bridge",label:"Bridge?",type:"yesno",default:false},
    {key:"bridgeProduct",label:"Bridge",type:"select",source:"pondBridges",default:"",showIf:"bridge",placeholder:"Select a bridge…",
      addLabel:"bridge", addFields:["price"], hint:"Pick a bridge you've added, or add a new one (price each)."},
    {key:"productivity",label:"Productivity (m²/day/person)",type:"number",default:16.7,hint:"How much ONE PERSON gets through per day — override for this job if needed."},
  ],
  calc(rows, opt, ctx){
    const blockers = [];
    // Rows saved before the rework have no per-row pump/filter quantities — price those the old
    // way (footprint liner/underlay, 1 or 2 pumps and filters by area) so old quotes still open.
    const legacy = !rows.some(r=>r.pumpQty!==undefined);
    const overlap = Number(ctx.pondLinerOverlap)||0;
    const legacyDepth = Number(opt.digOutDepth)>0 ? Number(opt.digOutDepth) : 400;
    let area = 0, volumeM3 = 0, underlayM2 = 0;
    const liners = {}, pumps = {}, filters = {};
    const add = (map, prod, q) => { const e = map[prod.name] || (map[prod.name] = {qty:0, prod}); e.qty += q; };
    rows.forEach((r,ri)=>{
      const lm = Number(r.length)||0, wm = Number(r.width)||0;
      if(!(lm*wm>0)) return;
      const label = `Row ${ri+1}${(r.desc||'').trim()?` (${r.desc.trim()})`:''}`;
      const D = r.digOutDepth===undefined ? legacyDepth : (Number(r.digOutDepth)||0);
      const L = r6(lm*1000), W = r6(wm*1000);
      area += lm*wm; volumeM3 += lm*wm*(D/1000);
      if(legacy) return;
      // Liner/underlay size: (L + 2×depth + 2×overlap) × (W + 2×depth + 2×overlap).
      const reqL = r6(L + 2*D + 2*overlap), reqW = r6(W + 2*D + 2*overlap);
      underlayM2 += (reqL*reqW)/1e6;
      const ln = r.liner ? (ctx.pondLiners||[]).find(x=>x.name===r.liner) : null;
      if(!ln) blockers.push(`${label}: pick a liner (needs at least ${reqL} × ${reqW} mm)`);
      else {
        const a = Number(ln.lengthMm)||0, b = Number(ln.widthMm)||0;
        const fits = (a>=reqL && b>=reqW) || (a>=reqW && b>=reqL);
        if(!fits) blockers.push(`${label}: liner "${ln.name}" (${a} × ${b} mm) is too small — it needs at least ${reqL} × ${reqW} mm`);
        add(liners, ln, 1);
      }
      const pq = (r.pumpQty===undefined || r.pumpQty==='') ? 1 : (Number(r.pumpQty)||0);
      const fq = (r.filterQty===undefined || r.filterQty==='') ? 1 : (Number(r.filterQty)||0);
      const pu = r.pump ? (ctx.pondPumps||[]).find(x=>x.name===r.pump) : null;
      const fi = r.filter ? (ctx.pondFilters||[]).find(x=>x.name===r.filter) : null;
      if(pq>0){ if(!pu) blockers.push(`${label}: pick a pump`); else add(pumps, pu, pq); }
      if(fq>0){ if(!fi) blockers.push(`${label}: pick a filter`); else add(filters, fi, fq); }
    });
    const hasArea = area>0;
    const personDays = area/(Number(opt.productivity)||16.7);
    const days = ruq(personDays/(ctx.peopleOnSite||1));
    const mats = [];
    if(legacy){
      const pumpQty = area<=0 ? 0 : (area>20 ? 2 : 1);
      mats.push(["Pond underlay", area], ["Pond liner", area], ["Pump", pumpQty], ["Filter", pumpQty],
        ["Rocks", ru(area/5)], ["Bridge", opt.bridge?1:0]);
    } else {
      const lib = (m, unit) => Object.values(m).forEach(({qty,prod})=>mats.push([prod.name, r6(qty), ctx.netPrice(prod.price, prod.vatIncluded), '', unit]));
      lib(liners, 'liner'); mats.push(["Pond underlay", r6(underlayM2)]); lib(pumps, 'each'); lib(filters, 'each');
      mats.push(["Rocks", hasArea ? ru(area/(Number(ctx.pondRocksCoverage)||5)) : 0]);
      if(opt.bridge && hasArea){
        const br = opt.bridgeProduct ? (ctx.pondBridges||[]).find(x=>x.name===opt.bridgeProduct) : null;
        if(!br) blockers.push("Select a bridge");
        else mats.push([br.name, 1, ctx.netPrice(br.price, br.vatIncluded), '', 'each']);
      }
    }
    mats.push(["Consumables", hasArea ? (legacy ? 1 : (ctx.pondConsumablesQty!=null ? Number(ctx.pondConsumablesQty) : 1)) : 0]);
    if(hasArea && !legacy) bldZeroPriceBlockers(mats, [], ctx).forEach(x=>blockers.push(x));
    // Each row's area and its own depth feed the shared waste pool (area-weighted depth); the
    // pond keeps no digger line of its own.
    const digOutDepth = hasArea ? (volumeM3/area)*1000 : 0;
    return {area, days, personDays, digOutDepth, blockers, materials:mats, plant:[], keyFigures:[["Total area",area.toFixed(2)+" m²"],["Days required",days]]};
  }},

pergola: { label:"Pergola", group:"Features", unitLabel:"Area", cols:["desc","length","width","heightMm"],
  colLabels:["Description","Length (m)","Width (m)","Pergola height (mm)"],
  rowDefaults:{heightMm:2400},
  options:[
    // October 2026 rework: posts, joists, DPM, screws, OSB and roof coverings are tenant-built
    // products (no fixed list or default). Everything is per row in whole mm. See calc().
    {key:"postProduct",label:"Post (£ each)",type:"select",source:"pgPosts",default:"",placeholder:"Select a post…",addLabel:"post",addFields:["price"],
      hint:"Any size or timber — each is its own product. Posts are cut from stock lengths (Settings → Pricing → Pergola)."},
    {key:"joistProduct",label:"Joist (£ per piece)",type:"select",source:"pgJoists",default:"",placeholder:"Select a joist…",
      sourceLabel:e=>`${e.name} — ${Number(e.lengthMm)||0}mm`, addLabel:"joist",addFields:["price","lengthMm"],
      hint:"Name carries the section and timber, e.g. \"6x2 treated timber\" or \"6x2 oak\"."},
    {key:"dpmProduct",label:"Blackjack DPM (£ per tin)",type:"select",source:"pgDpm",default:"",placeholder:"Select a DPM…",addLabel:"DPM (price per tin)",addFields:["price"]},
    {key:"screwProduct",label:"Screws (£ per box)",type:"select",source:"pgScrews",default:"",placeholder:"Select screws…",addLabel:"screws (price per box)",addFields:["price"]},
    {key:"roof",label:"Roof?",type:"yesno",default:false},
    {key:"osbProduct",label:"OSB board (£ per board)",type:"select",source:"pgOsb",default:"",showIf:"roof",placeholder:"Select an OSB board…",addLabel:"OSB board (price per board)",addFields:["price"]},
    {key:"coveringProduct",label:"Roof covering",type:"select",source:"pgCoverings",default:"",showIf:"roof",placeholder:"Select a roof covering…",
      sourceLabel:e=>`${e.name} — ${Number(e.coverageM2)||0}m² per unit`, addLabel:"roof covering",addFields:["price","coverageM2"]},
    {key:"productivity",label:"Productivity (m²/day/person)",type:"number",default:16.7,hint:"How much ONE PERSON builds per day — override for this job if needed."},
  ],
  calc(rows, opt, ctx){
    // A quote saved before the rework (old fixed post list) prices the old way.
    if(opt.postProduct===undefined && opt.post!==undefined){
      const area = sum(rows.map(r=>(Number(r.length)||0)*(Number(r.width)||0)));
      const sumW = sum(rows.map(r=>Number(r.width)||0)), sumL = sum(rows.map(r=>Number(r.length)||0));
      const personDays = area/(Number(opt.productivity)||16.7);
      const days = ruq(personDays/(ctx.peopleOnSite||1));
      const joistName = /oak/i.test(opt.post) ? "6x2 oak joists" : "6x2 treated timber";
      const joistQty = ru(2*sumW + sum(rows.map(r=>((Number(r.width)||0)/0.4)*(Number(r.length)||0))) + sumL);
      const postQty = ru(area/9)*4;
      const mats = [[opt.post, postQty],["Postcrete", postQty*2],[joistName, joistQty],["100mm hexhead timberscrews", ru(area/10)],["Blackjack DPM", ru(area/30)],["Consumables", area>0?1:0]];
      if(opt.roof){ mats.push(["OSB board", ru(area/2)]); if(opt.roofCovering==="Felt") mats.push(["Roofing felt", ru(area/5)]); else if(opt.roofCovering==="Shingle") mats.push(["Roof shingle pack", ru(area/2)]); }
      return {area, days, personDays, materials:mats, plant:[], keyFigures:[["Total area",area.toFixed(2)+" m²"]]};
    }
    const blockers = [];
    const find = (lib, name) => name ? (ctx[lib]||[]).find(x=>x.name===name) : null;
    const post = find('pgPosts', opt.postProduct), joist = find('pgJoists', opt.joistProduct);
    const dpm = find('pgDpm', opt.dpmProduct), screw = find('pgScrews', opt.screwProduct);
    const spacing = Number(ctx.pgPostSpacing)||3000, stock = Number(ctx.pgStockPostLength)||3000;
    const inGround = Number(ctx.compositePostInGroundDepth)||0, centres = Number(ctx.pgRafterCentres)||400;
    const jl = joist ? (Number(joist.lengthMm)||0) : 0;
    let area = 0, posts = 0, stockPosts = 0, joistPieces = 0, tooTall = false;
    rows.forEach((r,ri)=>{
      const lm = Number(r.length)||0, wm = Number(r.width)||0;
      if(!(lm*wm>0)) return;
      const L = r6(lm*1000), W = r6(wm*1000), H = Number(r.heightMm)||0;
      area += r6((L*W)/1e6);
      if(!(H>0)) blockers.push(`Row ${ri+1}${(r.desc||'').trim()?` (${r.desc.trim()})`:''}: enter the pergola height (mm)`);
      // Posts both sides: 2 × (ROUNDUP(length ÷ spacing) + 1); each cut = in-ground + height.
      const pr = 2*(ru(L/spacing)+1);
      posts += pr;
      const cut = inGround + H;
      const cuts = cut>0 ? rd(stock/cut) : 0;
      if(cuts<1){ tooTall = true; blockers.push(`Row ${ri+1}${(r.desc||'').trim()?` (${r.desc.trim()})`:''}: a ${cut}mm post cut (in-ground ${inGround}mm + height ${H}mm) is longer than the ${stock}mm stock post`); }
      else stockPosts += ru(pr/cuts);
      // Beams: 2 × ROUNDUP(width ÷ joist length); rafters: (ROUNDUP(length ÷ centres) + 1) × ROUNDUP(width ÷ joist length).
      if(jl>0) joistPieces += 2*ru(W/jl) + (ru(L/centres)+1)*ru(W/jl);
    });
    const has = area>0;
    if(has){
      if(!post) blockers.push("Select a post");
      if(!joist) blockers.push("Select a joist");
      else if(!(jl>0)) blockers.push(`The joist "${joist.name}" needs a length (mm)`);
      if(!dpm) blockers.push("Select a Blackjack DPM");
      if(!screw) blockers.push("Select the screws");
    }
    const lib = (prod, qty, unit) => [prod.name, qty, ctx.netPrice(prod.price, prod.vatIncluded), '', unit];
    const mats = [];
    if(post) mats.push(lib(post, stockPosts, 'each'));
    mats.push(["Postcrete", posts*(Number(ctx.timberPostcreteBagsPerPost)||0)]);
    if(dpm) mats.push(lib(dpm, posts>0 ? ru(posts/(Number(ctx.pgPostsPerTin)||30)) : 0, 'tin'));
    if(joist) mats.push(lib(joist, joistPieces, 'piece'));
    if(screw) mats.push(lib(screw, has ? ru(area/(Number(ctx.pgScrewCoverage)||10)) : 0, 'box'));
    if(opt.roof && has){
      const osb = find('pgOsb', opt.osbProduct), cov = find('pgCoverings', opt.coveringProduct);
      if(!osb) blockers.push("Select an OSB board for the roof");
      else mats.push(lib(osb, ru(area/(Number(ctx.pgOsbCoverage)||2)), 'board'));
      if(!cov) blockers.push("Select a roof covering");
      else if(!(Number(cov.coverageM2)>0)) blockers.push(`The roof covering "${cov.name}" needs a coverage (m² per unit)`);
      else mats.push(lib(cov, ru(area/Number(cov.coverageM2)), 'unit'));
    }
    mats.push(["Consumables", has ? (ctx.pgConsumablesQty!=null ? Number(ctx.pgConsumablesQty) : 1) : 0]);
    if(has) bldZeroPriceBlockers(mats, [], ctx).forEach(x=>blockers.push(x));
    const personDays = area/(Number(opt.productivity)||16.7);
    const days = ruq(personDays/(ctx.peopleOnSite||1));
    return {area, days, personDays, blockers, materials:mats, plant:[], keyFigures:[["Total area",area.toFixed(2)+" m²"],["Posts in the ground",posts],["Days required",days]]};
  }},

decking: { label:"Decking", group:"Hard landscaping", unitLabel:"Area", cols:["desc","width","length"],
  colLabels:["Description","Width (m)","Length (m)"],
  options:[
    {key:"type",label:"Decking type",type:"select",options:DECK_TYPES,default:DECK_TYPES[1]},
    {key:"digOut",label:"Dig out necessary?",type:"yesno",default:false},
    {key:"digOutDepth",label:"Dig-out depth (mm)",type:"number",default:150,showIf:"digOut",
      hint:"How deep the ground beneath the deck is dug out — feeds the shared Waste removal & site clearance totals (only while \"Dig out necessary?\" is ticked)."},
    {key:"productivity",label:"Productivity (m²/day/person)",type:"number",default:2.7,hint:"How much decking ONE PERSON builds per day — override for this job if needed."},
  ],
  calc(rows, opt, ctx){
    const area = sum(rows.map(r=>r.width*r.length));
    const totalLen = sum(rows.map(r=>Number(r.length)||0));
    const totalWid = sum(rows.map(r=>Number(r.width)||0));
    const personDays = area/(Number(opt.productivity)||2.7);
    const days = ruq(personDays/(ctx.peopleOnSite||1));
    const isTimber = opt.type==="Timber";
    const postName = isTimber ? "100x100mm Treated timber post":"Composite posts";
    const postQty = isTimber ? ru(area/2) : ru(area);
    const joistName = isTimber ? "6x2 treated timber":"Composite joists";
    const joistQty = area>0 ? ru(totalLen/0.4)*ru(totalWid/3) + 2*ru(totalLen/3) + 1 : 0;
    const boardVariant = isTimber ? "" : opt.type.replace("Composite ","");
    const boardName = isTimber ? "3.6m x 120mm treated timber deck boards" : ("Composite deck boards - "+boardVariant);
    const boardQty = area>0 ? ru(totalLen/3.6)*ru(totalWid/0.125) : 0;
    const mats = [
      [postName, postQty],
      [joistName, joistQty],
      [boardName, boardQty],
      ["Deck screws", ru(boardQty/30)],
      ["Postcrete", postQty],
      ["Geotextile membrane", area],
      ["Consumables", area>0?1:0],
    ];
    const digOutDepth = Number(opt.digOutDepth)||150;
    return {area, days, personDays, digOutDepth, materials:mats, plant:[], keyFigures:[["Total area",area.toFixed(2)+" m²"],["Total length",totalLen.toFixed(2)+" m"],["Total width",totalWid.toFixed(2)+" m"]]};
  }},

      hint:"Pick one you've already added, or add a new one (price per board, plus its length and width in mm)."},
    {key:"productivity",label:"Productivity (m²/day/person)",type:"number",default:2.7,hint:"How much decking ONE PERSON builds per day — override for this job if needed."},
  ],
  calc(rows, opt, ctx){
    // Every formula works in whole mm: rows are entered in metres and converted first. Each
    // quantity is worked out PER ROW (a row with no area contributes nothing), then summed — see
    // r6/ru/rd for the 6-decimal rounding applied before every ROUNDUP/ROUNDDOWN.
    const blockers = [];
    const gap = Number(ctx.compositeBoardGap)||0;
    const joistLen = Number(ctx.compositeJoistLength)||3000;
    const centres = Number(ctx.compositeJoistCentres)||400;
    const noggingSpacing = Number(ctx.compositeNoggingSpacing)||1000;
    const postsPerM2 = Number(ctx.compositePostsPerM2)||1;
    const deckHeight = opt.deckHeight===undefined||opt.deckHeight==='' ? 300 : (Number(opt.deckHeight)||0);
    const board = opt.board ? (ctx.compositeDeckBoards||[]).find(x=>x.name===opt.board) : null;
    const boardLen = board ? (Number(board.lengthMm)||0) : 0;
    const boardWid = board ? (Number(board.widthMm)||0) : 0;
    // A saved quote from before the rework carries a Budget/Standard/Premium tier instead of a
    // board — only its board line keeps the old material name and ratios; posts, joists, screws and
    // postcrete use the new formulas, so re-editing an old quote can change its price.
    const legacyTier = opt.board===undefined && opt.tier;
    const screw = opt.screws ? (ctx.compositeDeckScrews||[]).find(x=>x.name===opt.screws) : null;
    const screwsPerBox = screw ? (Number(screw.screwsPerBox)||0) : 0;
    const screwsPerCrossing = Number(ctx.compositeScrewsPerCrossing)||0;
    const legacyDepth = Number(opt.digOutDepth)>0 ? Number(opt.digOutDepth) : 150;
    let area=0, totalLen=0, totalWid=0, boardQty=0, joistQty=0, nogginJoists=0, posts=0, screwTotal=0, volumeM3=0;
    rows.forEach(r=>{
      const wm = Number(r.width)||0, lm = Number(r.length)||0;
      if(!(wm*lm>0)) return;
      const W = r6(wm*1000), L = r6(lm*1000);
      area += wm*lm; totalLen += lm; totalWid += wm;
      // Boards: along the length, and across the width at (board width + gap) pitch. No wastage.
      if(boardLen>0 && boardWid+gap>0) boardQty += ru(L/boardLen) * ru(W/(boardWid+gap));
      // Joists (full perimeter frame) + joists cut up into noggins.
      joistQty += (ru(L/centres)+1)*ru(W/joistLen) + 2*ru(L/joistLen);
      const nogLines = Math.max(0, ru(W/noggingSpacing)-1);
      const nogPieces = nogLines * ru(L/centres);
      nogginJoists += ru(nogPieces / Math.max(1, rd(joistLen/centres)));
      // Posts: per row, rounded up per row.
      posts += ru(wm*lm*postsPerM2);
      // Screws at every board/joist crossing.
      screwTotal += screwsPerCrossing * ru(W/(boardWid+gap||1)) * (ru(L/centres)+1);
      const rd_ = r.digOutDepth===undefined ? legacyDepth : (Number(r.digOutDepth)||0);
      volumeM3 += wm*lm*(rd_/1000);
    });
    const hasArea = area>0;
    const personDays = area/(Number(opt.productivity)||2.7);
    const days = ruq(personDays/(ctx.peopleOnSite||1));
    // Posts: cut length = in-ground depth + deck height; whole cuts only from each stock post.
    const stockLen = Number(ctx.compositePostStockLength)||2400;
    const cutLen = (Number(ctx.compositePostInGroundDepth)||0) + deckHeight;
    const cuts = cutLen>0 ? rd(stockLen/cutLen) : 0;
    let stockPosts = 0;
    if(posts>0){
      if(cuts<1) blockers.push("Deck height needs a longer post than the stock length");
      else stockPosts = ru(posts/cuts);
    }
    const postcreteQty = posts * (Number(ctx.compositePostcreteBagsPerPost)||0);
    if(postcreteQty>0 && !(ctx.price("Postcrete")>0)) blockers.push("Postcrete has no price — enter one in Materials before finalising this quote");
    const screwBoxes = (screwsPerBox>0) ? ru(screwTotal/screwsPerBox) : 0;
    const boardPrice = board ? ctx.netPrice(board.price, board.vatIncluded) : 0;
    const screwPrice = screw ? ctx.netPrice(screw.price, screw.vatIncluded) : 0;
    if(hasArea && !legacyTier){
      if(!board) blockers.push("Select a deck board for Composite Decking");
      else if(!(boardLen>0 && boardWid>0)) blockers.push("The deck board's length and width must be greater than 0");
      else if(!(Number(board.price)>0)) blockers.push("The deck board price can't be £0");
      if(!screw) blockers.push("Select a decking screw product for Composite Decking");
      else if(!(screwsPerBox>0)) blockers.push("The decking screw's screws-per-box must be greater than 0");
      else if(!(Number(screw.price)>0)) blockers.push("The decking screw price can't be £0");
    }
    // Fascia: run entered in metres; boards = ROUNDUP(run ÷ board length) × ROUNDUP(deck height ÷ board width).
    let fasciaQty = 0, fb = null;
    if(opt.fascia && hasArea){
      const runMm = r6((Number(opt.fasciaRun)||0)*1000);
      fb = opt.fasciaBoard ? (ctx.compositeFasciaBoards||[]).find(x=>x.name===opt.fasciaBoard) : null;
      const legacyFascia = opt.fasciaBoard===undefined && opt.fasciaCount!==undefined;
      if(legacyFascia){ fasciaQty = Number(opt.fasciaCount)||0; }
      else if(!(runMm>0)) blockers.push("Enter the fascia run (m)");
      else if(!fb) blockers.push("Select a fascia board");
      else if(!((Number(fb.lengthMm)||0)>0 && (Number(fb.widthMm)||0)>0)) blockers.push("The fascia board's length and width must be greater than 0");
      else if(!(Number(fb.price)>0)) blockers.push("The fascia board price can't be £0");
      else fasciaQty = ru(runMm/Number(fb.lengthMm)) * ru(deckHeight/Number(fb.widthMm));
    }
    const mats = [
      ["Composite posts", stockPosts],
      ["Composite joists", joistQty + nogginJoists],
      legacyTier ? ["Composite deck boards - "+opt.tier, hasArea ? ru(totalLen/3.6)*ru(totalWid/0.125) : 0]
                 : [board? opt.board:'', board? boardQty:0, board? boardPrice:0, '', 'each'],
      ["Postcrete", postcreteQty],
      [screw? opt.screws:'', screw? screwBoxes:0, screw? screwPrice:0, '', 'box'],
      (opt.fascia && fb) ? [opt.fasciaBoard, fasciaQty, ctx.netPrice(fb.price, fb.vatIncluded), '', 'each']
                         : ["Composite fascia board", (opt.fascia && opt.fasciaBoard===undefined) ? fasciaQty : 0],
      ["Geotextile membrane", area],
      ["Consumables", hasArea ? (ctx.compositeConsumablesQty!=null ? Number(ctx.compositeConsumablesQty) : 1) : 0],
    ];
    // Dig-out feeds the shared waste pool only while "Dig out necessary?" is ticked (see
    // SPOIL_GATE_OPTION) — as the area-weighted average of the per-row depths, which
    // calcWasteRemoval multiplies back by this section's area to recover the exact summed volume.
    const digOutDepth = (opt.digOut && hasArea) ? (volumeM3/area)*1000 : undefined;
    return {area, days, personDays, digOutDepth, blockers, materials:mats, plant:[], keyFigures:[["Total area",area.toFixed(2)+" m²"],["Total length",totalLen.toFixed(2)+" m"],["Total width",totalWid.toFixed(2)+" m"]]};
  }},

timberdecking: { label:"Timber Decking", group:"Hard landscaping", unitLabel:"Area", cols:["desc","width","length"],

    const legacyDepth = Number(opt.digOutDepth)>0 ? Number(opt.digOutDepth) : 150;
    let area=0, totalLen=0, totalWid=0, boardQty=0, joistQty=0, nogginJoists=0, posts=0, screwTotal=0, volumeM3=0;
    rows.forEach(r=>{

      volumeM3 += wm*lm*(rowDepth/1000);

    const hasArea = area>0;

    // Posts: the 100x100mm treated post is the stock post; cut length = in-ground depth + deck height.

      else stockPosts = ru(posts/cuts);

             : [screw? opt.screws:'', screw? screwBoxes:0, screw? ctx.netPrice(screw.price, screw.vatIncluded):0, '', 'box'],

/* October 2026: one "Fencing" service replaces Close-Board / Timber Panel / Composite Fencing
   (those three stay defined below only so old saved quotes still render). Each fence type is a
   builder entry in settings.fenceTypes — posts, lines, plant, options and letter wording — with
   Close-board, Panel and Composite pre-filled (FENCE_TYPES_BUILTIN) and any number of custom
   types added through the same builder. Common to every type: posts per row with an end post,
   cut from stock posts at in-ground depth + fence height; sleeves on timber posts; postcrete;
   remove-old-fence, gates and consumables. */
fence: { label:"Fencing", group:"Fencing", unitLabel:"Length", cols:["desc","length"],
  colLabels:["Description","Length (m)"],
  options:[
    {key:"fenceType",label:"Fence type",type:"select",source:"fenceTypes",sourceValueKey:"id",default:"",placeholder:"Select a fence type…",
      addAction:"fenceTypeBuilder", addOptionLabel:"+ Add new…",
      hint:"Each fence type carries its own height, post spacing, materials, plant and wording — edit them in Settings → Pricing → Fencing, or add a new type here."},
    {key:"removeOld",label:"Remove old fence?",type:"yesno",default:false,
      hint:"Charged per metre of fence at the 'Remove old fence' rate in Materials. If the old fence needs taking away, add a skip on the Waste step."},
    {key:"gate",label:"Gate?",type:"yesno",default:false},
    {key:"gateCount",label:"Number of gates",type:"number",default:1,showIf:"gate"},
    {key:"gatePrice",label:"Gate price for this job (£ each inc VAT, optional)",type:"number",default:"",showIf:"gate",placeholder:"Blank = the Gate price in Materials"},
    {key:"productivity",label:"Productivity (m/day/person)",type:"number",default:"",hint:"Starts at the fence type's own rate — override for this job if needed."},
  ],
  // The chosen fence type's own options (e.g. Panel's "Gravel board needed?"), stored on the job
  // as "t_<key>" so they can't collide with the common options above.
  extraOptions(opt){
    const ft = fenceTypeById(opt && opt.fenceType);
    return ft ? (ft.options||[]).filter(o=>o && o.key && o.label).map(o=>(o.type==="number"
      ? {key:"t_"+o.key, label:o.label, type:"number", default:(o.default!=null && o.default!=='') ? o.default : 0}
      : {key:"t_"+o.key, label:o.label, type:"yesno", default:!!o.default})) : [];
  },
  calc(rows, opt, ctx){
    const blockers = [];
    const ft = (ctx.fenceTypes||[]).find(x=>x.id===opt.fenceType);
    const rowLens = rows.map(r=>Number(r.length)||0).filter(l=>l>0);
    const len = sum(rowLens);
    const has = len>0;
    const keyFigures = [["Total length",len.toFixed(2)+" m"]];
    if(!ft){
      if(has) blockers.push("Select a fence type");
      return {area:len, days:0, personDays:0, blockers, materials:[], plant:[], keyFigures};
    }
    // Posts per row = ROUNDUP(row length ÷ spacing) + 1 (an end post on every run); bays = posts − 1.
    const spacing = Number(ft.postSpacingMm)||1800;
    let posts = 0, bays = 0;
    rowLens.forEach(l=>{ const p = ru(r6(l*1000)/spacing) + 1; posts += p; bays += p-1; });
    const inGround = Number(ctx.compositePostInGroundDepth)||0;
    const height = Number(ft.heightMm)||1800;
    const stock = Number(ft.stockLengthMm)||2400;
    const cut = inGround + height;
    const cuts = cut>0 ? rd(stock/cut) : 0;
    let stockPosts = 0;
    if(posts>0){
      if(cuts<1) blockers.push("Fence height needs a longer post than the stock length");
      else stockPosts = ru(posts/cuts);
    }
    // The type's own option values, falling back to the type's defaults for a job saved before
    // they existed.
    const optView = Object.assign({}, opt);
    (ft.options||[]).forEach(o=>{ if(o && o.key && optView["t_"+o.key]===undefined) optView["t_"+o.key] = o.type==="number" ? o.default : !!o.default; });
    const c = {primary:len, rowPrimaries:rowLens, posts, bays, opt:optView};
    const mats = [];
    if(!ft.postMaterial){ if(has) blockers.push("This fence type has no post material — edit it in Settings → Pricing → Fencing"); }
    else mats.push([ft.postMaterial, stockPosts]);
    if(ft.postKind!=="composite") mats.push(["Post saver sleeve", posts]);
    mats.push(["Postcrete", posts*(Number(ctx.timberPostcreteBagsPerPost)||0)]);
    (ft.lines||[]).forEach(l=>{ if(l && l.material) mats.push([l.material, bldOnlyIfOk(l,optView) ? bldLineQty(l,c) : 0]); });
    if(opt.removeOld) mats.push(["Remove old fence", len]);
    const gates = opt.gate ? Math.max(0, Math.round(Number(opt.gateCount)||0)) : 0;
    if(gates>0) mats.push(Number(opt.gatePrice)>0 ? ["Gate", gates, ctx.netPrice(Number(opt.gatePrice), true), ''] : ["Gate", gates]);
    mats.push(["Consumables", has ? (ctx.fenceConsumablesQty!=null ? Number(ctx.fenceConsumablesQty) : 1) : 0]);
    const productivity = Number(opt.productivity) || Number(ft.productivity) || 1;
    const personDays = len/productivity;
    const days = ruq(personDays/(ctx.peopleOnSite||1));
    const plant = (ft.plant||[]).filter(p=>p && p.name).map(p=>[p.name,1,days]);
    if(has) bldZeroPriceBlockers(mats, plant, ctx).forEach(b=>blockers.push(b));
    keyFigures.push(["Posts in the ground", posts], ["Days required", days]);
    // A copy of the type's name/height/options/wording travels with the priced section, so a saved
    // quote's letter doesn't change if the type is later edited or deleted.
    const fenceSnap = deepClone({id:ft.id, name:ft.name, heightMm:ft.heightMm, options:ft.options||[], letter:ft.letter||[]});
    return {area:len, days, personDays, blockers, materials:mats, plant, keyFigures, fenceSnap};
  }},

compositefencing: { label:"Composite Fencing", group:"Fencing", unitLabel:"Length", cols:["desc","length"],
  colLabels:["Description","Length (m)"],
  options:[
    {key:"removeOld",label:"Remove old fence?",type:"yesno",default:false},
    {key:"gate",label:"Gate?",type:"yesno",default:false},
    {key:"gateCount",label:"Number of gates",type:"number",default:1,showIf:"gate"},
    {key:"productivity",label:"Productivity (m/day/person)",type:"number",default:6.7,hint:"How much fence line ONE PERSON installs per day — override for this job if needed."},
  ],
  calc(rows, opt, ctx){
    const len = sum(rows.map(r=>Number(r.length)||0));
    const personDays = len/(Number(opt.productivity)||6.7);
    const days = ruq(personDays/(ctx.peopleOnSite||1));
    const posts = len===0?0: ru(len/1.8)+1;
    const panels = ru(len/1.8); // 1 composite fence panel per 1.8m bay
    const mats = [
      ["Composite fence posts", posts],
      ["Postcrete", posts*2],
      ["Composite fence panels", panels],
      ["Remove old fence", opt.removeOld? len:0],
      ["Gate", opt.gate? (Number(opt.gateCount)||0):0],
      ["Consumables", len>0?1:0],
    ];
    return {area:len, days, personDays, materials:mats, plant:[], keyFigures:[["Total length",len.toFixed(2)+" m"],["Days required",days]]};
  }},

waterfeatures: { label:"Water Features", group:"Features", unitLabel:"Count", cols:["desc","count"],
  colLabels:["Description","How many"],
  // October 2026 rework: every row picks its own tenant-built feature product (so different
  // features can sit on one quote), with optional per-row dig-out (a tenant hole-size product,
  // feeding the shared waste pool), pebbles (a tenant pebble product, bags typed per row) and an
  // electrics note for the letter. Rows render as cards — see waterFeatureRowHtml.
  rowDefaults:{pebbleBags:1},
  rowHtml:(r,i)=>waterFeatureRowHtml(r,i),
  options:[
    {key:"productivity",label:"Productivity (features/day/person)",type:"number",default:0.7,hint:"How many water features ONE PERSON installs per day — override for this job if needed."},
  ],
  calc(rows, opt, ctx){
    const blockers = [];
    // A quote saved before the rework has one typed feature name/price for every row — price
    // it the old way so it still reprices sensibly.
    const legacy = opt.featurePrice!==undefined && !rows.some(r=>r.feature!==undefined);
    let count = 0, holeArea = 0, holeVol = 0;
    const featLines = {}, pebLines = {};
    rows.forEach((r,ri)=>{
      const n = Number(r.count)||0;
      const label = `Row ${ri+1}${(r.desc||'').trim()?` (${r.desc.trim()})`:''}`;
      // A row with a feature picked but no count would silently drop out of the price.
      if(!(n>0)){ if(!legacy && r.feature) blockers.push(`${label}: enter how many`); return; }
      count += n;
      if(legacy) return;
      const f = r.feature ? (ctx.wfFeatures||[]).find(x=>x.name===r.feature) : null;
      if(!f) blockers.push(`${label}: pick a water feature`);
      else {
        if(!(Number(f.price)>0)) blockers.push(`The price for "${f.name}" can't be £0`);
        const L = featLines[f.name] || (featLines[f.name] = {qty:0, f});
        L.qty += n;
      }
      if(r.digOut){
        const h = r.holeSize ? (ctx.wfHoleSizes||[]).find(x=>x.name===r.holeSize) : null;
        if(!h) blockers.push(`${label}: pick a hole size for the dig-out`);
        else {
          const l = Number(h.lengthMm)||0, w = Number(h.widthMm)||0, d = Number(h.depthMm)||0;
          if(!(l>0 && w>0 && d>0)) blockers.push(`The hole size "${h.name}" needs a length, width and depth`);
          holeArea += (l/1000)*(w/1000)*n;
          holeVol += (l/1000)*(w/1000)*(d/1000)*n;
        }
      }
      if(r.pebbles){
        const pb = r.pebbleProduct ? (ctx.wfPebbles||[]).find(x=>x.name===r.pebbleProduct) : null;
        const bags = (r.pebbleBags===undefined || r.pebbleBags==='') ? 1 : (Number(r.pebbleBags)||0);
        if(!pb) blockers.push(`${label}: pick the pebbles`);
        else {
          if(!(Number(pb.price)>0)) blockers.push(`The bag price for "${pb.name}" can't be £0`);
          const P = pebLines[pb.name] || (pebLines[pb.name] = {qty:0, pb});
          P.qty += bags;
        }
      }
    });
    const personDays = count/(Number(opt.productivity)||0.7);
    const days = ruq(personDays/(ctx.peopleOnSite||1));
    const mats = [];
    if(legacy){
      const featureName = (opt.featureName||"").trim() || "Water feature (specify above)";
      mats.push([featureName, count, Number(opt.featurePrice)||0, opt.featureSupplier||""]);
      mats.push(["Pebbles", ru(count), 50, ""]);
    } else {
      Object.values(featLines).forEach(({qty,f})=>mats.push([f.name, r6(qty), ctx.netPrice(f.price, f.vatIncluded), f.supplier||'', 'each']));
      Object.values(pebLines).forEach(({qty,pb})=>mats.push([pb.name, r6(qty), ctx.netPrice(pb.price, pb.vatIncluded), '', '20kg bag']));
    }
    mats.push(["Consumables", count>0 ? (ctx.wfConsumablesQty!=null ? Number(ctx.wfConsumablesQty) : 1) : 0]);
    // Only dug rows feed the shared waste pool: plan area = L × W × count, volume = L × W × D × count.
    const digOutDepth = holeArea>0 ? (holeVol/holeArea)*1000 : 0;
    return {area:count, wasteArea:holeArea, digOutDepth, days, personDays, blockers, materials:mats, plant:[],
      keyFigures:[["Number of features",count],["Days required",days]]};
  }},

steeledging: { label:"Steel Edging", group:"Hard landscaping", unitLabel:"Length", cols:["desc","length"],
  colLabels:["Description","Length (m)"],
  options:[
    // October 2026 rework: the steel is a tenant-built product priced per METRE (thickness,
    // height or material such as 3mm, 5mm, Corten or aluminium go in its name), and rebar is a
    // tenant-built product priced per bar with its own bar length. See calc().
    {key:"steelProduct",label:"Steel edging (£ per metre)",type:"select",source:"steelEdgingProducts",default:"",placeholder:"Select a steel edging product…",
      sourceLabel:e=>`${e.name} — £${(Number(e.priceM)||0).toFixed(2)} per metre`,
      addLabel:"steel edging product", addFields:["priceM"],
      hint:"Priced per metre of edging, not per length or section — put the thickness/height/material in the name."},
    {key:"rebarProduct",label:"Rebar (£ per bar)",type:"select",source:"steelRebar",default:"",placeholder:"Select a rebar…",
      sourceLabel:e=>`${e.name} — ${Number(e.lengthMm)||0}mm bar, £${(Number(e.price)||0).toFixed(2)} per bar`,
      addLabel:"rebar", addFields:["price","lengthMm"],
      hint:"Each bar is cut into stakes at the stake length set in Settings → Pricing → Steel edging."},
    {key:"productivity",label:"Productivity (m/day/person)",type:"number",default:10,hint:"How much edging ONE PERSON installs per day — override for this job if needed."},
  ],
  calc(rows, opt, ctx){
    const blockers = [];
    const lens = rows.map(r=>Number(r.length)||0).filter(l=>l>0);
    const len = sum(lens);
    const has = len>0;
    const personDays = len/(Number(opt.productivity)||10);
    const days = ruq(personDays/(ctx.peopleOnSite||1));
    const plant = [["Welder",1,days]];
    // A quote saved before the rework (3mm/5mm thickness, fixed rebar maths) prices the old way.
    if(opt.steelProduct===undefined && opt.thickness!==undefined){
      const steelName = opt.thickness==="5mm" ? "Steel edging 5mm" : "Steel edging 3mm";
      const stakes = ru(len/0.5);
      return {area:len, days, personDays, materials:[[steelName, len],["Rebar", ru(stakes/12)],["Consumables", has?1:0]], plant,
        keyFigures:[["Total length",len.toFixed(2)+" m"],["Days required",days]]};
    }
    // Stakes per run = ROUNDUP(run length ÷ spacing) + 1, so every separate run gets an end stake.
    const spacing = Number(ctx.steelStakeSpacing)||500;
    let stakes = 0;
    lens.forEach(l=>{ stakes += ru(r6(l*1000)/spacing) + 1; });
    const steel = opt.steelProduct ? (ctx.steelEdgingProducts||[]).find(x=>x.name===opt.steelProduct) : null;
    const rebar = opt.rebarProduct ? (ctx.steelRebar||[]).find(x=>x.name===opt.rebarProduct) : null;
    const stakeLen = Number(ctx.steelStakeLength)||500;
    let bars = 0;
    const mats = [];
    if(has){
      if(!steel) blockers.push("Select a steel edging product");
      if(!rebar) blockers.push("Select a rebar");
      else {
        const barLen = Number(rebar.lengthMm)||0;
        const perBar = rd(barLen/stakeLen);
        if(stakeLen>barLen || perBar<1) blockers.push(`The stake length (${stakeLen}mm) is longer than the rebar bar (${barLen}mm) — use a longer bar or a shorter stake length`);
        else bars = ru(stakes/perBar);
      }
    }
    if(steel) mats.push([steel.name, r6(len), ctx.netPrice(steel.priceM, steel.vatIncluded), '', 'm']);
    if(rebar) mats.push([rebar.name, bars, ctx.netPrice(rebar.price, rebar.vatIncluded), '', 'bar']);
    mats.push(["Consumables", has ? (ctx.steelConsumablesQty!=null ? Number(ctx.steelConsumablesQty) : 1) : 0]);
    if(has) bldZeroPriceBlockers(mats, plant, ctx).forEach(x=>blockers.push(x));
    return {area:len, days, personDays, blockers, materials:mats, plant,
      keyFigures:[["Total length",len.toFixed(2)+" m"],["Stakes",stakes],["Days required",days]]};
  }},

flowerbeds: { label:"Flower Beds", group:"Planting & beds", unitLabel:"Area", cols:["desc","width","length","digOutDepth"],
  colLabels:["Description","Width (m)","Length (m)","Dig-out depth (mm)"],
  options:[
    // October 2026 rework: per-row dig-out depth (default 300mm, from Settings). Compost and bark
    // mulch are built in (Materials list, priced per 1-tonne bulk bag of fbBagVolume m³): the top
    // fbMulchDepth mm (50) is bark mulch, the rest of each row's dig-out is compost. Edging styles are tenant-built, or "Steel edging"
    // which hands the edging run to the Steel Edging service (as Gravel does). See calc().
    {key:"plantingNow",label:"Planting straight away?",type:"yesno",default:false},
    {key:"edgingStyle",label:"Edging style",type:"select",source:"fbEdgingStyles",extraOptions:[{value:GRAVEL_STEEL_EDGING,label:"Steel edging"}],
      default:"",placeholder:"No edging / select a style…", addLabel:"edging style", addFields:["piecesPerMetre","price"],
      hint:"Leave the edging length blank for no edging. Steel edging adds the Steel Edging service to this quote, where you enter its length."},
    {key:"edgingLength",label:"Edging length (m)",type:"number",default:"",placeholder:"Blank = no edging",
      showIf:o=>o.edgingStyle!==GRAVEL_STEEL_EDGING},
    {key:"edgingProductivity",label:"Edging productivity (m/day/person)",type:"number",default:12,
      showIf:o=>o.edgingStyle!==GRAVEL_STEEL_EDGING && Number(o.edgingLength)>0, hint:"How much edging ONE PERSON lays per day — override for this job if needed."},
    {key:"productivity",label:"Productivity (m²/day/person)",type:"number",default:6.7,hint:"How much ONE PERSON gets through per day — override for this job if needed."},
  ],
  calc(rows, opt, ctx){
    const blockers = [];
    // A quote saved before the rework (no compost choice, no per-row depth) prices the old way.
    if(opt.compost===undefined && !rows.some(r=>r.digOutDepth!==undefined)){
      const area = sum(rows.map(r=>(Number(r.width)||0)*(Number(r.length)||0)));
      const personDays = area/(Number(opt.productivity)||6.7);
      const days = ruq(personDays/(ctx.peopleOnSite||1));
      // wasteArea 0: an old quote never fed the waste pool, so re-saving it mustn't start to.
      return {area, wasteArea:0, digOutDepth:0, days, personDays, materials:[["Peat free compost bulk bag", ru(area/1.666)],["Geotextile membrane", opt.plantingNow?0:area],["Bark mulch", ru(area/5)],["Consumables", area>0?1:0]], plant:[], keyFigures:[["Total area",area.toFixed(2)+" m²"]]};
    }
    let area = 0, volumeM3 = 0;
    rows.forEach((r,ri)=>{
      const wm = Number(r.width)||0, lm = Number(r.length)||0;
      if(!(wm*lm>0)) return;
      const a = r6((r6(wm*1000)*r6(lm*1000))/1e6);
      const d = Number(r.digOutDepth)||0;
      if(!(d>0)) blockers.push(`Row ${ri+1}${(r.desc||'').trim()?` (${r.desc.trim()})`:''}: enter a dig-out depth`);
      area += a; volumeM3 += a*(d/1000);
    });
    const has = area>0;
    // Built-in compost and bark mulch: mulch is always the top fbMulchDepth (50mm) of the bed,
    // compost fills the rest of each row's dig-out; both come in bulk bags of fbBagVolume m³ (0.5).
    const bagVol = Number(ctx.fbBagVolume)>0 ? Number(ctx.fbBagVolume) : 0.5;
    const mulchMm = ctx.fbMulchDepth!=null && Number(ctx.fbMulchDepth)>=0 ? Number(ctx.fbMulchDepth) : 50;
    let compostM3 = 0;
    rows.forEach(r=>{
      const a = r6((r6((Number(r.width)||0)*1000)*r6((Number(r.length)||0)*1000))/1e6);
      if(a>0) compostM3 += a*Math.max(0, (Number(r.digOutDepth)||0) - mulchMm)/1000;
    });
    const mulchM3 = area*mulchMm/1000;
    const steel = opt.edgingStyle===GRAVEL_STEEL_EDGING;
    const es = (!steel && opt.edgingStyle) ? (ctx.fbEdgingStyles||[]).find(x=>x.name===opt.edgingStyle) : null;
    const edgingLen = steel ? 0 : (Number(opt.edgingLength)||0);
    const mats = [];
    if(has){
      if(edgingLen>0){
        if(!es) blockers.push("Select an edging style for the edging length entered");
        else if(!(Number(es.piecesPerMetre)>0)) blockers.push("The edging style's pieces per metre must be greater than 0");
      }
    }
    mats.push(["Peat free compost bulk bag", has ? ru(r6(compostM3/bagVol)) : 0]);
    if(!opt.plantingNow) mats.push(["Geotextile membrane", r6(area)]);
    mats.push(["Bark mulch", has ? ru(r6(mulchM3/bagVol)) : 0]);
    if(es && edgingLen>0) mats.push([es.name, ru(edgingLen*(Number(es.piecesPerMetre)||0)), ctx.netPrice(es.price, es.vatIncluded), '', 'each']);
    mats.push(["Consumables", has ? (ctx.fbConsumablesQty!=null ? Number(ctx.fbConsumablesQty) : 1) : 0]);
    if(has) bldZeroPriceBlockers(mats, [], ctx).forEach(x=>blockers.push(x));
    const personDays = area/(Number(opt.productivity)||6.7) + (es && edgingLen>0 ? edgingLen/(Number(opt.edgingProductivity)||12) : 0);
    const days = ruq(personDays/(ctx.peopleOnSite||1));
    // Always feeds the shared waste pool: each row's area and its own depth (area-weighted).
    const digOutDepth = has ? (volumeM3/area)*1000 : 0;
    return {area, days, personDays, digOutDepth, mulchDepth: mulchMm, blockers, materials:mats, plant:[], keyFigures:[["Total area",area.toFixed(2)+" m²"],["Days required",days]]};
  }},
};

/* Narrative copy used to build the quote letter, in the voice of the existing template */
