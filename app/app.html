// Actions still allowed while the own-website build is read-only (see the click handler).
const READ_ONLY_OK = new Set(["nav","openQuote","jobsFilter","showChaseList","calNextMonth","calPrevMonth","calToday","calTeamFilter",
  "settingsTab","downloadQuotePdf","downloadPaymentPdf","printQuote","copyOrder","modalCancel","modalCopy","modalOk","lock","login",
  "platformSignOut","account","help","startTour"]);
App.addEventListener("click", async (e)=>{
  const t = e.target.closest("[data-action]");
  if(!t) return;
  const action = t.getAttribute("data-action");
  const d = S.draft;
  // Own-website build: once the trial or subscription has ended the app is read-only — quotes,
  // jobs and the calendar can be looked at and downloaded, but nothing can be created or changed.
  if(window.__platform && window.__platform.readOnly && window.__platform.readOnly()){
    const nav = action==="nav" ? t.getAttribute("data-nav") : null;
    if(!READ_ONLY_OK.has(action) || nav==="newquote"){ e.preventDefault(); window.__platform.explainReadOnly(); return; }
  }
  switch(action){
    case "account": { if(window.__platform) window.__platform.openAccount(); break; }
    case "help": { e.preventDefault(); leaveSettingsThen(()=>{ S._stDirty = null; goto("help"); }); break; }
    case "startTour": { startTour(); break; }
    case "nav": {
      const n = t.getAttribute("data-nav");
      if(n==="settings" && S.screen==="settings"){ render(); break; }
      leaveSettingsThen(()=>{
        if(n==="newquote" && !S.draft){
          if(S._savedDraft){ S.draft = S._savedDraft; S._savedDraft = null; S.editingQuoteId = S._savedEditingQuoteId||null; S._savedEditingQuoteId=null; }
          else { S.draft = newDraft(); S.editingQuoteId=null; }
        }
        S._stDirty = null;
        goto(n);
      });
      break;
    }
    case "resumeDraft": {
      // The "unfinished quote" banner (and this button) also shows when a quote is
      // already live in this session — not just after reopening the app — because it's
      // triggered by S.draft OR S._savedDraft. Only pull from S._savedDraft when there
      // actually is one; otherwise S.draft is already the in-progress quote, and blindly
      // overwriting it with a null S._savedDraft wiped out everything typed so far.
      if(S._savedDraft){
        S.draft = S._savedDraft; S._savedDraft = null;
        S.editingQuoteId = S._savedEditingQuoteId||null; S._savedEditingQuoteId=null;
      }
      goto("newquote");
      break;
    }
    case "discardDraft": {
      showConfirm("Discard this unfinished quote? This can't be undone.", async ()=>{
        S.draft = null;
        await clearSavedDraft();
      }, {confirmLabel:"Discard", danger:true});
      break;
    }
    case "startOverDraft": {
      showConfirm("Discard this unfinished quote and start a new one?", async ()=>{
        await clearSavedDraft();
        S.draft = newDraft(); S.editingQuoteId=null;
      }, {confirmLabel:"Start over", danger:true});
      break;
    }
    case "modalOk": {
      const m = S._modal;
      if(!m) break;
      if(m.type==="prompt"){
        const inp = document.getElementById('modalPromptInput');
        const value = inp ? inp.value.trim() : (m.value||'').trim();
        if(!value) break; // require a value — leave the dialog open
        const cb = m._onYes; S._modal = null;
        if(cb) await cb(value);
      } else if(m.type==="addMaterialOption"){
        const nameInp = document.getElementById('modalMatName');
        const priceInp = document.getElementById('modalMatPrice');
        const supplierInp = document.getElementById('modalMatSupplier');
        const name = nameInp ? nameInp.value.trim() : '';
        const price = priceInp ? parseFloat(priceInp.value) : NaN;
        const supplier = supplierInp ? supplierInp.value.trim() : '';
        if(!name){ m.error = "Give the material a description."; render(); break; }
        if(isNaN(price) || price<0){ m.error = "Enter a price of 0 or more."; render(); break; }
        m.error = "";
        const groupKey = m.groupKey;
        // A material with this name may already exist (picked from a different job with the
        // same custom name) — update its price (and supplier, if one was entered this time)
        // rather than clobbering its saved VAT setting, or a supplier left blank here.
        if(S.settings.materials[name]){
          S.settings.materials[name].price = price;
          if(supplier) S.settings.materials[name].supplier = supplier;
        } else {
          S.settings.materials[name] = {unit: CUSTOM_STYLE_UNITS[groupKey]||'m²', section: CUSTOM_STYLE_SECTIONS[groupKey]||'Custom', price, supplier, vatIncluded:true};
        }
        if(!S.settings.customStyleOptions) S.settings.customStyleOptions = {};
        if(!S.settings.customStyleOptions[groupKey]) S.settings.customStyleOptions[groupKey] = [];
        if(!S.settings.customStyleOptions[groupKey].includes(name)) S.settings.customStyleOptions[groupKey].push(name);
        await saveSettings({materials: S.settings.materials, customStyleOptions: S.settings.customStyleOptions});
        const cb = m._onSave; S._modal = null;
        if(cb) cb(name);
      } else if(m.type==="form"){
        const values = {};
        let err = "";
        for(const f of m.fields){
          const el = document.getElementById(`mf_${f.key}`);
          let val;
          if(f.type==="checkbox") val = el ? el.checked : !!f.value;
          else val = el ? el.value : (f.value!=null?f.value:'');
          if(f.type==="number"){
            const n = parseFloat(val);
            if(val===''||isNaN(n)){
              if(f.required){ err = `Enter a value for "${f.label}".`; break; }
              val = null;
            } else val = n;

        const ph = (q.customer.phone||'').trim();
        const body = how==="text" ? chaseMessageText(q) : "";
        S._modal = {type:"contact", how, name:(q.customer.knownAs||q.customer.name||'').trim(), to:ph, body,
          href: how==="call" ? telHref(ph) : smsHref(ph, body)};
      }
      const label = how==="call" ? "phone call" : how==="text" ? "text message" : "email";
      if(!q.chases) q.chases = [];
      q.chases.push({at:new Date().toISOString(), how:label});
      if(!q.activityLog) q.activityLog = [];
      q.activityLog.unshift({id:uid(), text:`Followed up by ${label}`, at:new Date().toISOString()});
      await saveQuote(q);
      render();
      break;

    case "quickPrice": {

      if(!(v>0)){ if(inp){ inp.focus(); inp.style.borderColor = 'var(--danger)'; } break; }
      const vatBox = box.querySelector('[data-qp-vat]');
      const mat = S.settings.materials[name];
      if(!mat) break;
      mat.price = Math.round(v*100)/100;

      render();
      break;

      break;

        {key:"date", label:"Start date", type:"date", required:true, value:presetDate},
        {key:"teamId", label:"Team / crew", type:"select", options:(S.settings.teams||[]).map(tm=>({value:tm.id,label:tm.name})), value:presetTeam},

        {key:"teamId", label:"Team / crew", type:"select", options:(S.settings.teams||[]).map(tm=>({value:tm.id,label:tm.name})), value:entry.teamId||defaultTeamId()},
        {key:"isJob", label:"This is a job (spans a number of working days)", type:"checkbox", value:!!entry.isJob},

    case "toggleChecklistItem": {
      const q = S.quotes.find(x=>x.id===S.openQuoteId);

      const item = q.finance.materials.checklist.find(x=>x.id===t.getAttribute("data-id"));
      if(!item) break;
      if(item.ordered){
        item.ordered = false; item.orderedAt = null; item.actualUnitPrice = null; item.actualIncVat = null; item.actualTotal = null;
        await saveQuote(q); render(); break;
      }
      const vatRegistered = S.settings.vatRegistered!==false;
      // Pre-filled with the quoted figure on the same basis as the tick below (inc VAT when ticked).
      const prefill = item.quotedTotal ? (vatRegistered ? Math.round(item.quotedTotal*(1+(Number(S.settings.vatRate)||0))*100)/100 : item.quotedTotal) : null;
      const fields = [{key:"price", label:"Price paid (£)", type:"number", required:true, value: prefill!=null ? String(prefill) : ""}];
      if(vatRegistered) fields.push({key:"incVat", label:"This price includes VAT", type:"checkbox", value:true});
      showForm(`Mark "${item.name}" as ordered`, "Enter what was actually paid, so this compares against the quoted price.", fields, async (values)=>{
        const net = financeNetAmount(values.price, vatRegistered ? values.incVat : false);
        item.ordered = true; item.orderedAt = new Date().toISOString();
        item.actualIncVat = vatRegistered ? !!values.incVat : false;
        item.actualTotal = Math.round(net*100)/100;
        item.actualUnitPrice = item.quotedQty ? Math.round((net/item.quotedQty)*100)/100 : net;

      }, {confirmLabel:"Save"});
      break;

    case "addUnplannedMaterial": {
      const q = S.quotes.find(x=>x.id===S.openQuoteId);
      if(!q || !q.finance) break;
      const vatRegistered = S.settings.vatRegistered!==false;
      const fields = [
        {key:"name", label:"Material", type:"text", required:true, placeholder:"e.g. Extra bags of cement"},
        {key:"price", label:"Cost (£)", type:"number", required:true},
      ];
      if(vatRegistered) fields.push({key:"incVat", label:"This price includes VAT", type:"checkbox", value:true});
      fields.push({key:"billable", label:"Flag as a billable extra (adds to the customer's invoice)", type:"checkbox", value:false});
      showForm("Add unplanned material", "Added straight to actual spend for this job.", fields, async (values)=>{
        const net = financeNetAmount(values.price, vatRegistered ? values.incVat : false);
        const cost = Math.round(net*100)/100;
        q.finance.materials.unplanned.push({id:uid(), name:values.name, cost, billable: !!values.billable, addedAt:new Date().toISOString()});
        if(values.billable) addBillableExtraToInvoice(q, values.name, cost);

        checkOverrun(q, "materials");
        render();
      }, {confirmLabel:"Add"});

    case "addLaborEntry": {
      const q = S.quotes.find(x=>x.id===S.openQuoteId);

      const fields = [
        {key:"date", label:"Date", type:"date", required:true, value:new Date().toISOString().slice(0,10)},
        {key:"person", label:"Who was on site", type:"text", required:true},
        {key:"hours", label:"Hours worked", type:"number", required:true},
      ];
      showForm("Log labour", "", fields, async (values)=>{
        q.finance.labor.log.push({id:uid(), date:values.date, person:values.person, hours:values.hours, addedAt:new Date().toISOString()});
        await saveQuote(q);
        checkOverrun(q, "labor");
        render();
      }, {confirmLabel:"Save"});
      break;
    }
    case "addRunningCostEntry": {
      const q = S.quotes.find(x=>x.id===S.openQuoteId);
      if(!q || !q.finance) break;
      const fields = [
        {key:"description", label:"Description", type:"text", required:true, placeholder:"e.g. Skip hire"},
        {key:"amount", label:"Amount (£)", type:"number", required:true},
      ];
      const vatRegistered = S.settings.vatRegistered!==false;
      if(vatRegistered) fields.push({key:"incVat", label:"This amount includes VAT", type:"checkbox", value:true});
      showForm("Add running cost", "", fields, async (values)=>{

        q.finance.runningCosts.entries.push({id:uid(), description:values.description, amount:Math.round(net*100)/100, incVat: vatRegistered ? !!values.incVat : false, addedAt:new Date().toISOString()});
        await saveQuote(q);
        checkOverrun(q, "runningCosts");
        render();
      }, {confirmLabel:"Add"});
      break;
    }
    case "addPayment": {
      const q = S.quotes.find(x=>x.id===S.openQuoteId);
      if(!q || !q.finance) break;
      // The VAT inside a VAT-inclusive payment is amount × rate ÷ (1 + rate) — 1/6 at 20% —
      // using the VAT treatment the job was quoted with.
      const rate = quoteVatRate(q);
      const fields = [
        {key:"date", label:"Date", type:"date", required:true, value:new Date().toISOString().slice(0,10)},
        {key:"amount", label:"Amount received (£)", type:"number", required:true},
        {key:"note", label:"Note (optional)", type:"text", required:false},
      ];
      showForm("Log payment received", rate>0?`The VAT included in this payment (${+(rate*100).toFixed(1)}% VAT = 1/${+((1+rate)/rate).toFixed(2)} of the amount) is set aside rather than counted as profit.`:"", fields, async (values)=>{
        const amount = Math.round((Number(values.amount)||0)*100)/100;
        const vatSetAside = rate>0 ? Math.round(amount*rate/(1+rate)*100)/100 : 0;
        q.finance.payments.push({id:uid(), amount, date:values.date, note:values.note||"", vatSetAside});
        await saveQuote(q);
        render();
      }, {confirmLabel:"Log payment"});
      break;
    }
    case "addActivityNote": {
      const q = S.quotes.find(x=>x.id===S.openQuoteId);
      if(!q) break;
      showForm("Add a note", "", [{key:"text", label:"Note", type:"textarea", required:true, placeholder:"e.g. Delayed by weather, resuming Thursday"}], async (values)=>{
        if(!q.activityLog) q.activityLog = [];
        q.activityLog.unshift({id:uid(), text:values.text, at:new Date().toISOString()});
        await saveQuote(q);
        render();
      }, {confirmLabel:"Add note"});
      break;
    }
  }
  // Clicks (finishing a step, toggling a service, jumping to a step, etc.) are discrete
  // events, not rapid keystrokes — no need to coalesce them, so save right away rather
  // than risking the 600ms debounce window losing this step if the tab is backgrounded.
  if(S.draft && S.screen==="newquote") scheduleDraftSave(true);
});

App.addEventListener("change", async (e)=>{
  const t = e.target;
  if(t.matches && t.matches('[data-logo-upload]')){
    const file = t.files && t.files[0];
    if(!file) return;
    try{
      const res = await processLogoFile(file);
      // Keep whatever's been typed on the page behind (setup step 1 / company details).
      const keep = pageFieldEntries().filter(([k,el])=>!el.matches('[data-logo-upload],[data-brand-colour]')).map(([k,el])=>[k, el.value, el.checked]);
      if(await saveLogo(res.dataUrl)){
        if(res.colour){ S.settings.brandColor = res.colour; if(S.settings.onboarded) await saveSettings({brandColor: res.colour}); }
        applyBrandTheme();
      }
      render();
      const now = new Map(pageFieldEntries().map(([k,el])=>[k,el]));
      keep.forEach(([k,v,c])=>{ const el = now.get(k); if(!el) return; if(el.type==='checkbox') el.checked = c; else el.value = v; });
    }catch(err){ showAlert(err && err.message ? err.message : "That logo couldn't be used."); }
    return;
  }
  if(t.matches && t.matches('[data-brand-colour]')){
    S.settings.brandColor = t.value; applyBrandTheme();
    if(S.settings.onboarded) await saveSettings({brandColor: t.value});
    return;
  }
  trackSettingsEdit(t);
});
App.addEventListener("input", (e)=>{
  const t = e.target;
  const d = S.draft;
  if(t.matches && t.matches('[data-brand-colour]')){ S.settings.brandColor = t.value; applyBrandTheme(); return; }
  trackSettingsEdit(t);
  if(t.matches('[data-rc-field]')){
    const item = (S.settings.runningCostItems||[]).find(i=>i.id===t.getAttribute('data-rc-id'));
    if(item){
      const f = t.getAttribute('data-rc-field');
      if(f==="amount") item.amount = rcParseAmount(t.value);
      else if(f==="incVat") item.incVat = !!t.checked;
      else item[f] = t.value;
      rcRefreshFigures(); rcSaveSoon();
    }
    return;
  }
  if(t.matches('[data-rc-setting]')){
    const k = t.getAttribute('data-rc-setting'); const n = parseFloat(t.value);
    S.settings[k] = t.value.trim()==='' || isNaN(n) ? null : n;
    rcRefreshFigures(); rcSaveSoon();
    return;
  }
  if(t.matches('[data-mf]')){
    const row = parseInt(t.closest('[data-row]').getAttribute('data-row'),10);
    const key = currentMeasureKey(d); const st = ensureSectionState(key);
    const mf = t.getAttribute('data-mf'); const r = st.rows[row];
    const rowAdd = t.getAttribute('data-row-add');
    if(rowAdd && t.value==="__add_other__"){
      // A row-level product dropdown's "+ Add new…" (Water Features) — open the product dialog and
      // put the new product straight onto this row once it's saved; never store the sentinel.
      const fieldKeys = (t.getAttribute('data-add-fields')||'').split(',').filter(Boolean);
      let fieldDefaults; const dr = t.getAttribute('data-add-field-defaults'); if(dr){ try{ fieldDefaults = JSON.parse(dr); }catch(e){} }
      openPavingProductModal(rowAdd, t.getAttribute('data-add-label')||'item', fieldKeys, (entry)=>{ r[mf] = entry.name; reflow(); }, fieldDefaults);
      return;
    }
    if(rowAdd && t.value==="__edit_current__"){
      // "✎ Edit …" on a row-level product dropdown — edit the picked product in place.
      const fieldKeys = (t.getAttribute('data-add-fields')||'').split(',').filter(Boolean);
      const cur = (S.settings[rowAdd]||[]).find(x=>x.name===r[mf]);
      t.value = r[mf]||'';
      if(cur) openPavingProductModal(rowAdd, t.getAttribute('data-add-label')||'item', fieldKeys, (entry)=>{ r[mf] = entry.name; reflow(); }, undefined, cur);
      return;
    }
    // A row's footing length follows its wall length until the user types their own (Block
    // Retaining Wall) — clearing the footing length hands it back to the wall length.
    if(mf==="footingLength") r._footingLengthSet = t.value!=='';
    if(mf==="length" && "footingLength" in r && !r._footingLengthSet) r.footingLength = t.value;
    r[mf] = t.value;
    reflow();
  } else if(t.matches('[data-opt]')){
    const key = currentMeasureKey(d); const st = ensureSectionState(key);
    const optKey = t.getAttribute('data-opt');
    const customGroup = t.getAttribute('data-customizable');
    const sourceAddKey = t.getAttribute('data-source-add');
    const addAction = t.getAttribute('data-add-action');
    if(addAction==="fenceTypeBuilder" && t.value === "__add_other__"){
      // "+ Add other…" on Fencing's fence type opens the builder for a new type; saving it comes
      // back to this quote with the new type selected (see saveServiceBuilder).
      openServiceBuilder("fence", null, {returnToQuote:true});
    } else if(customGroup && t.value === "__add_other__"){
      // Don't save the sentinel as the option value — open the "add a material" dialog instead,
      // and only set the option once a name is actually saved. Re-rendering (inside
      // showAddMaterialOption) puts the dropdown's visible selection back to its real value.
      showAddMaterialOption(customGroup, (name)=>{ st.options[optKey] = name; reflow(); });
    } else if(customGroup && t.value === "__edit_current__"){
      // "✎ Edit …" on a materials-list dropdown (slab type, gravel style…) — edit that material's
      // price, supplier and VAT setting; the name stays, since the Materials list is keyed by it.
      const name = st.options[optKey]; t.value = name||'';
      const m = name && S.settings.materials[name];
      if(m) editMaterialPrice(name, ()=>reflow());
    } else if(sourceAddKey && t.value === "__edit_current__"){
      // "✎ Edit …" on a `source`-backed dropdown — edit the picked product in place.
      const def = SERVICES[key] && (SERVICES[key].options||[]).concat(typeof SERVICES[key].extraOptions==="function" ? (SERVICES[key].extraOptions(st.options)||[]) : []).find(o=>o.key===optKey);
      const vk = def && def.sourceValueKey;
      const cur = (S.settings[sourceAddKey]||[]).find(x=>(vk ? x[vk] : x.name)===st.options[optKey]);
      const fieldKeys = (t.getAttribute('data-add-fields')||'').split(',').filter(Boolean);
      t.value = st.options[optKey]||'';
      if(cur) openPavingProductModal(sourceAddKey, t.getAttribute('data-add-label')||'item', fieldKeys, (entry)=>{ st.options[optKey] = vk ? entry[vk] : entry.name; if(key==="gravel" || key==="flowerbeds" || key==="artificialturf") syncGravelSteelEdging(d); reflow(); }, undefined, cur);
    } else if(sourceAddKey && t.value === "__add_other__"){
      // Same idea as the `customizable` sentinel above, but for a `source`-backed dropdown
      // (e.g. jointing compound/edging style) — opens the same tenant-product-library modal the
      // Settings → Pricing → Paving card's own "+ Add…" button uses, so the new entry is
      // selectable immediately without a trip to Settings.
      const singular = t.getAttribute('data-add-label')||'item';
      const fieldKeys = (t.getAttribute('data-add-fields')||'').split(',').filter(Boolean);
      let fieldDefaults; const defaultsRaw = t.getAttribute('data-add-field-defaults');
      if(defaultsRaw){ try{ fieldDefaults = JSON.parse(defaultsRaw); }catch(e){ fieldDefaults = undefined; } }
      openPavingProductModal(sourceAddKey, singular, fieldKeys, (entry)=>{ st.options[optKey] = entry.name; if(key==="gravel" || key==="flowerbeds" || key==="artificialturf") syncGravelSteelEdging(d); reflow(); }, fieldDefaults);
    } else {
      st.options[optKey] = t.value;
      if(key==="gravel" || key==="flowerbeds" || key==="artificialturf") syncGravelSteelEdging(d);
      if(key==="fence" && optKey==="fenceType") applyFenceTypeDefaults(st);
      reflow();
    }
  } else if(t.matches('[data-ef]')){
    const idx = parseInt(t.closest('[data-extra]').getAttribute('data-extra'),10);
    const field = t.getAttribute('data-ef');
    d.extras[idx][field] = t.value;
    reflow();
  } else if(t.matches('[data-note-text]')){
    const scope = t.getAttribute('data-note-scope');
    const idx = parseInt(t.getAttribute('data-note-idx'),10);
    const arr = notesArrayFor(d, scope);
    if(arr[idx]) arr[idx].text = t.value;
    // No reflow() — nothing else on the page depends on a note's text, so skip the re-render
    // entirely rather than risk disturbing the textarea's cursor position while typing.
  } else if(t.matches('[data-note-customer]')){
    const scope = t.getAttribute('data-note-scope');
    const idx = parseInt(t.getAttribute('data-note-idx'),10);
    const arr = notesArrayFor(d, scope);
    if(arr[idx]) arr[idx].customerFacing = t.checked;
  } else if(t.matches('[data-team-name]')){
    // Keep S.settings.teams in sync on every keystroke (not just at Save) so that an
    // unrelated re-render — clicking "+ Add staff" or "+ Add team" on another team's
    // card while this name is only half-typed — doesn't wipe it back to the old value.
    // No reflow(): nothing else on screen reflects a team's name as you type it.
    const team = (S.settings.teams||[]).find(tm=>tm.id===t.getAttribute('data-team-name'));
    if(team) team.name = t.value;
  } else if(t.matches('[data-team-staff]')){
    // Same reasoning as data-team-name above, but staff is an array: map this input back
    // to its index among that team's staff inputs (DOM order matches array order).
    const team = (S.settings.teams||[]).find(tm=>tm.id===t.getAttribute('data-team-staff'));
    if(team){
      const inputs = Array.from(App.querySelectorAll(`[data-team-staff="${team.id}"]`));
      const idx = inputs.indexOf(t);
      if(idx>=0){ if(!team.staff) team.staff=[]; team.staff[idx] = t.value; }
    }
  } else if(t.id==="matFilter"){
    S._matFilter = t.value; reflow();
  } else if(t.id==="q_people"){
    d.people = t.value; reflow();
  } else if(d && ["q_creator","q_cname","q_cknown","q_cemail","q_cphone","q_caddress"].includes(t.id)){
    const map = {q_creator:"createdBy", q_cname:["customer","name"], q_cknown:["customer","knownAs"], q_cemail:["customer","email"], q_cphone:["customer","phone"], q_caddress:["customer","address"]};
    const dest = map[t.id];
    if(Array.isArray(dest)) d[dest[0]][dest[1]] = t.value; else d[dest] = t.value;
  }
  if(S.draft && S.screen==="newquote") scheduleDraftSave();
});

// Belt-and-braces: if a debounced (typed) draft save is still pending when the tab is
// hidden, backgrounded or closed, push it out immediately rather than losing it to the
// timer. visibilitychange fires reliably on mobile when switching apps; pagehide/
// beforeunload cover the tab actually closing.
// …and any running-cost-calculator edit still waiting on its short save delay.
const flushRcSave = ()=>{ if(_rcSaveTimer) rcSaveNow(); };
document.addEventListener("visibilitychange", ()=>{ if(document.hidden){ flushDraftSave(); flushRcSave(); } });
window.addEventListener("pagehide", ()=>{ flushDraftSave(); flushRcSave(); });
window.addEventListener("beforeunload", ()=>{ flushDraftSave(); flushRcSave(); });

// Automatic start (first login). Test harnesses that drive the app set window.__NO_AUTO_TOUR__.
function autoStartTour(){ if(!window.__NO_AUTO_TOUR__) startTour(); }
function startTour(){
  if(S._tour) return;
  if(S._modal){ S._modal = null; }
  S._tour = {i:0, steps: tourSteps(), stash:{draft:S.draft, savedDraft:S._savedDraft, editingQuoteId:S.editingQuoteId, settingsTab:S._settingsTab, openQuoteId:S.openQuoteId}, confirmSkip:false};
  tourShow();
}
function tourEnsureSampleDraft(){
  const t = S._tour;
  if(t.sample) return t.sample;
  const d = newDraft();
  d.createdBy = d.createdBy || "You";
  d.customer = Object.assign({}, TOUR_SAMPLE_CUSTOMER);
  const svc = tourSampleService();
  if(svc){
    d.serviceKeys = [svc];
    S.draft = d;  // ensureSectionState works on S.draft
    const st = ensureSectionState(svc);
    if(st.rows[0]){ st.rows[0].width = "5"; st.rows[0].length = "4"; }
  }
  t.sample = d;
  return d;
}
function tourGo(go){
  if(!go) return;
  if(go.quote){
    const d = tourEnsureSampleDraft();
    S.draft = d; S.editingQuoteId = null;
    d.step = go.quote; if(go.quote==="measure") d.serviceIdx = 0;
    S.screen = "newquote"; render(); return;
  }
  if(go.sampleQuote){
    const d = tourEnsureSampleDraft();
    let q = null;
    try{ q = buildQuoteFromDraft(Object.assign({}, d, {step:"preview"}), "draft"); }catch(e){ q = null; }
    if(q){
      q.id = "__tour__"; q.status = "draft"; q.quoteNumber = "EXAMPLE";
      S.quotes = (S.quotes||[]).filter(x=>x.id!=="__tour__"); S.quotes.unshift(q);
      S.openQuoteId = q.id; S.screen = "quotedetail"; render(); return;
    }
    S.screen = "menu"; render(); return;
  }
  // Ordinary screens show the business as it really is: no example draft or example quote.
  const st = S._tour.stash;
  S.draft = st.draft; S._savedDraft = st.savedDraft; S.editingQuoteId = st.editingQuoteId;
  S.quotes = (S.quotes||[]).filter(x=>x.id!=="__tour__");
  if(go.tab) S._settingsTab = go.tab;
  S._stDirty = null;
  S.screen = go.screen; render();
}
function tourLayer(){
  let el = document.getElementById("tourLayer");
  if(!el){
    el = document.createElement("div"); el.id = "tourLayer";
    el.innerHTML = `<div class="tour-block"></div><div class="tour-spot"></div><div class="tour-tip" role="dialog" aria-modal="true" aria-labelledby="tourTitle"></div>`;
    document.body.appendChild(el);
    el.addEventListener("click", e=>{
      const b = e.target.closest("[data-tour-act]");
      if(!b) return;
      e.preventDefault();
      tourAct(b.getAttribute("data-tour-act"));
    });
  }
  return el;
}
function tourAct(a){
  const t = S._tour; if(!t) return;
  if(a==="next"){ if(t.i >= t.steps.length-1) return endTour(true); t.i++; tourShow(); }
  else if(a==="back"){ if(t.i>0){ t.i--; tourShow(); } }
  else if(a==="skip"){ t.confirmSkip = true; tourDrawTip(); }
  else if(a==="keep"){ t.confirmSkip = false; tourDrawTip(); }
  else if(a==="confirmSkip"){ endTour(false); }
}
function tourShow(){
  const t = S._tour; if(!t) return;
  t.confirmSkip = false;
  const step = t.steps[t.i];
  tourGo(step.go);
  tourLayer();
  tourDrawTip();
  const target = step.target ? document.querySelector(step.target) : null;
  if(target){
    const tall = target.getBoundingClientRect().height > window.innerHeight*0.45;
    try{ target.scrollIntoView({block: tall ? "start" : "center", behavior:"instant"}); }catch(e){ target.scrollIntoView(); }
    if(tall) window.scrollBy(0, -12);
  }
  else window.scrollTo(0,0);
  // No room above, below or beside it: move the target to the top of the screen so the card fits underneath.
  if(tourPlace()==="cramped" && target){
    window.scrollBy(0, target.getBoundingClientRect().top - 16);
    tourPlace();
  }
  if(!t.timer) t.timer = setInterval(tourPlace, 400);
}
function tourDrawTip(){
  const t = S._tour; if(!t) return;
  const step = t.steps[t.i];
  const tip = tourLayer().querySelector(".tour-tip");
  const last = t.i===t.steps.length-1;
  if(t.confirmSkip){
    tip.innerHTML = `<div class="tour-head"><span class="tour-count">Skip the tour?</span></div>
      <h3 id="tourTitle">Are you sure you want to skip?</h3>
      <div class="tour-body"><p>You can replay it any time: tap <b>?</b> (Help) at the top of the screen, then <b>Replay the tutorial</b>. Help also has answers to common questions.</p></div>
      <div class="tour-btns"><button class="btn btn-ghost" data-tour-act="keep">Keep going</button><button class="btn btn-primary" data-tour-act="confirmSkip">Yes, skip</button></div>`;
  } else {
    tip.innerHTML = `<div class="tour-head"><span class="tour-count">${step.section?esc(step.section)+' · ':''}${t.i+1} of ${t.steps.length}</span>
        <button class="tour-x" data-tour-act="skip" aria-label="Skip the tour">Skip</button></div>
      <h3 id="tourTitle">${esc(step.title)}</h3>
      <div class="tour-body">${step.body}</div>
      <div class="tour-dots">${t.steps.map((_,i)=>`<span class="${i===t.i?'on':''}"></span>`).join('')}</div>
      <div class="tour-btns">${t.i>0?'<button class="btn btn-ghost" data-tour-act="back">Back</button>':'<span></span>'}
        <button class="btn btn-primary" data-tour-act="next">${t.i===0?'Start the tour':last?'Finish':'Next'}</button></div>`;
  }
  const primary = tip.querySelector(".btn-primary"); if(primary) primary.focus({preventScroll:true});
  tourPlace();
}
// Spotlight the step's target and put the card where it doesn't cover it: below or above the
// target if there's room, else beside it (wide screens), else docked at the bottom.
function tourPlace(){
  const t = S._tour; if(!t) return;
  const layer = document.getElementById("tourLayer"); if(!layer) return;
  const step = t.steps[t.i];
  const spot = layer.querySelector(".tour-spot"), tip = layer.querySelector(".tour-tip");
  const target = step.target ? document.querySelector(step.target) : null;
  const vh = window.innerHeight, vw = window.innerWidth, gap = 16;
  const visible = !!(target && target.getClientRects().length);
  layer.classList.toggle("no-spot", !visible);
  tip.style.left = tip.style.top = "";
  if(!visible){
    spot.style.display = "none";
    tip.className = "tour-tip dock-centre";
    return;
  }
  const r = target.getBoundingClientRect(), pad = 6;
  const top = Math.max(4, r.top-pad), bottom = Math.min(vh-4, r.bottom+pad);
  const left = Math.max(4, r.left-pad), right = Math.min(vw-4, r.right+pad);
  spot.style.display = "block";
  spot.style.left = left+"px"; spot.style.top = top+"px";
  spot.style.width = Math.max(0, right-left)+"px";
  spot.style.height = Math.max(0, bottom-top)+"px";
  const tipH = tip.offsetHeight, tipW = tip.offsetWidth;
  const below = vh - bottom, above = top;
  if(below >= tipH + gap*2 && below >= above){ tip.className = "tour-tip dock-bottom"; return; }
  if(above >= tipH + gap*2){ tip.className = "tour-tip dock-top"; return; }
  if(below >= tipH + gap*2){ tip.className = "tour-tip dock-bottom"; return; }
  const roomLeft = left - gap, roomRight = vw - right - gap;
  if(Math.max(roomLeft, roomRight) >= tipW + gap){
    tip.className = "tour-tip dock-side";
    const x = roomRight >= roomLeft ? right + gap : left - gap - tipW;
    const y = Math.min(Math.max(gap, (top+bottom)/2 - tipH/2), vh - tipH - gap);
    tip.style.left = Math.round(x)+"px"; tip.style.top = Math.round(Math.max(gap, y))+"px";
    return;
  }
  tip.className = "tour-tip " + (below >= above ? "dock-bottom" : "dock-top");
  return "cramped";
}
async function endTour(finished){
  const t = S._tour; if(!t) return;
  clearInterval(t.timer);
  const layer = document.getElementById("tourLayer"); if(layer) layer.remove();
  S.quotes = (S.quotes||[]).filter(x=>x.id!=="__tour__");
  S.draft = t.stash.draft; S._savedDraft = t.stash.savedDraft; S.editingQuoteId = t.stash.editingQuoteId;
  S._settingsTab = t.stash.settingsTab; S.openQuoteId = t.stash.openQuoteId;
  S._tour = null;
  S.screen = "menu"; render(); window.scrollTo(0,0);
  if(S.settings.tutorialPending || S.settings.tutorialDone!==true){
    S.settings.tutorialPending = false; S.settings.tutorialDone = true;
    S.settings.tutorialOutcome = finished ? "finished" : "skipped";
    try{ await saveSettings({tutorialPending:false, tutorialDone:true, tutorialOutcome:S.settings.tutorialOutcome}); }catch(e){}
  }
}
document.addEventListener("keydown", e=>{
  if(!S._tour) return;
  if(e.key==="Escape"){ e.preventDefault(); tourAct(S._tour.confirmSkip ? "keep" : "skip"); }
  else if(e.key==="ArrowRight" && !S._tour.confirmSkip){ tourAct("next"); }
  else if(e.key==="ArrowLeft" && !S._tour.confirmSkip){ tourAct("back"); }
});
window.addEventListener("resize", ()=>{ if(S._tour) tourPlace(); });
window.addEventListener("scroll", ()=>{ if(S._tour) tourPlace(); }, {passive:true});

/* ---- Help screen: replay the tour + FAQ ---- */
function helpFaq(){
