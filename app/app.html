/* Published pages can't reliably launch the viewer's email app or trigger a
   clipboard write themselves (both depend on permissions this sandboxed view
   may not have) — so instead of gambling on mailto: working, we show the
   composed email in our own dialog with copy buttons and a best-effort
   mailto: link, so there's always a path that works even in the worst case
   (the viewer selects the text by hand). */
async function sendQuoteEmail(q){
  const email = q.customer.email;
  const subject = `Your quote from ${S.settings.company.name} — ${q.quoteNumber}`;
  const short = S.settings.emailStyle==="short";
  let body, pdfNote = "";
  const gmail = !!(await getMcp());
  if(gmail){
    // The PDF goes into the Gmail draft as an attachment, so the email itself is the short covering note.
    const b = shortQuoteEmailBody(q);
    const mt = `mailto:${email.trim()}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(b)}`;
    // Opening the email doesn't mark the quote as sent — the dialog asks once it has really gone.
    S._modal = {type:"email", to:email, subject, body:b, mailto:mt, pdfNote:"", gmail:true, qid:q.id};
    render();
    return;
  }
  if(short){
    body = shortQuoteEmailBody(q);
    try{
      await downloadQuotePdf(q);
      pdfNote = `Saved ${(q.quoteNumber||'quote').replace(/[^\w-]+/g,'_')}.pdf to your device — attach it to the email before sending.`;
    }catch(e){
      if(e && e.code==="declined"){
        pdfNote = "PDF not saved. Use the 'Download PDF' button on this quote when you're ready, then attach it below.";
      } else {
        pdfNote = "Couldn't generate the PDF automatically — use 'Print / save as PDF' on this quote to get a copy, then attach it below.";
      }
    }
  } else {
    body = quoteLetterPlainText(q);
    const MAX = 1800; // keep well under mailto: URL limits across mail clients
    if(body.length > MAX){
      body = body.slice(0, MAX) + `\n\n...(quote continues — see the printed/PDF copy for the full works list)`;
    }
  }
  const mailto = `mailto:${email.trim()}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  S._modal = {type:"email", to:email, subject, body, mailto, pdfNote, qid:q.id};
  render();
}

/* =========================================================================
   PDF EXPORT (html2canvas + jsPDF, loaded on demand from cdnjs)
   ========================================================================= */
let _pdfLibsPromise = null;
function loadScript(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = ()=>resolve(); s.onerror = ()=>reject(new Error("Failed to load "+src));
    document.head.appendChild(s);
  });
}
function ensurePdfLibs(){
  if(!_pdfLibsPromise){
    _pdfLibsPromise = Promise.all([
      window.html2canvas ? Promise.resolve() : loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
      window.jspdf ? Promise.resolve() : loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
    ]);
  }
  return _pdfLibsPromise;
}
// Each A4 page gets only its own slice of the captured letter (previously the WHOLE image was
// embedded again on every page, so a 3-page letter carried it 3 times). `opts` lowers the capture
// scale / JPEG quality for a smaller file (the Gmail draft needs one under ~700 KB).
async function buildPdfBlobFromElement(elId, opts){
  opts = opts || {};
  await ensurePdfLibs();
  const el = document.getElementById(elId);
  if(!el) throw new Error("Content not found on the page");
  const canvas = await html2canvas(el, {scale: opts.scale||2, backgroundColor:'#ffffff', useCORS:true});
  const quality = opts.quality!=null ? opts.quality : 0.92;
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p','mm','a4');
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const W = canvas.width || 1, H = canvas.height || 1;
  const pagePx = Math.max(1, Math.floor(W * pageHeight / pageWidth));
  const pages = Math.max(1, Math.ceil(H / pagePx));
  for(let i=0;i<pages;i++){
    const sliceH = Math.min(pagePx, H - i*pagePx);
    let data;
    if(pages===1 || typeof document.createElement('canvas').getContext!=='function'){
      data = canvas.toDataURL('image/jpeg', quality);
    } else {
      const c = document.createElement('canvas'); c.width = W; c.height = sliceH;
      const g = c.getContext('2d');
      if(g){ g.fillStyle = '#ffffff'; g.fillRect(0,0,W,sliceH); g.drawImage(canvas, 0, i*pagePx, W, sliceH, 0, 0, W, sliceH); data = c.toDataURL('image/jpeg', quality); }
      else data = canvas.toDataURL('image/jpeg', quality);
    }
    if(i>0) pdf.addPage();
    pdf.addImage(data, 'JPEG', 0, 0, pageWidth, sliceH * pageWidth / W);
  }
  return pdf.output('blob');
}
// Smallest-good-enough PDF for an email attachment: steps the capture down until it fits.
async function buildEmailPdfBlob(elId, maxBytes){
  const steps = [{scale:2, quality:0.85}, {scale:1.5, quality:0.75}, {scale:1.25, quality:0.65}, {scale:1, quality:0.6}];
  let blob = null;
  for(const st of steps){
    blob = await buildPdfBlobFromElement(elId, st);
    if(!maxBytes || blob.size <= maxBytes) return blob;
  }
  return blob;
}
/* Saving a file from a published page has to go through the platform's own
   "downloads" capability (declared at publish time) — a page can't trigger a
   browser download directly. Falls back to the old direct-download trick
   only when that capability genuinely isn't available (e.g. a bare preview). */
async function saveGeneratedPdf(elId, filename){
  const blob = await buildPdfBlobFromElement(elId);
  let downloads = null;
  try{ downloads = await claude.use("downloads"); }catch(e){ downloads = null; }
  if(downloads){
    const result = await downloads.save({filename, data: blob});
    return result;
  }
  // fallback: direct browser download (works outside the sandboxed viewer)
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
  return {status:"saved"};
}

/* A published Artifact page can't call an outside postcode/address-lookup API (no such service
   is connected, and this page can't make arbitrary calls to third-party hosts) — so instead of
   a real postcode lookup, the address field's dropdown offers previous customers' addresses,
   built entirely from Matt's own quote history. Newest first, deduped, capped for a sane list. */
function pastAddresses(){
  const seen = new Set();
  const out = [];
  for(const q of S.quotes){
    const a = q.customer && q.customer.address ? q.customer.address.trim() : "";
    if(a && !seen.has(a)){ seen.add(a); out.push(a); }
    if(out.length>=40) break;
  }
  return out;
}

function optionFieldHtml(o, opts){
  const value = opts[o.key];
  if(o.showIf){
    const cond = typeof o.showIf==="function" ? o.showIf(opts) : o.showIf==="skins2" ? (opts.skins==="2") : !!opts[o.showIf];
    if(!cond) return "";
  }
  if(o.type==="select"){
    // `source` points at a tenant-built product library in Settings (e.g. Paving's jointing
    // compounds/edging styles — Settings → Pricing → Paving) instead of a hardcoded `options`
    // list or the materials-list-backed `customizable` below — see SERVICES.paving and the
    // "Paving" card in renderSettings for how tenants add/remove these. There's no built-in
    // default, so an empty/no-longer-existing value shows a disabled placeholder rather than
    // silently falling back to whatever the browser would otherwise highlight first. When the
    // field also carries `addFields` (a list of PAVING_LIB_FIELD_META keys beyond price), its
    // dropdown gets its own inline "+ Add new…" sentinel too, so a tenant can add one without
    // leaving the wizard — see the data-source-add handling in the input-event listener.
    if(o.source){
      const entries = (S.settings[o.source]||[]);
      // `extraOptions` adds fixed {value,label} choices alongside the tenant's own entries (e.g.
      // Gravel's "Steel edging").
      const extras = (typeof o.extraOptions==="function" ? o.extraOptions() : o.extraOptions) || [];
      // `sourceValueKey` stores another field of the entry (e.g. Fencing's fence type id) instead
      // of its name, so renaming an entry doesn't break jobs that already picked it.
      const valOf = e => o.sourceValueKey ? e[o.sourceValueKey] : e.name;
      const labelOf = {}; entries.forEach(e=>{ labelOf[valOf(e)] = o.sourceLabel ? o.sourceLabel(e) : e.name; });
      const optionsList = entries.map(valOf).concat(extras.map(x=>x.value));
      const needsPlaceholder = !value || !optionsList.includes(value);
      const placeholder = needsPlaceholder ? `<option value="" disabled selected>${esc(o.placeholder||('Select '+o.label.toLowerCase()+'…'))}</option>` : '';
      const canAdd = !!o.addFields || !!o.addAction;
      const emptyHint = (entries.length || extras.length) ? '' : `<div class="hint">${canAdd? 'None saved yet — pick "+ Add new…" above to add one.' : 'None saved yet — add one in Settings → Pricing.'}</div>`;
      const addDefaultsAttr = o.addFieldDefaults ? ` data-add-field-defaults="${esc(JSON.stringify(o.addFieldDefaults))}"` : '';
      // `addAction` makes the "+ Add…" sentinel open something other than the product modal
      // (Fencing's fence-type builder) — see the data-add-action handling in the input listener.
      const addAttr = o.addAction ? ` data-add-action="${esc(o.addAction)}"`
        : canAdd ? ` data-source-add="${esc(o.source)}" data-add-label="${esc(o.addLabel||o.label.toLowerCase())}" data-add-fields="${esc(o.addFields.join(','))}"${addDefaultsAttr}` : '';
      return `<div class="field"><label>${o.label}</label><select data-opt="${o.key}"${addAttr}>${placeholder}${optionsList.map(v=>{ const ex = extras.find(x=>x.value===v); return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(ex?ex.label:(labelOf[v]!=null?labelOf[v]:v))}</option>`; }).join('')}${canAdd?`<option value="__add_other__">${esc(o.addOptionLabel||'+ Add new…')}</option>`:''}${canAdd && !o.addAction && !needsPlaceholder && entries.some(e=>valOf(e)===value)?`<option value="__edit_current__">✎ Edit "${esc((entries.find(e=>valOf(e)===value)||{}).name||value)}"…</option>`:''}</select>${emptyHint}</div>${o.hint?`<div class="hint">${esc(o.hint)}</div>`:''}`;
    }
    // `customizable` (a CUSTOM_STYLE_SECTIONS key) adds any materials Matt has previously typed
    // in via "+ Add other…" on this dropdown, plus the sentinel option itself — see the
    // addMaterialOption modal and the data-customizable handling in the input-event listener.
    // A field that sets its own `default` always has a real starting value, so the placeholder
    // only ever shows for one that deliberately doesn't (e.g. Paving's slab type).
    let optionsList = o.options;
    if(o.customizable){
      const extra = (S.settings.customStyleOptions && S.settings.customStyleOptions[o.customizable]) || [];
      optionsList = o.options.concat(extra.filter(v=>!o.options.includes(v)));
    }
    const customAttr = o.customizable ? ` data-customizable="${esc(o.customizable)}"` : '';
    const needsCustomPlaceholder = o.customizable && (!value || !optionsList.includes(value));
    const customPlaceholder = needsCustomPlaceholder ? `<option value="" disabled selected>${esc(o.placeholder||('Select '+o.label.toLowerCase()+'…'))}</option>` : '';
    return `<div class="field"><label>${o.label}</label><select data-opt="${o.key}"${customAttr}>${customPlaceholder}${optionsList.map(v=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(v)}</option>`).join('')}${o.customizable?`<option value="__add_other__">+ Add new…</option>`:''}${o.customizable && !needsCustomPlaceholder && S.settings.materials && S.settings.materials[value]?`<option value="__edit_current__">✎ Edit "${esc(value)}"…</option>`:''}</select></div>${o.hint?`<div class="hint">${esc(o.hint)}</div>`:''}`;
  }
  if(o.type==="yesno"){
    return `<div class="field"><label>${o.label}</label>
      <div class="row" style="gap:6px;">
        <button type="button" class="btn ${value?'btn-primary':'btn-ghost'} btn-sm" data-action="setOpt" data-opt="${o.key}" data-val="true" style="flex:1;">Yes</button>
        <button type="button" class="btn ${!value?'btn-primary':'btn-ghost'} btn-sm" data-action="setOpt" data-opt="${o.key}" data-val="false" style="flex:1;">No</button>
      </div></div>`;
  }
  if(o.type==="number"){
    return `<div class="field"><label>${o.label}</label><input type="text" inputmode="decimal" data-opt="${o.key}" value="${esc(value)}" ${o.placeholder?`placeholder="${esc(o.placeholder)}"`:''}></div>${o.hint?`<div class="hint">${esc(o.hint)}</div>`:''}`;
  }
  if(o.type==="text"){
    return `<div class="field"><label>${o.label}</label><input type="text" data-opt="${o.key}" value="${esc(value||'')}" ${o.placeholder?`placeholder="${esc(o.placeholder)}"`:''}></div>${o.hint?`<div class="hint">${esc(o.hint)}</div>`:''}`;
  }
  return "";
}

function wizMeasure(d){
  const key = currentMeasureKey(d);
  if(!key){ d.step="people"; return wizPeople(d); }
  const totalPages = d.serviceKeys.length + (draftWastePreview(d) ? 1 : 0);
  if(key==="waste") return wizWaste(d, totalPages);
  const def = SERVICES[key];
  const st = ensureSectionState(key);
  const ctx = ctxFor(S.settings, d.people||3);

/* "Waste removal & site clearance" measurement page — combined area is auto-calculated from

// A service's options for this job: its fixed options plus any that depend on a choice already
// made (Fencing's fence-type options, inserted straight after the fence type). Their defaults are
// filled in on first sight so ticks show the right state.
function serviceOptionsFor(def, opts){
  if(!def.extraOptions) return def.options;
  const extra = def.extraOptions(opts) || [];
  extra.forEach(o=>{ if(opts[o.key]===undefined) opts[o.key] = o.default; });
  return [def.options[0]].concat(extra, def.options.slice(1));
}

}

// A row's dig-out depth in whole mm. Rows from a quote saved before the rework have no
// digOutDepth — they fall back to the old job-level concrete depth plus the MOT depth, so
// revising an old quote (e.g. adding a row) keeps its existing bases sensible.
function cbRowDig(r, opt, mot){
  if(r.digOutDepth!==undefined) return Math.round(Number(r.digOutDepth)||0);
  if(opt && opt.depth!==undefined) return Math.round((Number(opt.depth)||100) + mot);
  return 0;
}

  const num = (f, label, ph) => `<div class="field" style="flex:1 1 100px;margin:0;"><label>${label}</label><input type="text" inputmode="decimal" data-mf="${f}" value="${esc(r[f]!=null?r[f]:'')}" placeholder="${ph}"></div>`;

    </div>
  </div>`;
}

// Column headings above the measurement rows for services with 4+ columns, where placeholders

/* =========================================================================

function notesArrayFor(d, scopeKey){

      <div class="row" style="align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--line-soft);">

          <label class="checkline" style="margin-top:4px;"><input type="checkbox" data-note-customer data-note-scope="${esc(scopeKey)}" data-note-idx="${i}" ${n.customerFacing?'checked':''}> Show on customer quote sheet</label>

}
/* Every note across every measurement step, plus any general notes, rolled up into one place —
   shown on the quote detail screen (and the wizard preview) so nothing is left scattered across
   individual steps when the quote is reopened later. Includes notes regardless of their
   customer-facing flag, since this view is for Matt's own internal reference. */
function customerFacingNoteTexts(notes){
  return (notes||[]).filter(n=>n.customerFacing && n.text && n.text.trim()).map(n=>n.text.trim());
}
function collectQuoteNotes(q){
  const out = [];
  (q.sections||[]).forEach(s=>{
    (s.notes||[]).forEach(n=>{ if(n.text && n.text.trim()) out.push({source:s.label, text:n.text, customerFacing: !!n.customerFacing}); });
  });
  (q.generalNotes||[]).forEach(n=>{ if(n.text && n.text.trim()) out.push({source:"General", text:n.text, customerFacing: !!n.customerFacing}); });
  return out;
}
function quoteNotesHtml(q){
  const notes = collectQuoteNotes(q);
  return `<div class="card">

}

function wizExtras(d){
  // Older drafts held qty × unit price — show them as materials in the new layout.
  d.extras = (d.extras||[]).map(e=>{ const xp = extraParts(e); return xp.legacy ? {description:e.description||'', materials: String(Math.round(xp.materials*100)/100), plant:'', labourDays:''} : e; });

function buildQuoteFromDraft(d, status, opts){
  const existing = S.editingQuoteId ? S.quotes.find(q=>q.id===S.editingQuoteId) : null;
  const ctx = ctxFor(S.settings, d.people||3);
  // Editing keeps the quote's own mark-up (prices still update to today's).
  if(existing) ctx.markupPercent = existing.markupPercent!=null ? (Number(existing.markupPercent)||0) : +(quoteMarkupRate(existing)*100).toFixed(4);
  const sections = d.serviceKeys.filter(key=>SERVICES[key]).map(key=>{
    const st = S.draft.sectionsRaw[key];
    return priceSection(key, st.rows, st.options, ctx, st.notes);
  }).concat(deepClone(d.frozenSections||[])); // services since deleted keep their saved pricing
  const wasteOpts = S.draft.sectionsRaw.waste ? S.draft.sectionsRaw.waste.options : null;
  const wasteNotes = S.draft.sectionsRaw.waste ? S.draft.sectionsRaw.waste.notes : null;
  const waste = calcWasteRemoval(sections, ctx, wasteOpts, wasteNotes);
  const allSections = waste ? sections.concat([waste]) : sections;
  const totals = calcQuote(allSections, d.extras, ctx);
  const quoteNumber = existing ? existing.quoteNumber : (opts && opts.assignNumber ? nextQuoteNumber() : peekQuoteNumber());
  // Start from the saved quote so nothing it carries (team, schedule, payment plan, finance,
  // activity log…) is dropped when it's edited; then lay the re-priced fields over it.
  const q = Object.assign(existing ? deepClone(existing) : {}, {
    id: existing ? existing.id : uid(),
    quoteNumber,
    createdAt: existing ? existing.createdAt : new Date().toISOString(),
    createdBy: d.createdBy,
    customer: deepClone(d.customer),
    people: d.people,
    sections: allSections,
    extras: (()=>{ const xb = extrasBreakdown(d.extras, ctx); return deepClone(d.extras||[]).map((e,i)=>Object.assign(e, {cost: Math.round((xb.each[i]||0)*100)/100})); })(),
    generalNotes: deepClone(d.generalNotes||[]),
    totals,
    status: existing ? existing.status : (status||"draft"),
    startDate: existing ? existing.startDate : null,
    paymentSchedule: existing ? existing.paymentSchedule : null,
    // Captured at quote-build time so a job's letter/payment plan always reflects whatever VAT
    // treatment applied when it was created, even if the business's own setting changes later.
    vatRegistered: existing ? existing.vatRegistered : (S.settings.vatRegistered!==false),
    markupPercent: ctx.markupPercent||0,
    vatRate: existing && existing.vatRate!=null ? existing.vatRate : (S.settings.vatRegistered===false ? 0 : (Number(S.settings.vatRate)||0)),
    finance: existing ? existing.finance : null,
    activityLog: existing ? (existing.activityLog||[]) : [],
  });
  // Billable extras added during the job stay in the total.
  if(q.finance && q.finance.materials){
    const base = deepClone(q.totals);
    (q.finance.materials.unplanned||[]).filter(m=>m.billable).forEach(m=>applyBillableToTotals(q, Number(m.cost)||0));
    q._baseTotals = base; // pre-billable totals, for refreshing the finance baselines (not stored)
  }
  return q;
}
// After an accepted job is edited: refresh the finance tracker's quoted baselines (keeping every
// ticked material, logged day, cost and payment), and for an ongoing job re-book its days from
// the same start date and team and rebuild the payment plan (keeping any "Additional work" lines).
function refreshJobAfterEdit(q){
  const base = q._baseTotals || q.totals; delete q._baseTotals;
  if(q.finance){
    const fresh = createFinanceTracker(Object.assign({}, q, {totals: base}));
    const fin = q.finance;
    const old = fin.materials.checklist||[];
    const used = new Set();
    fin.materials.checklist = fresh.materials.checklist.map(item=>{
      const prev = old.find(o=>!used.has(o) && o.name===item.name && o.sectionLabel===item.sectionLabel && o.source===item.source);
      if(!prev) return item;
      used.add(prev);
      return Object.assign(item, {id:prev.id, ordered:prev.ordered, orderedAt:prev.orderedAt, actualUnitPrice:prev.actualUnitPrice, actualIncVat:prev.actualIncVat, actualTotal:prev.actualTotal});
    }).concat(old.filter(o=>!used.has(o) && o.ordered).map(o=>Object.assign({}, o, {quotedTotal:0, quotedQty:0, removedFromQuote:true})));
    fin.materials.quotedTotal = fresh.materials.quotedTotal;
    fin.labor.quotedDays = fresh.labor.quotedDays;
    fin.labor.quotedPersonDays = fresh.labor.quotedPersonDays;
    fin.labor.quotedCost = fresh.labor.quotedCost;
    fin.runningCosts.quotedTotal = fresh.runningCosts.quotedTotal;
  }
  if(q.status==="ongoing" && q.startDate){
    if(!q.teamId) q.teamId = defaultTeamId();
    q.scheduledDays = scheduleWorkingDays(q.startDate, q.totals.totalDays, S.settings, blockedDateSet(q.id, null, q.teamId));
    const completion = q.scheduledDays.length ? q.scheduledDays[q.scheduledDays.length-1] : q.startDate;
    const added = (q.paymentSchedule||[]).filter(p=>/^Additional work: /.test(p.label||''));
    const addedTotal = sum(added.map(p=>Number(p.amount)||0));
    const t = Object.assign({}, q.totals, {total: Math.round((q.totals.total - addedTotal)*100)/100});
    q.paymentSchedule = calcPaymentSchedule(q.sections, q.extras, t, q.startDate, S.settings.weeklyPaymentAmount, q.vatRegistered, completion).concat(added);
  }
}
// Quote reference: three letters from the customer's name (titles like "Mr & Mrs" skipped, so
// "Mr & Mrs Fielding" → FIE) + the business's running number. The number is only taken (and the
// counter saved) when a new quote is actually saved — previews just show the next one.
function quoteRefLetters(name){
  const words = String(name||'').split(/[\s&,+\/]+/).map(w=>w.replace(/[^A-Za-z]/g,'')).filter(Boolean);
  const titles = /^(mr|mrs|ms|miss|mx|dr|prof|rev|sir|and|the|ltd|limited|plc|llp|co|company|sons?|bros|brothers|inc|uk)$/i;
  const keep = words.filter(w=>!titles.test(w));
  const pick = keep.length ? keep[keep.length-1] : (words.join('')||'');
  return pick.slice(0,3).toUpperCase() || "QTE";
}
function quoteNumberNumeric(n){ const m = String(n||'').match(/(\d+)\s*$/); return m ? parseInt(m[1],10) : 0; }
function peekQuoteNumber(){
  const next = Math.max(S.settings.quoteCounter||0, ...S.quotes.map(q=>quoteNumberNumeric(q.quoteNumber)), 0) + 1;
  return quoteRefLetters(S.draft && S.draft.customer && S.draft.customer.name) + String(next).padStart(3,'0');
}
function nextQuoteNumber(){
  const ref = peekQuoteNumber();
  S.settings.quoteCounter = quoteNumberNumeric(ref);
  return ref;
}

/* Scrapes whatever's currently on-screen for the builder's CURRENT step back into
   S._svcBuilder, before switching step or adding/removing a row — the same read-on-navigate
   pattern the main quote wizard uses (see wizNext), so nothing typed is lost. */
function readSvcBuilderStep(b){
  const get = sel => { const e = App.querySelector(sel); return e ? e.value : ''; };
  const chkd = sel => { const e = App.querySelector(sel); return !!(e && e.checked); };
  if(b.step===1){
    b.name = val('svcName');
    if(b.mode==="fence"){
      b.heightMm = val('svcFenceHeight'); b.postSpacingMm = val('svcPostSpacing'); b.stockLengthMm = val('svcStockLength');
      b.postMaterial = val('svcPostMaterial'); b.postPrice = val('svcPostPrice');
    }
    const opts = [];
    App.querySelectorAll('[data-svcoptrow]').forEach(rowEl=>{
      const i = rowEl.getAttribute('data-svcoptrow');
      const prev = b.options[Number(i)] || {};
      const type = prev.type || "yesno";
      const dv = get(`[data-svcopt-default="${i}"]`);
      opts.push({key: rowEl.getAttribute('data-svcopt-key') || ('o'+uid().slice(0,6)), label: get(`[data-svcopt-label="${i}"]`), type,
        default: type==="number" ? dv : dv==="true"});
    });
    b.options = opts;
  } else if(b.step===2){
    const rows = [];
    App.querySelectorAll('[data-svcmatrow]').forEach(rowEl=>{
      const i = rowEl.getAttribute('data-svcmatrow');
      rows.push({
        name: get(`[data-svcmat-name="${i}"]`),
        amount: get(`[data-svcmat-amount="${i}"]`),
        per: get(`[data-svcmat-per="${i}"]`) || '1',
        basis: get(`[data-svcmat-basis="${i}"]`) || 'unit',
        roundUp: chkd(`[data-svcmat-roundup="${i}"]`),
        onlyIf: get(`[data-svcmat-onlyif="${i}"]`),
        optionKey: get(`[data-svcmat-option="${i}"]`),
        unit: get(`[data-svcmat-unit="${i}"]`),
        price: get(`[data-svcmat-price="${i}"]`),
        supplier: get(`[data-svcmat-supplier="${i}"]`),
      });
    });
    b.materials = rows.length ? rows : [bldBlankMaterial()];
  } else if(b.step===3){
    b.productivity = val('svcProductivity');
    if(b.waste && b.mode!=="fence"){
      b.wasteItem = {
        name: val('svcWasteName'), amount: val('svcWasteAmount'), per: val('svcWastePer') || '1',
        unit: val('svcWasteUnit'), price: val('svcWastePrice'), supplier: val('svcWasteSupplier'),
      };
    }
    const plant = [];
    App.querySelectorAll('[data-svcplantrow]').forEach(rowEl=>{
      const i = rowEl.getAttribute('data-svcplantrow');
      plant.push({name: get(`[data-svcplant-name="${i}"]`), price: get(`[data-svcplant-price="${i}"]`)});
    });
    b.plant = plant;
    const letter = [];
    App.querySelectorAll('[data-svcltrrow]').forEach(rowEl=>{
      const i = rowEl.getAttribute('data-svcltrrow');
      letter.push({text: get(`[data-svcltr-text="${i}"]`), onlyIf: get(`[data-svcltr-onlyif="${i}"]`),
        appendIf: get(`[data-svcltr-appendif="${i}"]`), append: get(`[data-svcltr-append="${i}"]`)});
    });
    b.letter = letter;
  }
}
function bldValidateStep(b, step){
  const isFence = b.mode==="fence";
  if(step===1){
    if(!(b.name||'').trim()) return `Give the ${isFence?'fence type':'service'} a name first.`;
    if(isFence){
      if(!(Number(b.heightMm)>0)) return "Enter the fence height (mm).";
      if(!(Number(b.postSpacingMm)>0)) return "Enter the post spacing (mm).";
      if(!(Number(b.stockLengthMm)>0)) return "Enter the stock post length (mm).";
      if(!(b.postMaterial||'').trim()) return "Pick or name the post material.";
    }
  } else if(step===2){
    const valid = b.materials.filter(m=>m.name && (Number(m.amount)||0)>0);
    if(!isFence && valid.length===0) return "Add at least one material with an amount.";
    if(b.materials.some(m=>m.name && (Number(m.amount)||0)>0 && m.basis==="option" && !m.optionKey)) return 'Pick the number option for every "× a number option" material.';
  } else if(step===3){
    if(!isFence && b.waste && !(b.wasteItem && b.wasteItem.name && b.wasteItem.name.trim() && (Number(b.wasteItem.amount)||0)>0))
      return "Add the waste item and an amount, or switch waste removal to No.";
  }
  return "";
}
function bldBlankMaterial(){ return {name:"",amount:"",per:"1",unit:"",price:"",supplier:"",basis:"unit",roundUp:false,onlyIf:"",optionKey:""}; }
// Opens the builder for a new or existing custom service ("service") or fence type ("fence").
function openServiceBuilder(mode, editKey, extra){
  S.err = "";
  const b = {mode, editKey: editKey||null, step:1, name:"", measureType: mode==="fence" ? "length" : "area_wl",
    heightMm:"1800", postSpacingMm:"1800", stockLengthMm:"2400", postMaterial:"", postPrice:"", postKind:"timber",
    options:[], materials:[bldBlankMaterial()], waste:false, wasteItem:{name:"",amount:"",per:"1",unit:"",price:"",supplier:""},
    productivity:"", plant:[], letter:[], returnToQuote:false};
  Object.assign(b, extra||{});
  const toRow = l => Object.assign(bldBlankMaterial(), {name:l.material, amount:String(l.amount!=null?l.amount:''), per:String(l.per||1),
    basis:l.basis||'unit', roundUp:!!l.roundUp, onlyIf:l.onlyIf||'', optionKey:l.optionKey||''});
  if(mode==="service" && editKey){
    const cs = (S.settings.customServices||[]).find(x=>x.key===editKey);
    if(cs){
      const lines = Array.isArray(cs.lines) ? cs.lines : (cs.materials||[]).map(m=>({material:m.name, basis:"unit", amount:m.amountPerUnit, per:1}));
      Object.assign(b, {name:cs.label, measureType:cs.measureType||"area_wl", productivity:String(cs.productivityDefault||''),
        options:deepClone(cs.options||[]), materials: lines.length ? lines.map(toRow) : [bldBlankMaterial()],
        waste: !!(cs.waste && cs.waste.name), wasteItem: cs.waste && cs.waste.name ? {name:cs.waste.name, amount:String(cs.waste.amountPerUnit), per:"1", unit:"", price:"", supplier:""} : b.wasteItem,
        plant:(cs.plant||[]).map(p=>({name:p.name, price:""})), letter:deepClone(cs.letter||[])});
    }
  }
  if(mode==="fence" && editKey){
    const ft = fenceTypeById(editKey);
    if(ft){
      Object.assign(b, {name:ft.name, heightMm:String(ft.heightMm), postSpacingMm:String(ft.postSpacingMm), stockLengthMm:String(ft.stockLengthMm),
        postMaterial:ft.postMaterial||'', postKind:ft.postKind||'timber', productivity:String(ft.productivity||''),
        options:deepClone(ft.options||[]), materials:(ft.lines||[]).length ? ft.lines.map(toRow) : [bldBlankMaterial()],
        plant:(ft.plant||[]).map(p=>({name:p.name, price:""})), letter:deepClone(ft.letter||[])});
    }
  }
  S._svcBuilder = b;
  S._settingsTab = "services";
  goto("settings");
  // The builder sits below the services list — take the user straight to it.
  setTimeout(()=>{ const c = document.getElementById('svcBuilderCard'); if(c && c.scrollIntoView) c.scrollIntoView({block:'start', behavior:'smooth'}); }, 30);
}

    <div class="hint" style="margin-bottom:10px;">How much ONE PERSON gets through in a day for each service — these are the starting figures every new quote uses; you can still override one for a specific job in the wizard. A job's actual calendar time is this split across however many people you put on it; the labour cost is the same either way.</div>
    <div class="tbl-wrap">
      <table><tr><th>Service</th><th style="text-align:right;">Rate</th></tr>
      ${[...availableServiceKeys(s), ...(s.customServices||[]).map(cs=>cs.key)].map(key=>{
        const svc = SERVICES[key];
        const prodOpt = svc && svc.options.find(o=>o.key==="productivity");
        // Fencing's rate lives on each fence type (Settings → Pricing → Fencing), not here.
        if(!prodOpt || key==="fence") return '';
        const unitMatch = prodOpt.label.match(/\(([^)]+)\)/);
        const unit = unitMatch ? unitMatch[1] : "/day/person";
        return `<tr>
          <td>${esc(svc.label)}</td>
          <td class="num"><input type="text" inputmode="decimal" data-prod="${key}" value="${s.productivity && s.productivity[key]!=null ? s.productivity[key] : prodOpt.default}" style="width:90px;text-align:right;"> <span class="hint" style="display:inline;">${unit}</span></td>
        </tr>`;
      }).join('')}
      </table>
    </div>
    <div style="font-weight:800;font-size:12px;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 6px;">Waste removal &amp; site clearance productivity</div>
    <div class="hint" style="margin-bottom:10px;">Digger hire and clearance labour are driven by a job's combined waste-eligible AREA; grab hire is driven by their combined dig-out VOLUME (area × dig-out depth) — you can still override any of these for a specific job in the wizard. Digger and grab hire are machine throughput, so headcount doesn't change them; clearance labour is per person, same as every other service.</div>
    <div class="tbl-wrap">
      <table><tr><th>Item</th><th style="text-align:right;">Rate</th></tr>
      ${[["wasteDigger","Digger hire"],["wasteLabour","Clearance labour"]].map(([key,label])=>{
        const def = {wasteDigger:50, wasteLabour:20}[key];
        const unit = key==="wasteLabour" ? "m²/day/person (at a 150mm dig-out)" : "m²/day (at a 150mm dig-out)";
        return `<tr>
          <td>${label}</td>
          <td class="num"><input type="text" inputmode="decimal" data-prod="${key}" value="${s.productivity && s.productivity[key]!=null ? s.productivity[key] : def}" style="width:90px;text-align:right;"> <span class="hint" style="display:inline;">${unit}</span></td>
        </tr>`;
      }).join('')}
      <tr>
        <td>Grab hire</td>
        <td class="num"><input type="text" inputmode="decimal" id="st_wasteGrabM3PerLoad" value="${s.wasteGrabM3PerLoad!=null?s.wasteGrabM3PerLoad:5}" style="width:90px;text-align:right;"> <span class="hint" style="display:inline;">m³/load</span></td>
      </tr>
      </table>
    </div>
    <div class="row">
      <div class="field"><label>Digger hire block size (days)</label><input id="st_diggerBlockDays" type="text" inputmode="decimal" value="${s.diggerBlockDays!=null?s.diggerBlockDays:5}"><div class="hint">Digger hire is billed in flat blocks of this many days (a week's hire, by default) — digger-days are rounded up to the nearest whole block. There's no per-job override for this, since it's a supplier hire-contract fact rather than something that varies job to job.</div></div>
    </div>
    ${pavingProductLibraryHtml("wasteSkips","Skips (price per skip)","skip",["price","supplier"])}
    <div class="hint" style="margin:-4px 0 10px;">Pick one on a quote's Waste removal step with "Add a skip?" — it's added on top of the grab hire.</div>
    <div style="font-weight:800;font-size:12px;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 6px;">Waste &amp; spoil eligibility</div>
    <div class="hint" style="margin-bottom:10px;">Which services feed the combined area/volume above, and the dig-out depth each one assumes by default (overridable per job in the wizard). For a service with its own "Dig out necessary?" option, switching "Generates spoil?" on here only takes effect on a job where that's also ticked.</div>
    <div class="tbl-wrap">
      <table><tr><th>Service</th><th>Generates spoil?</th><th style="text-align:right;">Default dig-out depth</th></tr>
      ${[...availableServiceKeys(s), ...(s.customServices||[]).map(cs=>cs.key)].map(key=>{
        const svc = SERVICES[key];
        if(!svc || NEVER_SPOIL.has(key)) return '';
        const on = !!(s.generatesSpoil && s.generatesSpoil[key]);
        const depthDefault = (s.digOutDepthDefaults && s.digOutDepthDefaults[key]!=null) ? s.digOutDepthDefaults[key] : 150;
        const reuseNote = '';
        const perRowFooting = key==="brickwall" || key==="waterfeatures";
        return `<tr>
          <td>${esc(svc.label)}${reuseNote}</td>
          <td>${ALWAYS_SPOIL.has(key) ? `<span class="hint" style="display:inline;">Always</span>` : `<button type="button" class="btn ${on?'btn-primary':'btn-ghost'} btn-sm" data-action="toggleGeneratesSpoil" data-key="${key}">${on?'Yes':'No'}</button>`}</td>
          <td class="num">${perRowFooting ? `<span class="hint" style="display:inline;">${key==="waterfeatures"?'hole size per row':'footing depth per row'}</span>` : `<input type="text" inputmode="decimal" data-digdepth="${key}" value="${depthDefault}" style="width:90px;text-align:right;" ${(on || ALWAYS_SPOIL.has(key))?'':'disabled'}> <span class="hint" style="display:inline;">mm</span>`}</td>
        </tr>`;
      }).join('')}
      </table>
    </div>
    <div style="font-weight:800;font-size:12px;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 6px;">Turf</div>
    <div class="hint" style="margin-bottom:10px;">How much topsoil a turf job needs: area ÷ baseline coverage, scaled by that job's dig-out depth ÷ this baseline depth (overridable per job in the wizard) — the defaults below reproduce the long-standing 1 tonne per 10m² at a 50mm dig-out.</div>
    <div class="row">
      <div class="field"><label>Topsoil baseline coverage (m²/tonne)</label><input id="st_turfBaselineCoverage" type="text" inputmode="decimal" value="${s.turfTopsoilBaselineCoverage}"></div>
      <div class="field"><label>Topsoil baseline depth (mm)</label><input id="st_turfBaselineDepth" type="text" inputmode="decimal" value="${s.turfTopsoilBaselineDepth}"></div>
    </div>
    <div class="row">
      <div class="field"><label>Turf wastage (%)</label><input id="st_turfWastage" type="text" inputmode="decimal" value="${s.turfWastagePercent}"></div>
      <div class="field"><label>Consumables allowance (per job)</label><input id="st_turfConsumables" type="text" inputmode="decimal" value="${s.turfConsumablesQty}"></div>
    </div>
    <div style="font-weight:800;font-size:12px;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 6px;">Gravel</div>
    <div class="hint" style="margin-bottom:10px;">Gravel tonnes = area ÷ gravel coverage × (gravel depth ÷ baseline gravel depth). Type 1 MOT tonnes = area ÷ MOT coverage × (MOT depth ÷ baseline MOT depth), where MOT depth = each row's dig-out depth − the gravel depth. Both are rounded up once on the job total. Gravel types are added straight from the Gravel type dropdown on a quote ("+ Add new…", priced per tonne) — the list below lets you delete one. Edging styles can be added from the quote or from here. A quote can't be finalised with a £0 gravel or edging price.</div>
    <div class="row">
      <div class="field"><label>Gravel coverage (m²/tonne)</label><input id="st_gravelCoverage" type="text" inputmode="decimal" value="${s.gravelCoverage!=null?s.gravelCoverage:10}"></div>
      <div class="field"><label>Baseline gravel depth (mm)</label><input id="st_gravelBaseDepth" type="text" inputmode="decimal" value="${s.gravelBaselineDepth!=null?s.gravelBaselineDepth:50}"></div>
    </div>
    <div class="row">
      <div class="field"><label>Type 1 MOT coverage (m²/tonne)</label><input id="st_gravelMotCoverage" type="text" inputmode="decimal" value="${s.gravelMotCoverage!=null?s.gravelMotCoverage:5}"></div>
      <div class="field"><label>Baseline MOT depth (mm)</label><input id="st_gravelMotDepth" type="text" inputmode="decimal" value="${s.gravelMotBaselineDepth!=null?s.gravelMotBaselineDepth:100}"></div>
    </div>
    <div class="row">
      <div class="field"><label>Consumables quantity (per job)</label><input id="st_gravelConsumables" type="text" inputmode="decimal" value="${s.gravelConsumablesQty!=null?s.gravelConsumablesQty:1}"></div>
      <div class="field"><label>Edging productivity (m/day/person)</label><input id="st_gravelEdgingProd" type="text" inputmode="decimal" value="${s.productivity && s.productivity.gravelEdging!=null ? s.productivity.gravelEdging : 12}"></div>
    </div>
    ${customStyleOptionsListHtml("gravel","Gravel types","gravel type")}
    ${pavingProductLibraryHtml("gravelEdgingStyles","Edging styles","edging style",["piecesPerMetre","price"])}
    <div style="font-weight:800;font-size:12px;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 6px;">Block Retaining Wall</div>
    <div class="hint" style="margin-bottom:10px;">Footing concrete scales from the baseline below: the job's total footing volume ÷ (baseline area × baseline depth) × the baseline ballast, sharp sand and cement. Sharp sand is the shared "Sharp sand" material also used by Paving and Block paving. Coping width for per-m² copings = wall thickness + face skin thickness + 2 × overhang. Face products, rebar and copings have no built-in default — add them from their dropdowns on a quote or here. Paving slab types also appear in the coping list. A quote can't be finalised with a £0 price on sharp sand, pea shingle, wall ties (when used), the face product, rebar or coping.</div>
    <div class="row">
      <div class="field"><label>Footing baseline area (m²)</label><input id="st_bwBaseArea" type="text" inputmode="decimal" value="${s.brickwallFootingBaseArea!=null?s.brickwallFootingBaseArea:10}"></div>
      <div class="field"><label>Footing baseline depth (mm)</label><input id="st_bwBaseDepth" type="text" inputmode="decimal" value="${s.brickwallFootingBaseDepth!=null?s.brickwallFootingBaseDepth:100}"></div>
    </div>
    <div class="row">
      <div class="field"><label>Ballast per baseline (tonnes)</label><input id="st_bwBallast" type="text" inputmode="decimal" value="${s.brickwallFootingBallast!=null?s.brickwallFootingBallast:1}"></div>
      <div class="field"><label>Sharp sand per baseline (tonnes)</label><input id="st_bwSharpSand" type="text" inputmode="decimal" value="${s.brickwallFootingSharpSand!=null?s.brickwallFootingSharpSand:1}"></div>
      <div class="field"><label>Cement per baseline (bags)</label><input id="st_bwCement" type="text" inputmode="decimal" value="${s.brickwallFootingCement!=null?s.brickwallFootingCement:12}"></div>

    <div class="row">

      <div class="field"><label>Concrete blocks per m²</label><input id="st_bwBlocksPerM2" type="text" inputmode="decimal" value="${s.brickwallBlocksPerM2!=null?s.brickwallBlocksPerM2:10}"></div>
    </div>
    <div class="row">
      <div class="field"><label>Wall thickness (mm)</label><input id="st_bwWallThk" type="text" inputmode="decimal" value="${s.brickwallWallThickness!=null?s.brickwallWallThickness:100}"></div>
      <div class="field"><label>Coping overhang each side (mm)</label><input id="st_bwOverhang" type="text" inputmode="decimal" value="${s.brickwallCopingOverhang!=null?s.brickwallCopingOverhang:50}"></div>
      <div class="field"><label>Finishing productivity (m/day/person)</label><input id="st_bwFinishProd" type="text" inputmode="decimal" value="${s.brickwallFinishingProductivity!=null?s.brickwallFinishingProductivity:10}"></div>

    <div class="row">

    ${pavingProductLibraryHtml("brickwallFaceProducts","Face skin products","face product",["price","facePricedPer","piecesPerM2","thicknessMm"])}
    ${pavingProductLibraryHtml("brickwallRebar","Rebar","rebar",["price","lengthMm"])}
    ${pavingProductLibraryHtml("brickwallCopings","Coping products","coping",["price","copingPricedPer"])}

    <div class="hint" style="margin-bottom:10px;">Posts per run = ROUNDUP(length ÷ post spacing) + 1, cut from stock posts at in-ground depth + the tallest row's height. Stock post length, in-ground depth and postcrete bags per post are shared with Timber decking (same 100x100mm post) — change them in the Composite/Timber decking cards. Sleepers and screws have no built-in default — add them from their dropdowns on a quote or here. A quote can't be finalised with a £0 sleeper, screw, post, postcrete or Blackjack DPM price.</div>
    <div class="row">
      <div class="field"><label>Post spacing (mm)</label><input id="st_slSpacing" type="text" inputmode="decimal" value="${s.sleeperPostSpacing!=null?s.sleeperPostSpacing:1200}"></div>
      <div class="field"><label>Screws per sleeper</label><input id="st_slScrews" type="text" inputmode="decimal" value="${s.sleeperScrewsPerSleeper!=null?s.sleeperScrewsPerSleeper:6}"></div>
      <div class="field"><label>Consumables quantity (per job)</label><input id="st_slConsumables" type="text" inputmode="decimal" value="${s.sleeperConsumablesQty!=null?s.sleeperConsumablesQty:1}"></div>
    </div>
    ${pavingProductLibraryHtml("sleeperProducts","Sleepers","sleeper",["price","lengthMm","heightMm"])}
    ${pavingProductLibraryHtml("sleeperScrews","Screws","screw",["price","screwsPerBox"])}
    <div style="font-weight:800;font-size:12px;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 6px;">Fencing</div>
    <div class="hint" style="margin-bottom:10px;">Each fence type is a full builder entry — height, post spacing, stock post, post material, materials and their quantity rules, plant, options and letter wording. Every type also gets posts per run (with an end post), postcrete (the shared bags-per-post setting), a post saver sleeve per timber post, and the common Remove old fence (the "Remove old fence" rate per metre in Materials), Gate (the "Gate" price in Materials, overridable per job) and consumables options. Post cut length = the shared in-ground depth + the fence height. A quote can't be finalised while any line it uses has a £0 price or plant rate.</div>
    <div class="card" style="padding:14px 16px;margin:10px 0;">
      <div style="font-weight:800;font-size:13px;margin-bottom:8px;">Fence types</div>
      <div class="stack" style="gap:6px;margin-bottom:10px;">
        ${(s.fenceTypes||[]).map(ft=>`<div class="row" style="align-items:center;gap:10px;">
          <div style="flex:1;font-weight:600;">${esc(ft.name)}${ft.builtin?' <span class="hint" style="display:inline;">(pre-filled)</span>':''}</div>
          <div class="hint" style="min-width:200px;text-align:right;">${esc(ft.heightMm)}mm high · posts every ${esc(ft.postSpacingMm)}mm · ${esc(ft.productivity)} m/day</div>
          <button type="button" class="btn btn-ghost btn-sm" data-action="editFenceType" data-id="${esc(ft.id)}">Edit</button>
          ${ft.builtin ? '' : `<button type="button" class="icon-btn" data-action="deleteFenceType" data-id="${esc(ft.id)}" title="Remove">✕</button>`}
        </div>`).join('') || '<div class="hint">No fence types yet.</div>'}
      </div>
      <button type="button" class="btn btn-ghost btn-sm" data-action="addFenceType">+ Add fence type</button>
    </div>
    <div class="row">
      <div class="field"><label>Fencing consumables quantity (per job)</label><input id="st_fenceConsumables" type="text" inputmode="decimal" value="${s.fenceConsumablesQty!=null?s.fenceConsumablesQty:1}"></div>
    </div>
    <div style="font-weight:800;font-size:12px;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 6px;">Water features</div>
    <div class="hint" style="margin-bottom:10px;">Each row of a Water Features quote picks a feature (price per feature, inc VAT unless unticked), and optionally a hole size for the dig-out (fed into the shared waste pool) and pebbles (price per 20kg bag). Add them from the dropdowns on a quote or here. A quote can't be finalised with a £0 feature or pebble price.</div>
    <div class="row">
      <div class="field"><label>Water feature consumables quantity (per job)</label><input id="st_wfConsumables" type="text" inputmode="decimal" value="${s.wfConsumablesQty!=null?s.wfConsumablesQty:1}"></div>
    </div>
    ${pavingProductLibraryHtml("wfFeatures","Water feature products","water feature",["price","supplier"])}
    ${pavingProductLibraryHtml("wfHoleSizes","Hole sizes","hole size",["lengthMm","widthMm","depthMm"])}
    ${pavingProductLibraryHtml("wfPebbles","Pebbles (price per 20kg bag)","pebble product",["price"])}
    <div style="font-weight:800;font-size:12px;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 6px;">Pond</div>
    <div class="hint" style="margin-bottom:10px;">Each pond row needs a liner of at least (length + 2 × depth + 2 × overlap) by (width + 2 × depth + 2 × overlap); the chosen liner must cover that either way round. Underlay is that same area, priced per m² from Materials. Rocks = ROUNDUP(total area ÷ coverage). Liners, pumps, filters and bridges have no built-in default — add them from the dropdowns on a quote or here. A quote can't be finalised while any line has a £0 price.</div>
    <div class="row">
      <div class="field"><label>Liner overlap each side (mm)</label><input id="st_pondOverlap" type="text" inputmode="decimal" value="${s.pondLinerOverlap!=null?s.pondLinerOverlap:300}"></div>

      <div class="field"><label>Consumables quantity (per job)</label><input id="st_pondConsumables" type="text" inputmode="decimal" value="${s.pondConsumablesQty!=null?s.pondConsumablesQty:1}"></div>
    </div>
    ${pavingProductLibraryHtml("pondLiners","Liners","liner",["price","lengthMm","widthMm"])}
    ${pavingProductLibraryHtml("pondPumps","Pumps","pump",["price"])}
    ${pavingProductLibraryHtml("pondFilters","Filters","filter",["price"])}
    ${pavingProductLibraryHtml("pondBridges","Bridges","bridge",["price"])}
    <div style="font-weight:800;font-size:12px;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 6px;">Steel edging</div>
    <div class="hint" style="margin-bottom:10px;">Steel edging products are priced <strong>per metre</strong> (put the thickness, height or material in the name). Stakes per run = ROUNDUP(run length ÷ stake spacing) + 1; each rebar bar is cut into ROUNDDOWN(bar length ÷ stake length) stakes; bars = ROUNDUP(total stakes ÷ stakes per bar). The welder's daily rate is in Materials. A quote can't be finalised with a £0 steel, rebar, consumables or welder price.</div>
    <div class="row">
      <div class="field"><label>Stake spacing (mm)</label><input id="st_steelSpacing" type="text" inputmode="decimal" value="${s.steelStakeSpacing!=null?s.steelStakeSpacing:500}"></div>
      <div class="field"><label>Stake length (mm)</label><input id="st_steelStakeLen" type="text" inputmode="decimal" value="${s.steelStakeLength!=null?s.steelStakeLength:500}"></div>

    </div>
    ${pavingProductLibraryHtml("steelEdgingProducts","Steel edging products (£ per metre)","steel edging product",["priceM"])}
    ${pavingProductLibraryHtml("steelRebar","Rebar (£ per bar)","rebar",["price","lengthMm"])}
    <div style="font-weight:800;font-size:12px;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 6px;">Flower beds</div>
    <div class="hint" style="margin-bottom:10px;">Compost and bark mulch are built in and come in bulk bags. The top layer of every bed is bark mulch (the depth below); compost fills the rest of each row's dig-out. Bark mulch bags = ROUNDUP(total area × mulch depth ÷ bag volume). Compost bags = ROUNDUP(Σ row area × (dig-out depth − mulch depth) ÷ bag volume). Their prices are "Peat free compost bulk bag" and "Bark mulch" in your Materials list. Edging pieces = ROUNDUP(edging length × pieces per metre). The default dig-out depth per row is in the Waste &amp; spoil table above. A quote can't be finalised while any line has a £0 price.</div>
    <div class="row">

    </div>
    ${pavingProductLibraryHtml("fbEdgingStyles","Edging styles","edging style",["piecesPerMetre","price"])}
    <div style="font-weight:800;font-size:12px;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 6px;">Artificial turf</div>
    <div class="hint" style="margin-bottom:10px;">Type 1 MOT = ROUNDUP(Σ row area × baseline rate × ((dig-out − surface build-up) ÷ baseline depth)). Turf = ROUNDUP(area × (1 + wastage %)). Infill bags = ROUNDUP(area ÷ coverage). Seam tape rolls = ROUNDUP(edging length ÷ roll length). Edge restraint concrete (sand/ballast/cement) and the cement mixer only apply with a non-steel edging length. The default dig-out depth per row is in the Waste &amp; spoil table above. A quote can't be finalised while any material in use has a £0 price.</div>
    <div class="row">
      <div class="field"><label>Surface build-up (mm)</label><input id="st_atBuildUp" type="text" inputmode="decimal" value="${s.atSurfaceBuildUp!=null?s.atSurfaceBuildUp:25}"></div>

    <div class="row">
      <div class="field"><label>Turf wastage (%)</label><input id="st_atWastage" type="text" inputmode="decimal" value="${s.atWastagePercent!=null?s.atWastagePercent:20}"></div>

      <div class="field"><label>Infill coverage (m² per bag)</label><input id="st_atInfill" type="text" inputmode="decimal" value="${s.atInfillCoverage!=null?s.atInfillCoverage:5}"></div>
    </div>
    <div class="row">
      <div class="field"><label>Consumables quantity (per job)</label><input id="st_atConsumables" type="text" inputmode="decimal" value="${s.atConsumablesQty!=null?s.atConsumablesQty:1}"></div>

function render(){
  if(S.screen==="loading"){ App.innerHTML = `<div class="empty" style="margin-top:80px;">Loading…</div>`; return; }
  if(S.screen==="login"){ renderLogin(); }
  else if(!S.authed && S.screen!=="setup"){ S.screen="login"; renderLogin(); }
  else if(S.screen==="setup"){ renderSetup(); }
  else if(S.screen==="menu"){ renderMenu(); }
  else if(S.screen==="newquote"){ renderNewQuote(); }
  else if(S.screen==="quotes"){ renderQuotes(); }
  else if(S.screen==="quotedetail"){ renderQuoteDetail(); }
  else if(S.screen==="calendar"){ renderCalendar(); }
  else if(S.screen==="overview"){ renderOverview(); }
  else if(S.screen==="settings"){ renderSettings(); reapplySettingsEdits(); }
  else if(S.screen==="help"){ renderHelp(); }
  else { renderMenu(); }
  if(S._modal){
    App.insertAdjacentHTML('beforeend', modalHtml());
    const inp = document.getElementById('modalPromptInput');
    if(inp){ inp.focus(); inp.addEventListener('keydown', e=>{ if(e.key==="Enter"){ e.preventDefault(); const btn=document.getElementById('modalConfirmBtn'); if(btn) btn.click(); } }); }
  }
}

/* ---- in-app confirm/alert/prompt dialog ----
   Published artifacts run in a sandboxed iframe without "allow-modals", so
   window.confirm()/alert()/prompt() are silently ignored by the browser
   (confirm() just returns false) — every button that relied on them looked
   broken. These render our own dialog inside the page instead. */
/* ---- Running cost calculator ----
   Tenant-saved cost lines (name, amount, frequency) → a daily figure each, summed into a £/day
   total the user can drop into the "Business running costs (£/day)" field. Lines and the two
   working-day counts save to settings as they're edited; the rate field itself is only filled
   (the user still presses Save changes, and can adjust it first). */
const RC_FREQS = [["daily","Daily"],["weekly","Weekly"],["monthly","Monthly"],["annually","Annually"]];
function rcDaysPerMonth(s){ const n = Number((s||S.settings).rcDaysPerMonth); return n>0 ? n : 20; }
function rcDaysPerYear(s){ const n = Number((s||S.settings).rcDaysPerYear); return n>0 ? n : 250; }
function rcDaysValid(s){ s = s||S.settings; return Number(s.rcDaysPerMonth)>0 && Number(s.rcDaysPerYear)>0; }
let _rcVcFrozen = null; // see renderKeepingInputs
// VAT context, read live from whichever screen is behind the calculator (Settings → Pricing or
// setup step 3) so an unsaved change to the VAT-registered / VAT rate / "already includes VAT"
// boxes is respected; falls back to the saved settings.
function rcVatCtx(){
  if(_rcVcFrozen) return _rcVcFrozen;
  const el = id => document.getElementById(id);
  const regEl = el('st_vatregistered') || el('f_vatregistered');
  const reg = regEl ? regEl.checked : S.settings.vatRegistered!==false;
  const rateEl = el('st_vatrate') || el('f_vatrate');
  const typed = rateEl ? parseFloat(rateEl.value) : NaN;
  const rate = !isNaN(typed) && typed>=0 ? (typed>=1 ? typed/100 : typed) : (Number(S.settings.vatRate)||0);
  const incEl = el('st_expensesvat') || el('f_expensesvat');
  const fieldIncVat = incEl ? incEl.checked : S.settings.expensesIncludeVat!==false;
  return {reg, rate, fieldIncVat};
}
// A line's daily cost ex VAT (VAT-registered: lines ticked "includes VAT" have it stripped; not
// registered: VAT is a real cost, so the amount is used as typed).
function rcDailyNet(i, vc){ vc = vc||rcVatCtx(); return vc.reg && i.incVat!==false ? rcDaily(i)/(1+vc.rate) : rcDaily(i); }
function rcDailyText(i, vc){ vc = vc||rcVatCtx(); return Number(i.amount)<0 ? 'Enter an amount of £0 or more — not counted' : gbp(rcDailyNet(i, vc))+'/day'+(vc.reg?' ex VAT':''); }
// net: total ex VAT; gross: inc VAT; fill: the figure to put in the rate field — on the same basis
// as that field's "This already includes VAT" tick (VAT-registered), or as typed (not registered).
function rcTotals(vc){
  vc = vc||rcVatCtx();
  const net = r6(sum((S.settings.runningCostItems||[]).map(i=>rcDailyNet(i, vc))));
  const gross = vc.reg ? net*(1+vc.rate) : net;
  const r2 = n => Math.round(r6(n)*100)/100;
  return {net:r2(net), gross:r2(gross), fill:r2(vc.reg && vc.fieldIncVat ? gross : net), vc};
}
function rcTotalText(T){ return T.vc.reg ? `${gbp(T.net)}/day ex VAT · ${gbp(T.gross)} inc VAT` : `${gbp(T.net)}/day`; }
function rcFillText(T){ return `Use ${gbp(T.fill)}/day${T.vc.reg?(T.vc.fieldIncVat?' (inc VAT)':' (ex VAT)'):''} as my running costs`; }
function rcDaily(item, s){
  const a = Math.max(0, Number(item.amount)||0);
  const f = item.freq;
  return f==="weekly" ? a/5 : f==="monthly" ? a/rcDaysPerMonth(s) : f==="annually" ? a/rcDaysPerYear(s) : a;
}
let _rcSaveTimer = null;
function rcSaveSoon(){ clearTimeout(_rcSaveTimer); _rcSaveTimer = setTimeout(rcSaveNow, 400); }
async function rcSaveNow(){
  clearTimeout(_rcSaveTimer); _rcSaveTimer = null;
  // During first-time setup the lines stay in memory and are saved with the rest of the settings
  // when setup finishes.
  if(S.screen==="setup") return;
  await saveSettings({runningCostItems: S.settings.runningCostItems||[], rcDaysPerMonth: S.settings.rcDaysPerMonth, rcDaysPerYear: S.settings.rcDaysPerYear});
}
// Re-render without losing anything typed (but not yet saved) on the settings page behind the
// calculator — renderSettings rebuilds every field from S.settings.
// Fields are matched by id, or (for the many without one, e.g. data-prod / data-digdepth) by their
// data-* attributes plus their position among fields sharing them.
function fieldKeyOf(el){ return el.id ? '#'+el.id : el.tagName + [...el.attributes].filter(a=>a.name.startsWith('data-')).map(a=>`[${a.name}=${a.value}]`).join(''); }
function pageFieldEntries(){ const seen = {}; return [...App.querySelectorAll('input,select,textarea')].filter(el=>!el.closest('.modal-overlay')).map(el=>{ const k = fieldKeyOf(el); seen[k] = (seen[k]||0)+1; return [k+'@'+seen[k], el, k]; }); }
/* Unsaved settings edits. Every settings tab is rebuilt from S.settings whenever the screen
   re-renders (opening an "+ Add…" dialog, ticking a toggle…), which used to throw away anything
   typed but not yet saved. Edits are remembered per field until that tab is saved, re-applied
   after every re-render, and leaving the tab with unsaved edits asks first. */
function settingsTabNow(){ return S._settingsTab || "services"; }
function trackSettingsEdit(t){
  if(S.screen!=="settings" || !t || !t.matches || !t.matches('input,select,textarea')) return;
  // Team name/staff fields already sync into S.settings as they're typed (see the input listener).
  // The service/fence-type builder keeps its own state and has its own Save.
  if(t.closest('.modal-overlay') || t.closest('#svcBuilderCard') || t.hasAttribute('data-action') || t.id==='matFilter' || t.hasAttribute('data-team-name') || t.hasAttribute('data-team-staff')) return;
  const e = pageFieldEntries().find(x=>x[1]===t);
  if(!e || !(t.id || /\[data-/.test(e[2]))) return;
  if(!S._stDirty || S._stDirtyTab!==settingsTabNow()){ S._stDirty = {}; S._stDirtyTab = settingsTabNow(); }
  S._stDirty[e[0]] = [t.value, t.checked];
}
function reapplySettingsEdits(){
  if(S.screen!=="settings" || !S._stDirty || S._stDirtyTab!==settingsTabNow()) return;
  pageFieldEntries().forEach(([k,el])=>{ const v = S._stDirty[k]; if(!v) return; if(el.type==='checkbox'||el.type==='radio') el.checked = v[1]; else el.value = v[0]; });
}
function hasUnsavedSettings(){ return S.screen==="settings" && S._stDirty && Object.keys(S._stDirty).length>0; }
// Runs `go` straight away, or after confirming that unsaved settings edits will be dropped.
function leaveSettingsThen(go){
  if(!hasUnsavedSettings()){ go(); return; }
  showConfirm("You've changed settings on this tab without saving. Leave without saving them?", async ()=>{ S._stDirty = null; go(); }, {confirmLabel:"Discard changes", cancelLabel:"Keep editing", danger:true});
}
function renderKeepingInputs(){
  const pageFields = () => pageFieldEntries();
  const keep = new Map(pageFields().map(([k,el])=>[k, [el.value, el.checked]]));
  const box = App.querySelector('.modal-overlay .modal-box'); const boxScroll = box ? box.scrollTop : 0;
  // The calculator is drawn mid-render, while the page behind it still shows saved values — so
  // read the (possibly unsaved) VAT boxes now, before they're rebuilt.
  _rcVcFrozen = rcVatCtx();
  try{ render(); } finally { _rcVcFrozen = null; }
  pageFields().forEach(([k,el])=>{ const v = keep.get(k); if(!v || el.matches('[data-brand-colour],[data-logo-upload]')) return; if(el.type==='checkbox'||el.type==='radio') el.checked = v[1]; else el.value = v[0]; });
  const box2 = App.querySelector('.modal-overlay .modal-box'); if(box2) box2.scrollTop = boxScroll;
}
// Reads a typed money amount: "£1,200.50" → 1200.5; blank/invalid → null.
function rcParseAmount(v){ const c = String(v||'').replace(/[£,\s]/g,''); if(c==='') return null; const n = Number(c); return isNaN(n) ? null : n; }
// Updates the per-line and total figures in place while typing (no re-render, so focus stays).
function rcRefreshFigures(){
  const vc = rcVatCtx();
  (S.settings.runningCostItems||[]).forEach(i=>{ const el = document.getElementById('rc_daily_'+i.id); if(el) el.textContent = rcDailyText(i, vc); });
  const w = document.getElementById('rc_days_warn'); if(w) w.style.display = rcDaysValid() ? 'none' : '';
  const T = rcTotals(vc);
  const tot = document.getElementById('rc_total'); if(tot) tot.textContent = rcTotalText(T);
  const btn = document.getElementById('rc_fill'); if(btn){ btn.textContent = rcFillText(T); btn.disabled = !(T.fill>0); }
}

function showAlert(message){ S._modal = {type:"alert", message}; render(); }
function showConfirm(message, onYes, opts){ S._modal = Object.assign({type:"confirm", message, _onYes:onYes}, opts||{}); render(); }
function showPrompt(message, onYes, opts){ S._modal = Object.assign({type:"prompt", message, value:(opts&&opts.value)||"", _onYes:onYes}, opts||{}); render(); }
/* Section a newly-added "+ Add other…" material is filed under, keyed by the select's
   `customizable` group — see optionFieldHtml and CUSTOM_STYLE_SECTIONS' one use below. */
const CUSTOM_STYLE_SECTIONS = {paving:"Paving - Slabs", gravel:"Gravel", block:"Block Paving - Blocks", wallskin:"Brick & Block", pergola:"Pergola"};
/* Unit a newly-added "+ Add other…" material is priced by, keyed by the same `customizable`
   group as CUSTOM_STYLE_SECTIONS above — almost everything using this mechanism is priced per
   m² (slabs/gravel/block paving/wall skin), but Pergola's post type is priced "each" like its
   built-in post options, so it needs its own entry rather than the 'm²' fallback. */
const CUSTOM_STYLE_UNITS = {pergola:"each", gravel:"tonne"};
function showAddMaterialOption(groupKey, onSave){ S._modal = {type:"addMaterialOption", groupKey, name:"", price:"", supplier:"", _onSave:onSave}; render(); }
/* Opens the same "+ Add a <thing>" modal the Settings → Pricing → Paving card's "+ Add…" buttons
   use (see pavingProductLibraryHtml/the addPavingProduct action), but reusable from anywhere —
   in particular the quote wizard's jointing-compound/edging-style dropdowns' own inline "+ Add
   new…" sentinel (see optionFieldHtml's `source` branch and the data-opt input listener), so a
   tenant can add one of these without leaving the quote they're building. onSaved (optional)
   receives the newly-saved {id, name, ...} entry once it's persisted. */
function openPavingProductModal(libKey, singular, fieldKeys, onSaved, fieldDefaults, existing, errorMsg){
  // `existing` (a library entry) opens the same dialog pre-filled to EDIT that product in place —
  // its id is kept, and a rename is carried onto the quote being built (renameLibraryRefs).
  const fields = [{key:"name", label:"Name", type:"text", required:true, value: existing ? existing.name : undefined}]
    .concat(fieldKeys.map(fk=>{ const meta = PAVING_LIB_FIELD_META[fk];
      return {key:fk, label:meta.label, type:meta.type||"number", options:meta.options, required:meta.required!==false,
        value: existing ? existing[fk] : (fieldDefaults && fieldDefaults[fk]!=null ? fieldDefaults[fk] : (meta.options ? meta.options[0].value : undefined))}; }))
    .concat((fieldKeys.includes("price") || fieldKeys.includes("priceM")) ? [{key:"vatIncluded", label:"Price already includes VAT", type:"checkbox", value: existing ? existing.vatIncluded!==false : true}] : []);
  if(existing){
    showForm(`Edit ${singular}`, "Changes are saved to your settings and used on this and every future quote. Quotes already sent keep the price they were sent at.", fields, async (values)=>{
      const list = S.settings[libKey] || [];
      const entry = list.find(x=>x.id===existing.id) || list.find(x=>x.name===existing.name);
      if(!entry) return;
      if(values.name!==entry.name && list.some(x=>x!==entry && x.name===values.name)){
        const again = Object.assign({}, entry, values);
        openPavingProductModal(libKey, singular, fieldKeys, onSaved, fieldDefaults, Object.assign(again, {id:entry.id, name:values.name}), `There's already a ${singular} called "${values.name}" — pick a different name.`);
        S._modal.existingId = entry.id; return;
      }
      const oldName = entry.name;
      entry.name = values.name; entry.vatIncluded = values.vatIncluded!==false;
      fieldKeys.forEach(fk=>{ entry[fk] = values[fk]; });
      await saveSettings({[libKey]: S.settings[libKey]});
      if(oldName!==entry.name) renameLibraryRefs(oldName, entry.name);
      S._savedMsg = "";
      if(onSaved) onSaved(entry);
    }, errorMsg ? {error: errorMsg} : undefined);
    return;
  }
  showForm(`Add a ${singular}`, "Saved to your settings and selectable on every future quote.", fields, async (values)=>{
    if(!S.settings[libKey]) S.settings[libKey] = [];
    const entry = {id:uid(), name:values.name, vatIncluded: values.vatIncluded!==false};
    fieldKeys.forEach(fk=>{ entry[fk] = values[fk]; });
    S.settings[libKey].push(entry);
    await saveSettings({[libKey]: S.settings[libKey]});
    S._savedMsg = "";
    if(onSaved) onSaved(entry);
  });
}
/* Edit one Materials-list entry's price, supplier and VAT setting from a quote's dropdown. */
function editMaterialPrice(name, onSaved){
  const m = S.settings.materials[name]; if(!m) return;
  const vatOn = S.settings.vatRegistered!==false;
  const fields = [{key:"price", label:`Price (£ per ${m.unit||'unit'})`, type:"number", required:true, value:m.price},
    {key:"supplier", label:"Supplier (optional)", type:"text", required:false, value:m.supplier||""}]
    .concat(vatOn ? [{key:"vatIncluded", label:"Price already includes VAT", type:"checkbox", value:m.vatIncluded!==false}] : []);
  showForm(`Edit ${name}`, "Saved to your Materials list and used on this and every future quote. Quotes already sent keep the price they were sent at.", fields, async (values)=>{
    m.price = values.price; m.supplier = values.supplier||"";
    if(vatOn) m.vatIncluded = values.vatIncluded!==false;
    await saveSettings({materials: S.settings.materials});
    S._savedMsg = "";
    if(onSaved) onSaved();
  });
}
/* A product renamed through "Edit" is picked by name on the quote being built (and the one
   parked behind it), so carry the new name onto any row or option that held the old one. */
function renameLibraryRefs(oldName, newName){
  [S.draft, S._savedDraft].forEach(d=>{
    if(!d || !d.sectionsRaw) return;
    Object.values(d.sectionsRaw).forEach(sec=>{
      if(!sec) return;
      if(sec.options) Object.keys(sec.options).forEach(k=>{ if(sec.options[k]===oldName) sec.options[k] = newName; });
      (sec.rows||[]).forEach(r=>Object.keys(r).forEach(k=>{ if(k!=='desc' && r[k]===oldName) r[k] = newName; }));
    });
  });
}
/* Generic small-data-entry modal, used by the finance tracker/labor log/activity log etc. so each
   new interaction (checking off a material, logging labour, adding a payment...) doesn't need its
   own bespoke modal type. `fields` is an array of {key, label, type:"text"|"number"|"date"|
   "checkbox"|"select"|"textarea", value, placeholder, required, options, rows}. onSave receives a
   plain object keyed by field.key once every required field validates. */
function showForm(title, hint, fields, onSave, opts){
  S._modal = Object.assign({type:"form", title, hint, fields, _onSave:onSave, error:""}, opts||{});
  render();
}
function formFieldHtml(f){
  const id = `mf_${f.key}`;
  if(f.type==="checkbox"){
    return `<label class="checkline" style="margin:10px 0;"><input id="${id}" type="checkbox" ${f.value?'checked':''}> ${esc(f.label)}</label>`;
  }
  if(f.type==="select"){
    // Options are normally plain strings (used as both value and label); a field can instead
    // pass {value,label} objects when the two need to differ, e.g. a team id vs its display name.
    const opts = (f.options||[]).map(o => (o && typeof o==='object') ? o : {value:o, label:o});
    return `<div class="field"><label>${esc(f.label)}</label><select id="${id}">${opts.map(o=>`<option value="${esc(o.value)}" ${o.value===f.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;
  }
  if(f.type==="textarea"){
    return `<div class="field"><label>${esc(f.label)}</label><textarea id="${id}" rows="${f.rows||3}" placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea></div>`;
  }
  return `<div class="field"><label>${esc(f.label)}</label><input id="${id}" type="${f.type||'text'}" ${f.type==='number'?'inputmode="decimal"':''} placeholder="${esc(f.placeholder||'')}" value="${esc(f.value!=null?f.value:'')}"></div>`;
}

/* Clipboard access from a sandboxed view isn't guaranteed either — try the
   modern API, fall back to the old execCommand trick, and if both fail the
   field is still a selectable, read-only input/textarea the viewer can copy
   from by hand. */
async function copyText(text, btnEl){
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }
  catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      ok = document.execCommand('copy');
      ta.remove();
    }catch(e2){ ok = false; }
  }
  if(btnEl){
    const original = btnEl.textContent;
    btnEl.textContent = ok ? "Copied!" : "Tap field & copy";
    setTimeout(()=>{ if(document.body.contains(btnEl)) btnEl.textContent = original; }, 1600);
  }
}

/* Re-render while preserving focus + caret in the field the user is typing in (measurement grids, extras, search) */
function reflow(){
  const active = document.activeElement;
  let sel = null;
  if(active && App.contains(active)){
    const rowEl = active.closest ? active.closest('[data-row]') : null;
    sel = {
      row: rowEl ? rowEl.getAttribute('data-row') : null, mf: active.getAttribute('data-mf'),
      opt: active.getAttribute('data-opt'), ef: active.getAttribute('data-ef'),
      extraIdx: active.closest ? (active.closest('[data-extra]')?active.closest('[data-extra]').getAttribute('data-extra'):null) : null,
      id: active.id, selStart: active.selectionStart, selEnd: active.selectionEnd,
    };
  }
  render();
  if(sel){
    let el = null;
    if(sel.mf!=null && sel.row!=null) el = App.querySelector(`[data-row="${sel.row}"] [data-mf="${sel.mf}"]`);
    else if(sel.opt!=null) el = App.querySelector(`[data-opt="${sel.opt}"]`);
    else if(sel.ef!=null && sel.extraIdx!=null) el = App.querySelector(`[data-extra="${sel.extraIdx}"] [data-ef="${sel.ef}"]`);
    else if(sel.id) el = document.getElementById(sel.id);
    if(el){ el.focus(); if(sel.selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(sel.selStart, sel.selEnd); }catch(e){} } }
  }
}

function wizNext(){
  const d = S.draft;
  if(d.step==="who"){
    d.createdBy = val('q_creator'); d.customer.name = val('q_cname'); d.customer.knownAs = val('q_cknown');
    d.customer.email = val('q_cemail'); d.customer.phone = val('q_cphone'); d.customer.address = val('q_caddress');
    if(!d.createdBy){ S.err = "Enter your name — it signs off the quote."; render(); return; }
    if(!d.customer.name){ S.err = "Enter the customer's name to continue."; render(); return; }
    S.err = ""; d.step = "services"; d.serviceIdx = 0;
  } else if(d.step==="services"){
    if(d.serviceKeys.length===0){ d.step="people"; } else { d.step="measure"; d.serviceIdx=0; }
  } else if(d.step==="measure"){
    if(d.serviceIdx < d.serviceKeys.length-1){ d.serviceIdx++; }
    else if(d.serviceIdx===d.serviceKeys.length-1 && draftWastePreview(d)){ d.serviceIdx++; } // advance into the waste page
    else { d.step = "people"; }
  } else if(d.step==="people"){
    d.people = Math.max(1, numval('q_people')||3);
    d.step = "extras";
  } else if(d.step==="extras"){
    d.step = "preview";
  } else if(d.step==="preview"){
    return;
  }
  render();
  window.scrollTo(0,0);
}
function wizBack(){
  const d = S.draft;
  if(d.step==="services"){ d.step="who"; }
  else if(d.step==="measure"){
    if(d.serviceIdx>0){ d.serviceIdx--; } else { d.step="services"; }
  } else if(d.step==="people"){
    d.step = d.serviceKeys.length? "measure":"services";
    if(d.step==="measure") d.serviceIdx = draftWastePreview(d) ? d.serviceKeys.length : d.serviceKeys.length-1;
  }
  else if(d.step==="extras"){ d.step="people"; }
  else if(d.step==="preview"){ d.step="extras"; }
  else { goto("menu"); return; }
  render();
  window.scrollTo(0,0);
}

// Gravel's "Steel edging" choice hands the edging run to the Steel Edging service: choosing it
// adds that service to the quote straight after Gravel (its length is entered there), and
// un-choosing it removes the service again — but only if Gravel added it and nothing has been
// measured in it yet, so a Steel Edging section the user built themselves is never thrown away.
// Picking a fence type starts the job's productivity and the type's own options at that type's
// defaults (the user can still override them for this job).
function applyFenceTypeDefaults(st){
  const ft = fenceTypeById(st.options.fenceType);
  if(!ft) return;
  if(ft.productivity) st.options.productivity = ft.productivity;
  (ft.options||[]).forEach(o=>{ if(o && o.key) st.options["t_"+o.key] = o.type==="number" ? o.default : !!o.default; });
}
function syncGravelSteelEdging(d){
  // Gravel and Flower Beds can both hand their edging to the Steel Edging service.
  if(!d || !d.sectionsRaw) return;
  const wantsFrom = ["gravel","flowerbeds","artificialturf"].filter(k=>{
    const st = d.sectionsRaw[k];
    if(!st || !d.serviceKeys.includes(k)) return false;
    return (k==="gravel" ? !!st.options.edging : true) && st.options.edgingStyle===GRAVEL_STEEL_EDGING;
  });
  const wants = wantsFrom.length>0;
  const has = d.serviceKeys.includes("steeledging");
  if(wants && !has){
    d.serviceKeys.splice(d.serviceKeys.indexOf(wantsFrom[0])+1, 0, "steeledging");
    ensureSectionState("steeledging");
    d._steelFromGravel = true;
  } else if(!wants && has && d._steelFromGravel){
    const sst = d.sectionsRaw.steeledging;
    const empty = !sst || (sst.rows||[]).every(r=>!(Number(r.length)>0));
    if(empty){ d.serviceKeys.splice(d.serviceKeys.indexOf("steeledging"), 1); delete d.sectionsRaw.steeledging; }
    d._steelFromGravel = false;
  }
}
// Anything a service's calc() flagged as stopping the quote being finalised (a £0 price on a
// tenant-defined product, a deck height the stock post can't reach, a missing product…) — see
// SERVICES[key].calc's `blockers` and priceSection. Returns plain "Service: message" strings.
function quoteBlockers(q){
  const out = [];
  (q.sections||[]).forEach(sec=>{ (sec.blockers||[]).forEach(m=>out.push(`${sec.label}: ${m}`)); });
  return out;
}
async function finalizeQuote(status){
  const isNew = !S.editingQuoteId;
  const counterBefore = S.settings.quoteCounter;
  const q = buildQuoteFromDraft(S.draft, status, {assignNumber:true});
  if(quoteBlockers(q).length){ S.settings.quoteCounter = counterBefore; S.err = "This quote can't be saved yet — fix the items listed on the review page first."; render(); return; }
  if(!isNew) refreshJobAfterEdit(q); else delete q._baseTotals;
  if(q.status==="sent" && !q.sentAt) q.sentAt = new Date().toISOString();
  const ok = await saveQuote(q);
  if(!ok){
    // Keep the draft so nothing is lost; the warning dialog says what happened.
    if(isNew){ S.quotes = S.quotes.filter(x=>x.id!==q.id); S.settings.quoteCounter = counterBefore; }
    render(); return;
  }
  if(isNew) await saveSettings({quoteCounter: S.settings.quoteCounter});
  S.draft = null; S.editingQuoteId = null;
  await clearSavedDraft();
  goto("quotedetail", {openQuoteId:q.id});
}
