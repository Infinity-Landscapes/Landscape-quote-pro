const SERVICE_COPY = {
  paving: (o)=>{ const d = Number(o.digOutDepth)||150; const mot = Math.max(0, d-50); return [`Patio area excavated to a minimum depth of ${d}mm.`,`Geotextile membrane installed across the sub-grade for stabilisation.`,`A minimum 50mm sand/bedding layer${mot>0?` over a ${mot}mm compacted Type 1 MOT sub-base`:''} installed.`,`Underside of the slabs primed with a paving primer.`,`${esc(o.style)} laid on a full contact bed of sharp sand and cement mortar.`,`Joints finished with a suitable jointing compound.`]; },
  // Depths come from the quote itself: per-row dig-out (a range if rows differ), MOT = dig-out −
  // gravel depth, and the gravel depth/type chosen. The edge-restraint line only shows with edging.
  gravel: (o, s)=>{
    s = s || {};
    const gd = (o.gravelDepth===undefined || o.gravelDepth==='') ? 50 : (Number(o.gravelDepth)||0);
    const legacy = Number(o.digOutDepth)>0 ? Number(o.digOutDepth) : 150;
    const ds = (s.rows||[]).filter(r=>(Number(r.width)||0)*(Number(r.length)||0)>0).map(r=>r.digOutDepth===undefined ? legacy : Math.round(Number(r.digOutDepth)||0));
    const mn = ds.length ? Math.min(...ds) : legacy, mx = ds.length ? Math.max(...ds) : legacy;
    const dig = mn===mx ? `to a depth of ${mn}mm` : `to depths of ${mn}–${mx}mm`;
    const m1 = Math.max(0, mn-gd), m2 = Math.max(0, mx-gd);
    const mot = m1===m2 ? `${m1}mm` : `${m1}–${m2}mm`;
    return [`Area excavated ${dig} and the subsoil compacted.`, o.edging ? `Edge restraints installed around the perimeter.` : ``, `Geotextile membrane laid to the excavation.`, `A ${mot} compacted Type 1 MOT sub-base installed.`, `A second geotextile membrane laid over the sub-base to prevent migration.`, `Finished with ${gd}mm of ${esc(o.style)}.`].filter(Boolean);
  },
  // Dig-out and Type 1 MOT depths come from the priced section itself (s.digOutDepth is the
  // area-weighted average of the per-row depths, s.motDepth is that minus the surface build-up —
  // see SERVICES.blockpaving.calc), so the wording always matches what was actually priced. If the
  // rows differ in depth the letter says so rather than quoting a single misleading figure.
  blockpaving: (o, s)=>{
    s = s || {};
    const avg = Math.round(Number(s.digOutDepth)||0);
    const rowDepths = (s.rows||[]).filter(r=>(Number(r.width)||0)*(Number(r.length)||0)>0).map(r=>r.digOutDepth===undefined ? avg : Math.round(Number(r.digOutDepth)||0));
    const varied = rowDepths.length>1 && Math.min(...rowDepths)!==Math.max(...rowDepths);
    const mot = Math.round(Number(s.motDepth)||0);
    const lines = [varied ? `Area excavated to depths of ${Math.min(...rowDepths)}–${Math.max(...rowDepths)}mm (${avg}mm on average) depending on the area.` : `Area excavated to a depth of ${avg}mm.`];
    if(Number(o.edgingLength)>0) lines.push(`Edge restraints installed along ${Number(o.edgingLength)}m of the paved area.`);
    if(mot>0) lines.push(`A ${mot}${varied?'mm average':'mm'} compacted Type 1 MOT sub-base laid.`);
    lines.push(`A 50mm sharp sand laying course screeded level.`,`${esc(o.style)} laid in the agreed bond pattern with 2–5mm joints.`,`Compacted with a plate compactor.`,`Joints filled with ${o.jointingCompound?esc(o.jointingCompound):'a suitable jointing compound'} and compacted again.`);
    return lines;
  },
  resinbound: (o)=> o.system==="Resin path on concrete" ? [`Area excavated to a depth of 115mm.`,`Geotextile membrane laid for ground stability.`,`100mm of solid concrete laid.`,`15mm of resin bound gravel installed.`] : [`Sub-base excavated and compacted, typically Type 3 MOT.`,`Addagrip grid system laid over the compacted sub-base.`,`Grid filled and screeded with 2–6mm crushed limestone, level with the top of the grid cells.`,`Resin and aggregate mixed on site for the wearing course.`,`Resin bound mix trowelled over the surface to a smooth, compacted, level finish.`],
  concretebase: (o, s)=>{
    const rows = ((s && s.rows)||[]).filter(r=>(Number(r.width)||0)*(Number(r.length)||0)>0);
    if(o.depth!==undefined && !rows.some(r=>r.digOutDepth!==undefined))
      return [`Area excavated, removing plant matter, debris and topsoil, and the subgrade compacted.`,`Compacted hardcore sub-base installed, typically Type 1 MOT.`,`Formwork installed around the edges to the required height.`,`Reinforcement mesh laid, supported clear of the ground so it sits within the slab.`,`Concrete poured, levelled and tamped.`,`Concrete left to cure fully before use.`];
    // MOT depth as priced (saved on the section) so a later settings change can't alter a sent quote.
    const mot = s && s.motDepth!=null ? Number(s.motDepth) : (S.settings.cbMotDepth!=null ? Number(S.settings.cbMotDepth) : 100);
    const all = (s && s.rows) || [];
    const name = r => esc((r.desc||'').trim() || ('base '+(all.indexOf(r)+1)));
    const cds = rows.map(r=>Math.max(0, cbRowDig(r, o, mot) - mot));
    const same = cds.length && cds.every(d=>d===cds[0]);
    const pour = !cds.length ? `Concrete poured, levelled and tamped.` : same ? `Concrete poured to a depth of ${cds[0]}mm, levelled and tamped.`
      : `Concrete poured to depths of ${rows.map((r,i)=>`${name(r)} ${cds[i]}mm`).join(', ')}, levelled and tamped.`;
    const meshRows = rows.filter(r=>r.rebar!==false);
    const meshLine = !meshRows.length ? `` : meshRows.length===rows.length ? `Reinforcement mesh laid, supported clear of the ground so it sits within the slab.`
      : `Reinforcement mesh laid in ${meshRows.map(name).join(', ')}, supported clear of the ground so it sits within the slab.`;
    return [`Area excavated, removing plant matter, debris and topsoil, and the subgrade compacted.`, mot>0 ? `Compacted hardcore sub-base installed, typically Type 1 MOT, to a depth of ${mot}mm.` : `Compacted hardcore sub-base installed, typically Type 1 MOT.`,
      Number(o.shutteringLength)>0 ? `Formwork installed around the edges to the required height.` : ``, meshLine, pour, `Concrete left to cure fully before use.`].filter(Boolean);
  },
  // Legacy — kept unchanged so previously-saved quotes still render correctly; superseded
  // by compositedecking / timberdecking below for new quotes.
  decking: (o)=>[`Sub-frame of ${o.type==='Timber'?'treated timber':'composite-compatible'} posts and joists installed to falls, set in postcrete.`,`${esc(o.type==='Timber'?'Timber deck boards':o.type+' composite deck boards')} fixed to the sub-frame.`, o.digOut ? `Ground dug out beneath the deck and membrane laid to suppress weed growth.` : `Membrane laid beneath the deck to suppress weed growth.`],
  fencing: (o)=>[`Existing fence line cleared${o.removeOld?' and old fencing removed and disposed of':''}.`,`${esc(o.style)} fencing installed with posts set in concrete.`, o.gate ? `${o.gateCount} matching gate${o.gateCount>1?'s':''} installed.`:``].filter(Boolean),
  // Footing size comes from the rows (a range if rows differ); face skin, coping and compost lines
  // only appear when ticked.
  brickwall: (o, s)=>{
    s = s || {};
    const rows = (s.rows||[]).filter(r=>(Number(r.length)||0)>0);
    const ws = rows.map(r=>r.footingWidth===undefined?450:Math.round(Number(r.footingWidth)||0)).filter(x=>x>0);
    const ds = rows.map(r=>r.footingDepth===undefined?300:Math.round(Number(r.footingDepth)||0)).filter(x=>x>0);
    const rng = (a,d)=>{ if(!a.length) return d+'mm'; const mn=Math.min(...a), mx=Math.max(...a); return mn===mx ? mn+'mm' : mn+'–'+mx+'mm'; };
    const faceName = o.faceProduct || o.skin1 || '';
    return [`Foundations excavated and a concrete footing poured ${rng(ws,450)} wide by ${rng(ds,300)} deep${o.rebar?', reinforced with rebar':''}.`,
      `Wall built up in concrete blocks in a staggered running bond.`,
      `Damp-proof membrane applied to the back face of the blockwork.`,
      `Wall backfilled with pea shingle to roughly a third of its height, separated from the retained soil with a geotextile membrane.`,
      o.faceSkin && faceName ? `Wall faced in ${esc(faceName)}.` : ``,
      o.coping ? `Finished with coping along the top.` : ``,
      o.compost ? `Bed backfilled with fresh compost on completion.` : ``].filter(Boolean);
  },
  sleeperwall: ()=>[`Post holes dug individually and posts set using postcrete.`,`Back and bottom of each sleeper treated with Blackjack DPM.`,`Sleepers fixed horizontally against the posts, stacked course by course and secured with long screws.`],
  // Legacy — kept unchanged; superseded by flowerbeds below for new quotes.
  metalbeds: ()=>[`Bed areas marked out and excavated to the required profile.`,`Galvanised metal edging installed and pinned with rebar for a crisp, durable line.`,`Beds top-dressed with peat-free compost ready for planting.`],
  sleeperbeds: ()=>[`Bed areas marked out and excavated to the required profile.`,`Timber sleepers built up course by course on a timber post frame with a damp-proof membrane.`,`Beds filled with a blend of topsoil and peat-free compost ready for planting.`],
  turf: (o)=>{ const d = Number(o.digOutDepth)||50; return [`Area excavated to a minimum depth of ${d}mm to receive new topsoil.`,`High-quality topsoil added to a depth of ${d}mm and lightly compacted.`,`Turf laid in a staggered brick-bond pattern, with adjoining rolls laid in alternating directions to maximise knitting.`,`Turf tamped to ensure the best possible contact between soil and root.`]; },
  // Dig-out and MOT depths come from the rows (each row listed when they differ); the concrete
  // edge-restraint and glued-edges wording only with a non-steel edging length.
  artificialturf: (o, s)=>{
    const rows = ((s && s.rows)||[]).filter(r=>(Number(r.width)||0)*(Number(r.length)||0)>0);
    if(o.turfProduct===undefined && !rows.some(r=>r.digOutDepth!==undefined))
      return [`Existing turf and soil excavated to approximately 75mm.`,`Edge restraint installed around the perimeter, set in concrete.`,`Geotextile membrane laid to suppress weed growth.`,`Compacted Type 1 MOT sub-base installed, 50–60mm deep.`,`Grano dust laying course installed to approximately 25mm and screeded flat.`,`Artificial turf rolled out, trimmed to fit, with seams joined using adhesive tape.`,`Edges glued to the concrete edge restraint, pile brushed and infill sand added.`];
    const bu = S.settings.atSurfaceBuildUp!=null ? Number(S.settings.atSurfaceBuildUp) : 25;
    const depths = rows.map(r=>Math.round(Number(r.digOutDepth)||0));
    const same = depths.length && depths.every(d=>d===depths[0]);
    const name = (r,i) => esc((r.desc||'').trim()||('area '+(i+1)));
    const dig = !depths.length ? `Existing turf and soil excavated.` : same ? `Existing turf and soil excavated to approximately ${depths[0]}mm.`
      : `Existing turf and soil excavated to approximately: ${rows.map((r,i)=>`${name(r,i)} ${depths[i]}mm`).join(', ')}.`;
    const mot = !depths.length ? `Compacted Type 1 MOT sub-base installed.` : same ? `Compacted Type 1 MOT sub-base installed, ${Math.max(0,depths[0]-bu)}mm deep.`
      : `Compacted Type 1 MOT sub-base installed: ${rows.map((r,i)=>`${name(r,i)} ${Math.max(0,depths[i]-bu)}mm`).join(', ')} deep.`;
    const concrete = !!o.edgingStyle && o.edgingStyle!==GRAVEL_STEEL_EDGING && Number(o.edgingLength)>0;
    return [dig, concrete ? `Edge restraint installed around the perimeter, set in concrete.` : ``, `Geotextile membrane laid to suppress weed growth.`, mot,
      `Grano dust laying course installed to approximately 25mm and screeded flat.`, `Artificial turf rolled out, trimmed to fit, with seams joined using adhesive tape.`,
      concrete ? `Edges glued to the concrete edge restraint, pile brushed and infill sand added.` : `Edges trimmed to fit, pile brushed and infill sand added.`].filter(Boolean);
  },
  pond: (o, s)=>[`Pond excavated in stages — a shallow marginal shelf around 20–30cm deep, then a deeper central zone to at least 60cm, with sloping sides.`,`Base and sides cleared of sharp stones and roots.`,`Geotextile underlay laid over the full excavation, overlapping joints and pressed into the shelves.`,`Liner draped over the pond and eased into the contours without stretching, with a generous overlap at the edges.`,`Filled with water gradually while the liner is settled into place.`,`Edges trimmed and secured once full.`,`Pump and filter installed and commissioned.`, (((s&&s.rows)||[]).some(r=>r.electrics && (Number(r.length)||0)*(Number(r.width)||0)>0)) ? `The pond requires a power connection — a price for this will be provided separately by an independent electrician.` : '', o.bridge?`Bridge installed across the pond.`:''].filter(Boolean),
  pergola: (o)=>{
    const legacy = o.postProduct===undefined && o.post!==undefined;
    const postName = legacy ? o.post : o.postProduct;
    const lines = [`Post positions marked out and footing holes dug for each post.`,`Posts treated with Blackjack DPM before installation.`,`${esc(postName||'')} posts set in postcrete footings, checked for level and plumb.`,`Main beams fixed across the tops of the posts once cured.`,`Rafters added across the beams at even spacing.`];
    if(!legacy && o.roof){ lines.push(`Roof deck of OSB board fixed across the rafters.`); if(o.coveringProduct) lines.push(`Roof finished with ${esc(o.coveringProduct)}.`); }
    return lines;
  },

  compositedecking: (o)=>[`Frame built using composite posts, one per square metre, with composite joists at 400mm centres.`,`Noggins formed from composite joist material for rigidity.`,`${o.board ? esc(o.board) : (o.tier ? esc(o.tier)+' composite deck boards' : 'Composite deck boards')} laid with a slight fall away from buildings for drainage, and a consistent expansion gap between boards.`, o.fascia ? `${o.fasciaBoard ? esc(o.fasciaBoard) : 'Composite fascia board'} fitted around the deck edge${Number(o.fasciaRun)>0?` (${Number(o.fasciaRun)}m run)`:''}.` : ``, o.digOut ? `Ground dug out beneath the deck before construction.` : ``].filter(Boolean),
  timberdecking: (o)=>[`Posts treated with a post-saver sleeve before installation.`,`Posts set at one per square metre, straight into the ground with postcrete.`,`Perimeter frame built using treated 6x2 timber, with internal joists fixed at 400mm centres and noggins added for rigidity.`,`Deck laid with a slight fall away from buildings for drainage.`,`${o.board ? 'Deck boards ('+esc(o.board)+')' : 'Deck boards'} laid with a consistent gap between boards for expansion.`, o.digOut ? `Ground dug out beneath the deck before construction.` : ``].filter(Boolean),
  // Fencing: the chosen type's own builder-written lines, plus a gates line when ticked.
  fence: (o, s)=>{
    const ft = (s && s.fenceSnap) || fenceTypeById(o.fenceType);
    if(!ft) return [];
    const optView = Object.assign({}, o);
    (ft.options||[]).forEach(x=>{ if(x && x.key && optView["t_"+x.key]===undefined) optView["t_"+x.key] = x.type==="number" ? x.default : !!x.default; });
    const lines = bldLetterLines(ft.letter, optView, {inGround: S.settings.compositePostInGroundDepth!=null ? S.settings.compositePostInGroundDepth : 600, height: ft.heightMm, length: (Number(s && s.area)||0).toFixed(2)});
    const n = o.gate ? Math.max(0, Math.round(Number(o.gateCount)||0)) : 0;
    if(n>0) lines.push(`${n} matching gate${n>1?'s':''} installed.`);
    return lines;
  },
  closeboardfencing: (o)=>[`Existing fence line cleared${o.removeOld?' and old fencing removed and disposed of':''}.`,`Fence line marked out and post holes dug to 600mm.`,`Posts treated with a post-saver sleeve and set in postcrete, checked for level and plumb.`,`Arris rails fixed between the posts.`,`Gravel board fitted at the base to keep the feather-edge boards clear of the ground.`,`Feather-edge boards nailed vertically to the rails, overlapping each board by around 25mm.`,`Finished with a capping rail along the top.`, o.gate ? `${o.gateCount} matching gate${o.gateCount>1?'s':''} installed.`:``].filter(Boolean),
  timberpanelfencing: (o)=>[`Existing fence line cleared${o.removeOld?' and old fencing removed and disposed of':''}.`,`Fence line marked out and post holes dug to 600mm.`,`Posts treated with a post-saver sleeve and set in postcrete, checked for level and plumb.`, o.gravelBoard ? `Gravel board fitted at the base between posts to keep the panels clear of the ground.` : ``,`Panels lifted into place${o.gravelBoard?', resting on the gravel board,':''} and secured to the posts with screws.`, o.gate ? `${o.gateCount} matching gate${o.gateCount>1?'s':''} installed.`:``].filter(Boolean),
  compositefencing: (o)=>[`Existing fence line cleared${o.removeOld?' and old fencing removed and disposed of':''}.`,`Fence line marked out and post holes dug at least 600mm deep.`,`Composite posts set in postcrete, spaced to suit the panel widths plus a small expansion gap, checked for level and plumb.`,`Composite panels slid into the post slots, working along from one end and checking each panel is level.`,`A slight expansion gap left between panels for temperature movement.`, o.gate ? `${o.gateCount} matching gate${o.gateCount>1?'s':''} installed.`:``].filter(Boolean),
  // Names every feature picked (a list when there are several); the electrics and pebbles lines
  // only appear when ticked on a row. Quotes saved before the rework keep their old wording.
  waterfeatures: (o, s)=>{
    const rows = ((s && s.rows)||[]).filter(r=>(Number(r.count)||0)>0);
    if(o.featurePrice!==undefined && !rows.some(r=>r.feature!==undefined)) return [`Hole dug and levelled to suit the ${o.featureName?esc(o.featureName):'chosen water feature'}'s base or reservoir.`,`Feature installed and plumbed in following the manufacturer's instructions, and connected to a power source.`,`Surrounding area dressed with pebbles to finish.`];
    const list = a => a.length<=1 ? (a[0]||'') : a.slice(0,-1).join(', ')+' and '+a[a.length-1];
    const names = [...new Set(rows.map(r=>r.feature).filter(Boolean))].map(esc);
    const many = rows.reduce((t,r)=>t+(Number(r.count)||0),0)>1;
    const elec = [...new Set(rows.filter(r=>r.electrics && r.feature).map(r=>r.feature))].map(esc);
    const lines = [];
    if(names.length) lines.push(many ? `Holes dug and levelled to suit the bases or reservoirs of the ${list(names)}.` : `Hole dug and levelled to suit the ${names[0]}'s base or reservoir.`);
    lines.push(`${many?'Features':'Feature'} installed and plumbed in following the manufacturer's instructions.`);
    if(elec.length) lines.push(`The ${list(elec)} ${elec.length>1?'require':'requires'} a power connection — a price for this will be provided separately by an independent electrician.`);
    if(rows.some(r=>r.pebbles)) lines.push(`Surrounding area dressed with pebbles to finish.`);
    return lines;
  },
  // The stake length on the letter comes from the same setting the rebar maths uses.
  steeledging: (o)=>{
    const legacy = o.steelProduct===undefined && o.thickness!==undefined;
    const nm = legacy ? esc(o.thickness) : esc(o.steelProduct||'');
    const stake = legacy ? 500 : (S.settings.steelStakeLength!=null ? S.settings.steelStakeLength : 500);
    return [`Edging line marked out with pegs and string.`,`Trench dug along the line.`,`${nm} steel edging sections placed into the trench, joining lengths as required.`,`Rebar cut into ${stake}mm lengths and hammered into the ground at intervals along the steel.`,`Rebar welded to the steel plate to secure it in place.`];
  },
  // Dig-out depth from the rows (each row listed when they differ); membrane / ready-to-plant
  // line by the tick; edging line only for a non-steel edging length.
  flowerbeds: (o, s)=>{
    const rows = ((s && s.rows)||[]).filter(r=>(Number(r.width)||0)*(Number(r.length)||0)>0);
    if(o.compost===undefined && !rows.some(r=>r.digOutDepth!==undefined))
      return [`Bed area dug out to a minimum depth of 300mm.`,`Filled with good quality peat-free compost.`, o.plantingNow ? `Planted directly, without a membrane, as agreed.` : `Geotextile membrane laid on top ahead of planting.`,`Topped with bark mulch.`];
    const depths = rows.map(r=>Math.round(Number(r.digOutDepth)||0));
    const same = depths.length && depths.every(d=>d===depths[0]);
    const dig = !depths.length ? `Bed area dug out.` : same ? `Bed area dug out to a depth of ${depths[0]}mm.`
      : `Bed areas dug out to: ${rows.map((r,i)=>`${esc((r.desc||'').trim()||('bed '+(i+1)))} ${depths[i]}mm`).join(', ')}.`;
    const md = (s && s.mulchDepth!=null) ? s.mulchDepth : 50;
    const lines = [dig, `Filled with good quality peat-free compost.`,
      o.plantingNow ? `Flower bed ready for immediate planting.` : `Geotextile membrane laid on top to suppress weeds until ready for planting.`,
      `Topped with ${md}mm of bark mulch.`];
    if(o.edgingStyle && o.edgingStyle!==GRAVEL_STEEL_EDGING && Number(o.edgingLength)>0) lines.push(`Edging installed around the bed.`);
    return lines;
  },
};
/* The measurement, inc-VAT total and effective rate (total ÷ measurement) shown against
   each section on the quote letter — fencing (and any length-based custom service) is
   priced per metre run, everything else per square metre. Waste removal's area is the
   shared combined figure from calcWasteRemoval, so it uses the same treatment. */
// vatRate is passed in (rather than read from live settings) so a quote's own letter always
// reflects whatever VAT treatment applied when IT was created, even if the business's VAT
// registration or rate has changed since — see q.vatRegistered.
function sectionMeasureRate(s, vatRate){
  const svcUnitLabel = SERVICES[s.key] && SERVICES[s.key].unitLabel;
  const unit = svcUnitLabel==="Length" ? "m" : svcUnitLabel==="Count" ? "feature" : "m²";
  const area = s.area||0;
  const totalIncVat = s.subtotal*(1+(vatRate||0));
  const rate = area>0.004 ? totalIncVat/area : null;
  return {unit, area, totalIncVat, rate};
}
// A count-based quantity (currently just "feature") reads as a whole number with a pluralised
// word ("2 features"), not a decimal ("2.00 feature") like an area or length measurement does.
function qtyText(area, unit){
  if(unit==="feature"){ const n = Math.round(area); return `${n} feature${n===1?'':'s'}`; }
  return `${area.toFixed(2)} ${unit}`;
}

/* Customer-facing materials allowance for a section — name and quantity allowed for only;
   no supplier and no price/cost (those are internal, shown only in the Internal breakdown
   panel, never on the letter the customer sees). Plant/hire (e.g. digger, grab) isn't a
   "material" so it's deliberately left out — only s.materials, never s.plant. */
function sectionMaterialsList(s){
  return (s.materials||[]).map(m=>({name:m.name, qty:m.qty, unit:m.unit}));
}
// The quote letter's one materials list: every material across all the quote's services, in the
// order they first appear. The same material (same name and unit) used by more than one service
// — the same screws, the same sand — becomes one line with the quantities added together.
// Consumables are left off the customer's letter (still costed in the price, as before).
function quoteMaterialsList(q){
  const out = [], byKey = {};
  (q.sections||[]).filter(s=>s.key!=="waste" && s.subtotal>0.004).forEach(s=>{
    sectionMaterialsList(s).forEach(m=>{
      const qty = Number(m.qty)||0; if(!qty) return;
      if(/^consumables$/i.test(String(m.name||'').trim())) return;
      const k = String(m.name||'').trim().toLowerCase()+'|'+String(m.unit||'').trim().toLowerCase();
      if(byKey[k]) byKey[k].qty += qty;
      else { byKey[k] = {name:m.name, unit:m.unit, qty}; out.push(byKey[k]); }
    });
  });
  out.forEach(m=>{ m.qty = Math.round(m.qty*100)/100; });
  return out;
}

/* Scope-of-work bullets for a priced section — built-ins use their SERVICE_COPY narrative;
   a custom (subscriber-added) service has no set narrative, so its own line-item
   descriptions stand in instead, since that's the only description of the work there is. */
function sectionCopy(s){
  if(SERVICE_COPY[s.key]) return SERVICE_COPY[s.key](s.options, s);
  if(s.custom){
    const cs = (S.settings.customServices||[]).find(x=>x.key===s.key);
    if(cs && Array.isArray(cs.letter) && cs.letter.some(l=>l && (l.text||'').trim()))
      return bldLetterLines(cs.letter, s.options||{}, {length:(Number(s.area)||0).toFixed(2)});
    return (s.rows||[]).map(r=>r.desc).filter(Boolean).map(esc);
  }
  return [];
}

/* Build the full priced section from a raw calc() result. Subscriber-added services
   (Settings › Services › "Add another service") plug into this exact same pipeline as the
   built-in ones — their calc() (built by registerCustomServices) looks up material costs
   from the shared materials list via ctx.price(), same as every hand-built service, so
   prices/VAT/productivity for them are edited in the same places as any other service. */
function priceSection(key, rows, options, ctx, notes){
  const def = SERVICES[key];
  const raw = def.calc(rows, options, ctx);
  const materials = raw.materials
    .filter(([name,qty]) => name && qty && Math.abs(qty)>1e-9)
    // A material tuple is normally [name, qty] and its price comes from the shared materials
    // list. A service can instead pass [name, qty, explicitPrice, supplier] for a one-off,
    // job-specific item (e.g. Water Features, where every feature is a different product at a
    // different price) — explicitPrice is used directly instead of a ctx.price() lookup, and
    // supplier is carried through for Matt's own internal reference (never shown to the customer;
    // sectionMaterialsList below deliberately drops it).
    // A fifth element, explicitUnit, lets a service show its own unit (e.g. "m²") for an
    // explicit-price line instead of the 'each' fallback — used by Paving's tenant-built
    // product libraries (jointing compound, edging style), which are priced per-job via
    // explicitPrice but still measured in unit/each like any shared material.
    .map(([name,qty,explicitPrice,supplier,explicitUnit])=>{
      const hasExplicitPrice = explicitPrice!=null;
      const price = hasExplicitPrice ? (Number(explicitPrice)||0) : ctx.price(name);
      const unit = hasExplicitPrice ? (explicitUnit||'each') : ctx.unit(name);
      return {name, unit, qty: Math.round(qty*100)/100, price, cost: Math.round(qty*price*100)/100, supplier: hasExplicitPrice ? (supplier||'') : undefined, _explicit: hasExplicitPrice};
    });
  // Safety net for every service: any material or plant line in use at £0 blocks finalising
  // (services that already name the problem their own way aren't repeated).
  const blockers = (raw.blockers||[]).slice();
  const named = n => blockers.some(b=>b.indexOf(n)>=0);
  materials.forEach(m=>{
    if(m.qty>0 && !(m.price>0) && !named(m.name)) blockers.push(m._explicit ? `"${m.name}" has a £0 price — give it a price before finalising` : `"${m.name}" has no price — enter one in Materials`);
    delete m._explicit;
  });
  const plant = (raw.plant||[])
    .filter(([item,qty]) => qty && Math.abs(qty)>1e-9)
    .map(([item,qty,days,mode])=>{
      const rate = ctx.price(item);
      let cost;
      if(mode==='flat'){ cost = qty*rate; } else { cost = qty*(days||0)*rate; }
      return {item, qty, days: mode==='flat'?null:days, rate, cost: Math.round(cost*100)/100};
    });
  const materialsCost = sum(materials.map(m=>m.cost));
  const plantCost = sum(plant.map(p=>p.cost));
  // `days` is calendar days on site (already divided by peopleOnSite and rounded up to the
  // nearest quarter day inside calc() — see each SERVICES[key].calc) — this is what schedules
  // the job and what plant-hire duration above was costed against. `personDays` is the total,
  // crew-size-independent labour effort the job needs (quantity ÷ per-person productivity,
  // unrounded) — this is what labour actually costs, regardless of how many people split it.
  const days = raw.days || 0;
  const personDays = raw.personDays!=null ? raw.personDays : days;
  const extraLabourDays = raw.extraLabourDays || 0;
  const labourCost = (personDays + extraLabourDays) * ctx.dayRatePerPerson;
  const expensesCost = days * ctx.expensesPerDay;
  const costSubtotal = materialsCost + labourCost + expensesCost + plantCost;
  // the customer-facing price for this line — cost plus the business's profit margin
  const subtotal = costSubtotal * (1 + (ctx.markupPercent||0)/100);
  return {
    key, label:def.label, rows:deepClone(rows), options:deepClone(options), custom: !!def.custom,
    keyFigures: raw.keyFigures||[], area: raw.area||0, days, personDays,
    // digOutDepth (mm) is normally returned directly by a service's own calc() (every
    // spoil-capable built-in, and a custom service with its flag on — see registerCustomServices/
    // BUILTIN_OWN_DEPTH_FIELD). As a generic fallback for a built-in service a tenant has
    // switched "generates spoil?" on for without its own hand-wired depth field (see
    // refreshGenericSpoilOptions, which injects the option itself), read the job's own
    // dig-out-depth option value straight from `options` here instead — carried through so
    // calcWasteRemoval can pool real dig-out VOLUME (area × depth) across every spoil-generating
    // service, instead of just area.
    motDepth: raw.motDepth,
    mulchDepth: raw.mulchDepth,
    blockers,
    wasteArea: raw.wasteArea,
    fenceSnap: raw.fenceSnap,
    digOutDepth: raw.digOutDepth!=null ? raw.digOutDepth
      : ((ctx.generatesSpoil && ctx.generatesSpoil[key] && options && options.digOutDepth!=null) ? Number(options.digOutDepth) : undefined),
    materials, plant, materialsCost, labourCost, expensesCost, plantCost, costSubtotal, subtotal,
    notes: deepClone(notes||[]),
  };
}

// 19-service catalogue, in the order presented in the procedures document (Sept 2026 rebuild).
// "decking", "fencing", "metalbeds" and "sleeperbeds" are deliberately left out here — see the
// comment above their SERVICES entries — so they never appear as choices for new quotes.
const SERVICE_ORDER = ["turf","paving","blockpaving","compositedecking","timberdecking","gravel","brickwall","sleeperwall","fence","waterfeatures","pond","resinbound","steeledging","flowerbeds","artificialturf","pergola","concretebase"];
// Built-in services that aren't part of the standard catalogue a new business starts with — only
// a business that has them listed in settings.extraServices sees them (the pre-existing business
// keeps Resin bound; see loadAll). Everything else in SERVICE_ORDER is available to everyone.
const TENANT_ONLY_SERVICES = new Set(["resinbound"]);
function availableServiceKeys(settings){
  const extra = (settings && settings.extraServices) || [];
  return SERVICE_ORDER.filter(k=>!TENANT_ONLY_SERVICES.has(k) || extra.includes(k));
}
// Which services feed the shared "Waste removal & site clearance" pool is a tenant-editable
// flag per service now (settings.generatesSpoil — see ctxFor/ensureSectionState and the
// "Waste & spoil eligibility" card in Settings → Pricing), not a fixed list — every built-in
// AND custom service can be switched on or off there. defaultSettings().generatesSpoil below
// seeds it to reproduce exactly what used to be hardcoded here, plus Pond and Block Retaining
// Wall (now pooled instead of hiring their own standalone digger).
// For the three services below, digging out is itself optional on the job (their own existing
// "Dig out necessary?" yes/no) — generatesSpoil only takes effect on a job where that's ALSO
// ticked, exactly as they already behaved before this flag existed.
const SPOIL_GATE_OPTION = {compositedecking:"digOut", timberdecking:"digOut", decking:"digOut"};
// Spoil-eligible services with a job-level depth carry it as a "Dig-out depth (mm)" option under
// the key "digOutDepth"; this map would name any exception (none now — Concrete base moved to
// per-row dig-out depths in the October 2026 rework).
const DEPTH_OPTION_KEY = {};
// Which settings.productivity key seeds each service's per-job "Edging productivity" option —
// see ensureSectionState.
const EDGING_PRODUCTIVITY_SETTINGS_KEY = {paving:"pavingEdging", blockpaving:"blockpavingEdging", gravel:"gravelEdging", flowerbeds:"flowerbedsEdging", artificialturf:"artificialturfEdging"};

/* Services a subscriber builds themselves (Settings › Services › "Add another service") for
   work the built-in catalogue doesn't cover — e.g. hedge cutting, irrigation, garden lighting.
   Built through a short wizard (serviceBuilderHtml/click handlers below) that asks how the
   job is measured, what materials it uses per unit of that measurement, whether it generates
   waste, and a starting productivity rate — then this turns that into a real calc() function,
   exactly like the hand-tuned one for each built-in service above. Because the generated
   calc() looks material costs up from the shared materials list via ctx.price() (never a
   price typed into the service itself), a custom service's materials, VAT treatment and
   productivity are edited afterwards in exactly the same places as a built-in service's —
   Materials & settings › Materials / Pricing. Called once at startup and again whenever a
   custom service is added or removed, so the catalogue always matches what's saved. */
/* =========================================================================
   BUILDER QUANTITY RULES — shared by custom services (Settings → Services → builder) and
   Fencing's fence types. A builder "line" is {material, basis, amount, per, roundUp, optionKey,
   onlyIf}: quantity = (basis figure) × amount ÷ per, optionally rounded up, and only counted
   when its `onlyIf` tick is on. Bases:
     unit    — the job's total measured length/area
     rowUnit — each row's own length/area, rounded up on each row, then summed
     post    — posts in the ground (Fencing)
     bay     — bays / panels between posts (Fencing)
     job     — a fixed amount per job (when anything is measured)
     option  — a number option on the quote (e.g. number of gates)
   ========================================================================= */
const BLD_BASES = [
  {key:"unit",    label:u=>`per ${u} measured (job total)`},
  {key:"rowUnit", label:u=>`per ${u}, rounded up on each row`},
  {key:"post",    label:()=>"per post in the ground", fence:true},
  {key:"bay",     label:()=>"per bay / panel", fence:true},
  {key:"job",     label:()=>"fixed amount per job"},
  {key:"option",  label:()=>"× a number option on the quote"},
];
function bldLineQty(line, c){
  const rate = (Number(line.amount)||0) / (Number(line.per)||1);
  let q = 0;
  switch(line.basis||"unit"){
    case "rowUnit": return sum((c.rowPrimaries||[]).map(p=>ru(p*rate)));
    case "post": q = (c.posts||0)*rate; break;
    case "bay": q = (c.bays||0)*rate; break;
    case "job": return c.primary>0 ? r6(Number(line.amount)||0) : 0;
    case "option": q = (Number(c.opt && c.opt[line.optionKey])||0)*rate; break;
    default: q = (c.primary||0)*rate;
  }
  return line.roundUp ? ru(q) : r6(q);
}
function bldOnlyIfOk(line, opt){ return !line.onlyIf || !!(opt && opt[line.onlyIf]); }
// Builder-written quote-letter lines: shown always or only when a tick is on, with an optional
// extra phrase added when another tick is on, and [in-ground depth] / [fence height] /
// [total length] filled in from the job.
function bldLetterLines(lines, opt, vars){
  return (lines||[]).filter(l=>l && (l.text||'').trim() && (!l.onlyIf || (opt && opt[l.onlyIf]))).map(l=>{
    let t = l.text.trim() + (l.appendIf && opt && opt[l.appendIf] ? (l.append||'') : '');
    t = t.replace(/\[in-ground depth\]/gi, String(vars.inGround!=null?vars.inGround:''))
         .replace(/\[fence height\]/gi, String(vars.height!=null?vars.height:''))
         .replace(/\[total length\]/gi, String(vars.length!=null?vars.length:''));
    t = t.trim(); if(!/[.!?]$/.test(t)) t += '.';
    return esc(t);
  });
}
// A pre-upgrade custom service only had "X per Y" materials and an optional waste item —
// expressed here as builder lines so old and new services price through the same engine.
function bldLegacyLines(cs){
  const lines = (cs.materials||[]).map(m=>({material:m.name, basis:"unit", amount:m.amountPerUnit||0, per:1}));
  if(cs.waste && cs.waste.name) lines.push({material:cs.waste.name, basis:"unit", amount:cs.waste.amountPerUnit||0, per:1});
  return lines;
}
// Lines with a quantity but no price (materials list, or a price carried on the line) — for the
// "can't finalise at £0" checks.
function bldZeroPriceBlockers(mats, plant, ctx){
  const out = [];
  mats.forEach(m=>{ const nm = m[0], q = Number(m[1])||0; if(!nm || !(q>0)) return;
    const price = m[2]!==undefined ? Number(m[2]) : ctx.price(nm);
    if(!(price>0)) out.push(`"${nm}" has no price — enter one in Materials`); });
  (plant||[]).forEach(p=>{ if(!p[0]) return; if(!(ctx.price(p[0])>0)) out.push(`"${p[0]}" has no daily rate — enter one in Materials`); });
  return out;
}

function registerCustomServices(){
  (S.settings.customServices||[]).forEach(cs=>{
    const isLength = cs.measureType==="length";
    const isWH = cs.measureType==="area_wh";
    const cols = isLength ? ["desc","length"] : (isWH ? ["desc","length","height"] : ["desc","width","length"]);
    const colLabels = isLength ? ["Description","Length (m)"] : (isWH ? ["Description","Length (m)","Height (m)"] : ["Description","Width (m)","Length (m)"]);
    const unitSuffix = isLength ? "m" : "m²";
    // Whether this custom service feeds the shared Waste removal & site clearance pool is a
    // tenant-editable flag, same mechanism as every built-in service — see settings.generatesSpoil
    // (Settings → Pricing → Waste & spoil eligibility). Read live (not cached) here, since
    // registerCustomServices() is re-run whenever that flag is toggled, so the generated
    // service's own options/calc immediately pick up or drop the dig-out depth field.
    const spoilEligible = !!(S.settings.generatesSpoil && S.settings.generatesSpoil[cs.key]);
    const digOutDepthDefault = (S.settings.digOutDepthDefaults && S.settings.digOutDepthDefaults[cs.key]!=null) ? S.settings.digOutDepthDefaults[cs.key] : 150;
    const options = [{key:"productivity", label:`Productivity (${unitSuffix}/day/person)`, type:"number",
      default: cs.productivityDefault||1,
      hint:"How much ONE PERSON gets through per day for this service — override for this job if needed."}];
    // Builder options (ticks and number fields) shown on the quote — see the builder's step 1.
    (cs.options||[]).forEach(o=>{
      if(!o || !o.key || !o.label) return;
      options.push(o.type==="number"
        ? {key:o.key, label:o.label, type:"number", default:(o.default!=null && o.default!=='') ? o.default : 0}
        : {key:o.key, label:o.label, type:"yesno", default:!!o.default});
    });
    if(spoilEligible){
      options.push({key:"digOutDepth", label:"Dig-out depth (mm)", type:"number", default: digOutDepthDefault,
        hint:"How deep this job digs out — feeds the shared Waste removal & site clearance totals alongside every other spoil-generating service."});
    }
    const lines = Array.isArray(cs.lines)
      ? cs.lines.concat(cs.waste && cs.waste.name ? [{material:cs.waste.name, basis:"unit", amount:cs.waste.amountPerUnit||0, per:1}] : [])
      : bldLegacyLines(cs);
    SERVICES[cs.key] = {
      label: cs.label, group: cs.group || "Other services", unitLabel: isLength?"Length":"Area",
      custom:true, cols, colLabels,
      options,
      calc(rows, opt, ctx){
        const rowPrims = rows.map(r=> isLength ? (Number(r.length)||0)
          : isWH ? (Number(r.length)||0)*(Number(r.height)||0)
          : (Number(r.width)||0)*(Number(r.length)||0)).filter(p=>p>0);
        const primary = sum(rowPrims);
        const productivity = Number(opt.productivity) || cs.productivityDefault || 1;
        // personDays is the total labour effort this job needs, independent of crew size; days
        // is that split across however many people are on site, same as every built-in service.
        const personDays = primary>0 ? primary/productivity : 0;
        const days = primary>0 ? ruq(personDays/(ctx.peopleOnSite||1)) : 0;
        // Every material (and a pre-upgrade service's own per-unit waste item) prices through the
        // builder rule engine — see bldLineQty.
        const c = {primary, rowPrimaries:rowPrims, posts:0, bays:0, opt};
        const mats = lines.filter(l=>l && l.material).map(l=>[l.material, bldOnlyIfOk(l,opt) ? bldLineQty(l,c) : 0]);
        const plant = (cs.plant||[]).filter(p=>p && p.name).map(p=>[p.name, 1, days]);
        // Same "can't finalise at £0" rule as Fencing: every material or plant item this job
        // actually uses needs a price (named so the user knows which line to fix).
        const blockers = primary>0 ? bldZeroPriceBlockers(mats, plant, ctx) : [];
        const result = {
          area: primary, days, personDays, materials: mats, plant, blockers,
          keyFigures: [[isLength?"Total length":"Total area", primary.toFixed(2)+" "+unitSuffix], ["Days required", days]],
        };
        // Opting a custom service into the shared digger/grab-hire/clearance-labour pool feeds
        // its area and dig-out volume into calcWasteRemoval exactly like a built-in service.
        if(spoilEligible) result.digOutDepth = Number(opt.digOutDepth) || digOutDepthDefault;
        return result;
      },
    };
  });
}

// Built-in services that already carry their own "Dig-out depth (mm)" (option or per-row) and feed it through their own calc() — see each SERVICES[key]
// above. Any OTHER built-in service a tenant switches "Generates spoil?" on for (Settings →
// Pricing → Waste & spoil eligibility) gets the same field injected generically below, exactly
// like registerCustomServices() does for custom ones, rather than hand-wiring it into every
// remaining service — so every spoil-enabled service, built-in or custom, ends up with a real,
// editable, per-job dig-out depth feeding the shared pool, not just a silent 150mm assumption.
const BUILTIN_OWN_DEPTH_FIELD = new Set(["flowerbeds","waterfeatures","turf","paving","gravel","blockpaving","resinbound","artificialturf","concretebase","compositedecking","timberdecking","decking","pond","brickwall"]);
// Services that never generate spoil, whatever the Settings flag says (Sleeper Retaining Wall —
// posts go in individual holes, with no dig-out) — left out of the waste pool and its Settings table.
const NEVER_SPOIL = new Set(["sleeperwall","fence","steeledging","pergola"]);
// Services that always feed the shared waste pool, whatever the Settings switch says (Flower Beds).
const ALWAYS_SPOIL = new Set(["flowerbeds"]);
function refreshGenericSpoilOptions(){
  SERVICE_ORDER.forEach(key=>{
    const def = SERVICES[key];
    if(!def || BUILTIN_OWN_DEPTH_FIELD.has(key) || NEVER_SPOIL.has(key)) return;
    // Idempotent: drop any previously-injected field first, so toggling off removes it and a
    // changed business default is picked up cleanly on the next toggle-on.
    def.options = def.options.filter(o=>!o._spoilInjected);
    if(!(S.settings.generatesSpoil && S.settings.generatesSpoil[key])) return;
    const d = (S.settings.digOutDepthDefaults && S.settings.digOutDepthDefaults[key]!=null) ? S.settings.digOutDepthDefaults[key] : 150;
    def.options.push({key:"digOutDepth", label:"Dig-out depth (mm)", type:"number", default:d, _spoilInjected:true,
      hint:"How deep this job digs out — feeds the shared Waste removal & site clearance totals alongside every other spoil-generating service."});
  });
}

/* Waste removal (digger/grab hire/clearance labour) is auto-derived from the combined area and
   dig-out volume of every service flagged "generates spoil?" (settings.generatesSpoil — see
   SPOIL_GATE_OPTION/ctxFor/ensureSectionState above) — never picked by the user directly. A
   custom service can either join this shared pool (if flagged) or price its own waste as a
   per-unit item (cs.waste — see registerCustomServices()), or both; most won't do either. */
// A spoil-eligible service that doesn't return its own dig-out depth (shouldn't normally happen
// now that every eligible service has a depth field/default — see each SERVICES[key].calc — but
// kept as a defensive fallback) is assumed dug to this depth for the volume-pooling formula below.
const WASTE_DEFAULT_DEPTH_MM = 150;
function calcWasteRemoval(sections, ctx, opts, notes){
  let area = 0, volumeM3 = 0;
  sections.forEach(s=>{
    const spoilFlag = ALWAYS_SPOIL.has(s.key) || (!NEVER_SPOIL.has(s.key) && !!(ctx.generatesSpoil && ctx.generatesSpoil[s.key]));
    const gateKey = SPOIL_GATE_OPTION[s.key];
    // For a service where digging is itself optional (the gate services above), the flag only
    // takes effect on a job where that option is also ticked.
    const eligible = spoilFlag && (!gateKey || !!(s.options && s.options[gateKey]));
    if(!eligible) return;
    // A service whose excavated footprint differs from its priced area (Block Retaining Wall's
    // footings) reports it separately as wasteArea.
    const wArea = s.wasteArea!=null ? s.wasteArea : s.area;
    area += wArea;
    const depthMm = s.digOutDepth!=null ? s.digOutDepth : WASTE_DEFAULT_DEPTH_MM;
    volumeM3 += wArea * (depthMm/1000);
  });
  if(area<=0) return null;
  opts = opts || {};
  // Digger hire and clearance labour are pooled by combined AREA, scaled by depth below; grab
  // hire is pooled by combined dig-out VOLUME (area × depth) directly, since a skip lorry's load
  // is limited by volume, not footprint — unaffected by the depth-scaling that follows.
  const diggerProd = opts.diggerProductivity!=null ? opts.diggerProductivity : ctx.wasteDiggerProductivity;
  const grabM3PerLoad = opts.grabM3PerLoad!=null ? opts.grabM3PerLoad : ctx.wasteGrabM3PerLoad;
  const labourProd = opts.labourProductivity!=null ? opts.labourProductivity : ctx.wasteLabourProductivity;
  // Digger productivity and clearance-labour productivity (above) are defined at a 150mm
  // baseline depth — a pooled job whose actual dig-out is deeper or shallower than that scales
  // the resulting digger-days/person-days up or down proportionally. Where depths differ across
  // the pooled services, this uses their area-weighted average depth, which falls straight out
  // of the combined area/volume already being totalled above (avg depth = volume ÷ area).
  const avgDepthMm = area>0 ? (volumeM3/area)*1000 : 0;
  const depthScale = avgDepthMm>0 ? avgDepthMm/150 : 1;
  // Digger hire is billed in flat multi-day blocks (a week's hire, by default), not day by day,
  // so diggerDays only needs whole-day precision on its way to a block count. Grab hire is
  // billed per load, never a fraction of one, so grabLoads stays whole too — and, as above,
  // grabLoads is driven by volume directly and never depth-scaled a second time. Both are
  // machine/plant throughput — one digger or one load doesn't go faster for having more people
  // on site — so neither is affected by peopleOnSite, unlike the clearance labour below.
  const diggerDays = ru((area/diggerProd) * depthScale);
  // Optional skip(s) ON TOP of the grab hire (e.g. for green waste/rubbish) — the job picks a
  // skip from the tenant's own skip list (Settings → Waste & spoil) and how many.
  // (A quote saved in the brief "skip instead of grab" version carries useSkip — read it as an
  // added skip so nothing is lost.)
  const addSkip = opts.addSkip!==undefined ? !!opts.addSkip : !!opts.useSkip;
  const skip = addSkip && opts.skipProduct ? (ctx.wasteSkips||[]).find(x=>x.name===opts.skipProduct) : null;
  const skipBlockers = [];
  const skipQtyRaw = opts.skipQty!=null && opts.skipQty!=='' ? Number(opts.skipQty) : 1;
  if(addSkip){
    if(!skip) skipBlockers.push("Pick a skip size for the waste removal");
    if(!(skipQtyRaw>0)) skipBlockers.push("Enter how many skips");
  }
  const skipCount = skip && skipQtyRaw>0 ? ru(skipQtyRaw) : 0;
  const skipRate = skip ? ctx.netPrice(skip.price, skip.vatIncluded) : 0;
  const grabLoads = ru(volumeM3/grabM3PerLoad);
  const diggerBlockDays = ctx.diggerBlockDays!=null ? ctx.diggerBlockDays : 5;
  const diggerBlocks = ru(diggerDays/diggerBlockDays);
  const diggerCost = diggerBlocks*ctx.price("Digger hire");
  const grabCost = grabLoads*ctx.price("Grab hire");
  // Clearance labour is billed like any other section's crew time: labourProd is a per-person
  // rate, so labourPersonDays is the total (crew-size-independent) labour effort, depth-scaled
  // the same way as digger-days above — that's what drives cost — and labourDays is the
  // calendar time it takes once split across peopleOnSite, rounded up to the nearest quarter
  // day — that's what drives the schedule and running costs (the van/fuel costs below are per
  // day on site, not per person).
  const labourPersonDays = (area/labourProd) * depthScale;
  const labourDays = ruq(labourPersonDays/(ctx.peopleOnSite||1));
  const labourCost = labourPersonDays*ctx.dayRatePerPerson;
  const expensesCost = labourDays*ctx.expensesPerDay;
  const plant = [
    {item:"Digger hire", qty:diggerBlocks, days:null, rate:ctx.price("Digger hire"), cost:Math.round(diggerCost*100)/100},
    {item:"Grab hire", qty:grabLoads, days:null, rate:ctx.price("Grab hire"), cost:Math.round(grabCost*100)/100},
    ...(addSkip ? [{item: skip ? `Skip hire — ${skip.name}` : "Skip hire", qty:skipCount, days:null, rate:skipRate, cost:Math.round(skipCount*skipRate*100)/100}] : []),
  ];
  const plantCost = sum(plant.map(p=>p.cost));
  const costSubtotal = labourCost + expensesCost + plantCost;
  return {
    key:"waste", label:"Waste removal & site clearance", rows:[],
    options:{diggerProductivity:diggerProd, grabM3PerLoad, labourProductivity:labourProd, addSkip, skipProduct: opts.skipProduct||"", skipQty: opts.skipQty!=null ? opts.skipQty : 1}, area,
    keyFigures:[["Combined area", area.toFixed(2)+" m²"],["Combined dig-out volume", volumeM3.toFixed(2)+" m³"],["Area-weighted avg. dig-out depth", Math.round(avgDepthMm)+" mm"]],
    days:labourDays, personDays:labourPersonDays,
    materials:[], plant, materialsCost:0, labourCost, expensesCost, plantCost, costSubtotal,
    blockers: skipBlockers.concat(plant.filter(p=>p.qty>0 && !(p.rate>0)).map(p=>p.item.startsWith("Skip hire") ? `"${p.item}" has no price — edit the skip to add one` : `"${p.item}" has no price — enter one in Materials`)),
    subtotal: costSubtotal * (1 + (ctx.markupPercent||0)/100),
    notes: deepClone(notes||[]),
  };
}

/* =========================================================================
   QUOTE-LEVEL AGGREGATION
   ========================================================================= */
/* Extras (Oct 2026): each is one line — a description, its materials £, plant hire £ and the
   labour it needs in person-days (all at cost, ex VAT). Labour = person-days × day rate; the
   person-days are split across the crew like any service, adding to the days on site (so the
   calendar and the day-rate running costs go up too). Only materials and plant count towards the
   deposit. A quote saved before this (qty × unit price) reads as materials only. */
function extraParts(e){
  const n = v => { const x = parseFloat(String(v==null?'':v).replace(/[£,\s]/g,'')); return isNaN(x) ? 0 : x; };
  const legacy = e && e.materials==null && e.plant==null && e.labourDays==null && (e.qty!=null || e.price!=null);
  if(legacy) return {materials: n(e.qty)*n(e.price), plant: 0, personDays: 0, legacy:true};
  return {materials: n(e && e.materials), plant: n(e && e.plant), personDays: Math.max(0, n(e && e.labourDays)), legacy:false};
}
function extrasBreakdown(extras, ctx){
  const parts = (extras||[]).map(extraParts);
  const materials = sum(parts.map(p=>p.materials)), plant = sum(parts.map(p=>p.plant));
  const personDays = sum(parts.map(p=>p.personDays));
  const days = personDays>0 ? ruq(personDays/(ctx.peopleOnSite||1)) : 0;
  const labour = personDays*(ctx.dayRatePerPerson||0);
  const expenses = days*(ctx.expensesPerDay||0);
  // Each extra's own cost (its running costs are its share of the extras' days on site).
  const each = parts.map(p=>p.materials + p.plant + p.personDays*(ctx.dayRatePerPerson||0) + (personDays>0 ? expenses*p.personDays/personDays : 0));
  return {materials, plant, personDays, days, labour, expenses, total: materials+plant+labour+expenses, each};
}
function calcQuote(sections, extras, ctx){
  const materials = sum(sections.map(s=>s.materialsCost));
  const labour = sum(sections.map(s=>s.labourCost));
  const expenses = sum(sections.map(s=>s.expensesCost));
  const plantHire = sum(sections.map(s=>s.plantCost));
  const xb = extrasBreakdown(extras, ctx);
  const extrasTotal = xb.total;
  const cost = materials + labour + expenses + plantHire + extrasTotal;
  const markupRate = (ctx.markupPercent||0)/100;
  const markup = cost * markupRate;
  const subtotal = cost + markup;   // customer-facing price, ex VAT
  const vat = subtotal * ctx.vatRate;
  const total = subtotal + vat;
  const totalDays = sum(sections.map(s=>s.days||0));
  return {materials, labour, expenses, plantHire, extrasTotal, cost, markup, subtotal, vat, total, totalDays: totalDays + xb.days,
    extrasMaterials: xb.materials, extrasPlant: xb.plant, extrasLabour: xb.labour, extrasExpenses: xb.expenses, extrasDays: xb.days, extrasPersonDays: xb.personDays};
}

/* Payment schedule — deposit (materials, extras & hired plant) one week before start,
   then a fixed £4,000 on the first Friday after the start date and every Friday after
   that (never reduced) right up to the completion date, then whatever's genuinely
   left (incl. VAT) is billed on completion.
   `completionDate` is the job's REAL last scheduled working day (from scheduleWorkingDays,
   below — it already accounts for the business's configured working week and skips any day
   blocked by another job/calendar entry); callers that haven't computed a real schedule yet
   can leave it out and fall back to the old working-days-to-calendar-days estimate. */
function calcPaymentSchedule(sections, extras, totals, startDate, weeklyAmount, vatRegistered, completionDate){
  const total = totals.total;
  // Deposit: the share of the customer's price that covers what has to be paid out up front —
  // materials, extras and hired plant (digger and grab) — worked out as a
  // percentage of the quote's cost and applied to its total (so it carries the same mark-up and
  // VAT as everything else). Never more than the total.
  const wastePlant = sum((sections||[]).filter(s=>s.key==="waste").map(s=>Number(s.plantCost)||0));
  // Extras: only their materials and plant count towards the deposit, not their labour days.
  const xParts = (extras||[]).map(extraParts);
  const extrasUpfront = totals.extrasMaterials!=null ? (totals.extrasMaterials||0)+(totals.extrasPlant||0) : sum(xParts.map(p=>p.materials+p.plant));
  const extrasCost = totals.extrasTotal!=null ? (totals.extrasTotal||0) : sum(xParts.map(p=>p.materials+p.plant));
  const upfront = (totals.materials||0) + extrasUpfront + wastePlant;
  const allCost = (totals.materials||0) + (totals.labour||0) + (totals.expenses||0) + (totals.plantHire||0) + extrasCost;
  const share = allCost>0.004 ? Math.max(0, Math.min(1, upfront/allCost)) : 0;
  const depositPct = Math.round(share*100);
  const deposit = Math.min(Math.round((total||0)*share*100)/100, Math.round((total||0)*100)/100);
  // Weekly payments are capped at what's still left to pay and stop once the total is reached.
  const start = new Date(startDate);
  const totalDays = Math.max(totals.totalDays, 1);
  const completion = completionDate ? new Date(completionDate) : addDays(start, totalDays*7/5); // working days -> calendar days
  const schedule = [{label:`Deposit (${depositPct}% — materials & plant hire)`, date:addDays(start,-7), amount:deposit}];
  let running = deposit;
  let cursor = nextFriday(addDays(start,1)); // first Friday strictly after the start date
  const weekly = weeklyAmount>0?weeklyAmount:4000;
  let guard = 0;
  while(cursor <= completion && guard<104 && (total - running) > 0.004){
    const amt = Math.min(weekly, Math.round((total - running)*100)/100);
    schedule.push({label:"Weekly payment", date:new Date(cursor), amount:amt});
    running = Math.round((running + amt)*100)/100;
    cursor = addDays(cursor,7);
    guard++;
  }
  const final = Math.max(0, Math.round((total - running)*100)/100);
  if(final > 0.004){
    schedule.push({label: vatRegistered ? "Final payment on completion (incl. VAT)" : "Final payment on completion", date: completion, amount: final});
  }
  // Stored as plain "YYYY-MM-DD" strings (local date) — see toStorable.
  return schedule.map(p=>Object.assign(p, {date: isoDate(p.date)}));
}

/* =========================================================================
   CALENDAR SCHEDULING — walks a job's required number of working days forward from its
   agreed start date, counting only the days ticked in the business's configured working
   week (settings.workingDays — never a hardcoded Mon–Fri), and automatically skipping any
   day already blocked by another entry (a different job, or a manually-added calendar entry
   with its "blocks this day" tick on), pushing the job onto the next available working day
   instead of double-booking. Every date here is a plain "YYYY-MM-DD" string so it can be
   compared lexicographically (which sorts chronologically) and stored/matched exactly.
   ========================================================================= */
function isoDate(d){
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,'0') + "-" + String(dt.getDate()).padStart(2,'0');
}
// "Monday to Friday 7:30am – 3:30pm" from the business's own working days and hours.
function fmtClock(hhmm){
  const m = String(hhmm||'').match(/^(\d{1,2}):(\d{2})/); if(!m) return '';
  let h = parseInt(m[1],10); const mins = m[2]; const ap = h>=12 ? 'pm' : 'am';
  h = h%12 || 12; return mins==='00' ? `${h}${ap}` : `${h}:${mins}${ap}`;
}
function workingHoursText(dash){
  const s = S.settings, wd = workingDaysOf(s);
  const NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const order = [1,2,3,4,5,6,0].filter(i=>wd[i]);
  let days;
  if(order.length===7) days = "seven days a week";
  else {
    const pos = [1,2,3,4,5,6,0];
    const contiguous = order.length>=3 && order.every((d,i)=>i===0 || pos.indexOf(d)===pos.indexOf(order[i-1])+1);
    days = contiguous ? `${NAMES[order[0]]} to ${NAMES[order[order.length-1]]}` : order.map(i=>NAMES[i]).join(', ').replace(/, ([^,]*)$/, ' and $1');
  }
  const a = fmtClock(s.workStart||"07:30"), b = fmtClock(s.workEnd||"15:30");
  return `${days}${a&&b?` ${a} ${dash||'–'} ${b}`:''}`;
}
function workingDaysOf(settings){
  return (settings && Array.isArray(settings.workingDays) && settings.workingDays.length===7) ? settings.workingDays : [false,true,true,true,true,true,false];
}
function isWorkingDay(dateLike, settings){
  const dt = (dateLike instanceof Date) ? dateLike : new Date(dateLike);
  return !!workingDaysOf(settings)[dt.getDay()]; // Date.getDay(): 0=Sun…6=Sat, matches workingDays' index
}
/* TEAMS/CREWS — every job and calendar entry is assigned to exactly one team (teamId), and
   each team's schedule is clash-checked independently: a day blocked for one team never
   prevents scheduling a different team on that same day (see blockedDateSet below). A fixed
   palette gives each team a stable colour on the calendar by its position in settings.teams,
   since the number of teams is unbounded and can't each get their own CSS class. */
const TEAM_COLORS = ['#3a7ca5','#71a838','#a9527a','#c1812f','#5c6bc0','#c1503a','#2f9e8f','#8e44ad'];
function teamById(id){ return (S.settings.teams||[]).find(tm=>tm.id===id) || null; }
function teamLabel(id){ const tm = teamById(id); if(tm) return tm.name; return id ? "Unknown team" : "Unassigned"; }
function teamColor(id){
  const idx = (S.settings.teams||[]).findIndex(tm=>tm.id===id);
  return idx>=0 ? TEAM_COLORS[idx % TEAM_COLORS.length] : '#9aa39a';
}
function defaultTeamId(){ return (S.settings.teams && S.settings.teams[0]) ? S.settings.teams[0].id : null; }

/* Every date currently blocked by something OTHER than the job/entry being scheduled, as a
   Set of "YYYY-MM-DD" strings: every other non-cancelled job IN THE SAME TEAM's scheduled days
   (unless that job was explicitly set not to block, calendarBlocksDay===false), plus every
   manually-added calendar entry IN THE SAME TEAM with its blocksDay tick on (a manual entry can
   itself span several working days when it's ticked as a job — see entryScheduledDays). Jobs/
   entries on a DIFFERENT team never block each other — each team's schedule is independent, so
   a day already fully booked for one crew is still free for another. `excludeQuoteId`/
   `excludeEntryId` leave a job or entry out of its own collision check when it's being
   (re)scheduled. */
function entryScheduledDays(e){
  return (e.scheduledDays && e.scheduledDays.length) ? e.scheduledDays : [e.date];
}
/* A manual calendar entry can optionally be marked "this is a job", giving it a number of
   working days just like an app-generated job — scheduled the same way (working week only,
   auto-skipping blocked days). A plain entry is always exactly its one chosen date. */
function computeEntrySchedule(date, isJob, days, settings, blocked){
  if(!isJob) return [date];
  return scheduleWorkingDays(date, Number(days)||1, settings, blocked);
}
function blockedDateSet(excludeQuoteId, excludeEntryId, teamId){
  const set = new Set();
  S.quotes.forEach(q=>{
    if(q.id===excludeQuoteId || q.status==="cancelled") return;
    if(q.calendarBlocksDay===false) return;
    if((q.teamId||null) !== (teamId||null)) return; // a different team's schedule — no clash
    (q.scheduledDays||[]).forEach(d=>set.add(d));
  });
  (S.calendarEntries||[]).forEach(e=>{
    if(e.id===excludeEntryId || !e.blocksDay) return;
    if((e.teamId||null) !== (teamId||null)) return;
    entryScheduledDays(e).forEach(d=>set.add(d));
  });
  return set;
}
/* Returns an array of "YYYY-MM-DD" working days, `daysNeeded` long, starting from (and
   possibly including) `startDate` — skipping non-working days and anything in `blocked`. */
function scheduleWorkingDays(startDate, daysNeeded, settings, blocked){
  const days = [];
  let cursor = new Date(startDate);
  let guard = 0;
  // A part day still needs that day on site (2.25 days books 3 working days).
  const need = Math.max(Math.ceil((Number(daysNeeded)||0) - 1e-9), 1);
  while(days.length < need && guard < 3000){
    const ds = isoDate(cursor);
    if(isWorkingDay(cursor, settings) && !blocked.has(ds)) days.push(ds);
    cursor = addDays(cursor, 1);
    guard++;
  }
  return days;
}

/* =========================================================================
   JOB STATUS — four customer-facing buckets a job moves through. "draft" and "sent" (a quote
   not yet accepted) both read as "pending approval"; acceptance moves a job straight to
   "ongoing" (a payment plan exists and work is underway, pipeline-wise, from day one — there's
   no separate "accepted but not started" state); "finished" and "cancelled" are both terminal,
   reached only manually, and both keep every bit of finance data they already have.
   ========================================================================= */
const JOB_STATUS_FILTERS = [
  ["pending","Pending approval"],
  ["ongoing","Ongoing"],
  ["finished","Finished"],
  ["cancelled","Cancelled"],
];
function jobBucket(status){
  if(status==="ongoing") return "ongoing";
  if(status==="finished") return "finished";
  if(status==="cancelled") return "cancelled";
  return "pending"; // draft, sent, or anything unrecognised
}
function statusPillClass(status){
  if(status==="ongoing") return "pill-ongoing";
  if(status==="finished") return "pill-finished";
  if(status==="cancelled") return "pill-cancelled";
  if(status==="sent") return "pill-sent";
  return "pill-draft";
}
function statusLabel(status){
  if(status==="ongoing") return "ongoing";
  if(status==="finished") return "finished";
  if(status==="cancelled") return "cancelled";
  if(status==="sent") return "sent";
  return "draft";
}

/* =========================================================================
   JOB FINANCE TRACKER — created once, when a quote is marked accepted (see "confirmAccept"),
   and kept from then on even if the job is later cancelled. Three cost categories throughout,
   matching how the business already thinks about a job's costs: materials (quoted materials +
   extras, checked off as ordered with their real price), labor (a daily log of who was on site
   and for how long, set against the quoted labour cost), and running costs (the day-rate
   overheads and any plant/equipment hire, logged as actual bills come in). Every actual figure
   is stored net of VAT (same basis as the quote's own totals) so it compares like-for-like
   against the quoted baseline regardless of whether a particular bill happened to be VAT
   -inclusive — see financeNetAmount.
   ========================================================================= */
function createFinanceTracker(q){
  const t = q.totals;
  const checklist = [];
  q.sections.forEach(s=>{
    (s.materials||[]).forEach(m=>{
      if(!m.name || Math.abs(m.qty)<=1e-9) return;
      checklist.push({
        id: uid(), source:"material", sectionLabel: s.label, name: m.name, unit: m.unit,
        quotedQty: m.qty, quotedUnitPrice: m.price, quotedTotal: m.cost,
        ordered:false, orderedAt:null, actualUnitPrice:null, actualIncVat:null, actualTotal:null,
      });
    });
  });
  (q.extras||[]).forEach((e,i)=>{
    // An extra's materials go on the checklist (its plant and labour are tracked with the rest).
    const xp = extraParts(e);
    const total = Math.round(xp.materials*100)/100;
    if(total<=0) return;
    const qty = xp.legacy ? (Number(e.qty)||0) : 1, price = xp.legacy ? (Number(e.price)||0) : total;
    checklist.push({
      id: uid(), source:"extra", sectionLabel:"Extras", name: e.description||`Extra ${i+1}`, unit:"",
      quotedQty: qty, quotedUnitPrice: price, quotedTotal: total,
      ordered:false, orderedAt:null, actualUnitPrice:null, actualIncVat:null, actualTotal:null,
    });
  });
  return {
    createdAt: new Date().toISOString(),
    materials: {
      // Extras split into their parts (older quotes: extras were all materials).
      quotedTotal: Math.round(((t.materials||0)+(t.extrasMaterials!=null ? t.extrasMaterials : (t.extrasTotal||0)))*100)/100,
      checklist, unplanned: [], // unplanned: ad-hoc materials added mid-job, not on the original quote
    },
    labor: {
      quotedDays: t.totalDays||0,
      // Labour effort in person-days (what the labour log records: hours ÷ 8, everyone added up)
      quotedPersonDays: (S.settings.dayRatePerPerson>0) ? Math.round((((t.labour||0)+(t.extrasLabour||0))/S.settings.dayRatePerPerson)*100)/100 : (t.totalDays||0),
      quotedCost: Math.round(((t.labour||0)+(t.extrasLabour||0))*100)/100,
      log: [], // {id, date, person, hours, addedAt}
    },
    runningCosts: {
      quotedTotal: Math.round(((t.expenses||0)+(t.plantHire||0)+(t.extrasExpenses||0)+(t.extrasPlant||0))*100)/100,
      entries: [], // {id, description, amount, addedAt}
    },
    payments: [], // payments received from the customer — {id, amount, date, note, vatSetAside}
    overrunAlertsShown: {materials:false, labor:false, runningCosts:false},
  };
}
// A material/running-cost price can be entered inc. or ex. VAT (only asked when the business is
// VAT-registered) — strip it back to net so it compares fairly against the quoted figure, which
// is always stored net. Mirrors ctxFor's netOf, but per a one-off actual figure rather than a
// standing settings price.
function financeNetAmount(amount, incVat){
  const vatRegistered = S.settings.vatRegistered!==false;
  if(!vatRegistered || !incVat) return Number(amount)||0;
  return (Number(amount)||0) / (1+(S.settings.vatRate||0));
}
function financeMaterialsActual(fin){
  const ordered = sum(fin.materials.checklist.filter(m=>m.ordered).map(m=>m.actualTotal||0));
  const unplanned = sum(fin.materials.unplanned.map(m=>m.cost||0));
  return Math.round((ordered+unplanned)*100)/100;
}
function financeLaborActualDays(fin){
  // A full day is 8 hours — logged hours convert to day-equivalents so they compare directly
  // against the quoted labour days figure.
  return sum(fin.labor.log.map(e=>(Number(e.hours)||0)/8));
}
function financeQuotedPersonDays(fin){
  if(fin.labor.quotedPersonDays!=null) return Number(fin.labor.quotedPersonDays)||0;
  return (S.settings.dayRatePerPerson>0) ? (fin.labor.quotedCost||0)/S.settings.dayRatePerPerson : (fin.labor.quotedDays||0);
}
function financeLaborActualCost(fin){
  return Math.round(financeLaborActualDays(fin) * (S.settings.dayRatePerPerson||0) * 100)/100;
}
function financeRunningActual(fin){
  return Math.round(sum(fin.runningCosts.entries.map(e=>Number(e.amount)||0))*100)/100;
}
function financeCategoryActual(q, category){
  const fin = q.finance; if(!fin) return 0;
  if(category==="materials") return financeMaterialsActual(fin);
  if(category==="labor") return financeLaborActualCost(fin);
  if(category==="runningCosts") return financeRunningActual(fin);
  return 0;
}
function financeCategoryQuoted(q, category){
  const fin = q.finance; if(!fin) return 0;
  if(category==="materials") return fin.materials.quotedTotal;
  if(category==="labor") return fin.labor.quotedCost;
  if(category==="runningCosts") return fin.runningCosts.quotedTotal;
  return 0;
}
function financeTotalActualSpend(q){
  return financeCategoryActual(q,"materials") + financeCategoryActual(q,"labor") + financeCategoryActual(q,"runningCosts");
}
// The quoted money still to come on a job — so "Profit so far" isn't inflated by costs that
// simply haven't happened yet:
//  - materials: the quoted value of everything not yet checked off as ordered;
//  - labour: the quoted labour allowance for the days not yet logged (quoted cost − logged cost);
//  - running costs (incl. plant): the quoted allowance for those same outstanding days, pro rata.
// A finished or cancelled job has nothing still due.
// How much of the quoted labour has been worked (0–1), by logged labour cost.
function financeWorkedFraction(fin){
  const lq = fin.labor.quotedCost||0;
  return lq>0.004 ? Math.min(1, financeLaborActualCost(fin)/lq) : 0;
}
function financeStillDue(q){
  const fin = q.finance;
  const none = {materials:0, labor:0, runningCosts:0, total:0, raw:0};
  if(!fin || q.status==="finished" || q.status==="cancelled") return none;
  const orderedQuoted = sum(fin.materials.checklist.filter(m=>m.ordered).map(m=>Number(m.quotedTotal)||0));
  const materials = Math.max(0, (fin.materials.quotedTotal||0) - orderedQuoted);
  const lq = fin.labor.quotedCost||0;
  const labor = Math.max(0, lq - financeLaborActualCost(fin));
  const rq = fin.runningCosts.quotedTotal||0;
  const runningCosts = lq>0.004 ? rq*(labor/lq) : Math.max(0, rq - financeRunningActual(fin));
  const r2 = n => Math.round(n*100)/100;
  return {materials:r2(materials), labor:r2(labor), runningCosts:r2(runningCosts), total:r2(materials+labor+runningCosts), raw:materials+labor+runningCosts};
}
// Profit is always measured against the job's ex-VAT contracted price (q.totals.subtotal) —
// VAT collected from the customer is never the business's own money, so it plays no part in
// profit, win or lose. Profit so far = price − what's been spent − the quoted allowance still due.
// Running costs (van, fuel, plant…) are rarely logged day by day, so for the days already worked
// they count at the quoted allowance unless more than that has actually been logged.
function financeActualProfit(q){
  const fin = q.finance;
  if(!fin) return Math.round((q.totals.subtotal||0)*100)/100;
  const ranLogged = financeRunningActual(fin);
  const ranWorked = (fin.labor.quotedCost||0)>0.004 ? Math.max(ranLogged, (fin.runningCosts.quotedTotal||0)*financeWorkedFraction(fin)) : ranLogged;
  const spent = financeMaterialsActual(fin) + financeLaborActualCost(fin) + ranWorked;
  // Worked from the quoted margin so pennies of rounding in the quoted baselines can't show a
  // brand-new job as a 1p loss: margin + (what was allowed − what's been spent − what's still due).
  // Billable extras' cost is part of the quote's cost too (it was added to the customer's bill).
  const allowed = (fin.materials.quotedTotal||0) + (fin.labor.quotedCost||0) + (fin.runningCosts.quotedTotal||0)
    + sum((fin.materials.unplanned||[]).filter(m=>m.billable).map(m=>Number(m.cost)||0));
  const due = financeStillDue(q).raw||0;
  // Jobs whose quoted baselines match the quote's cost (all current ones, give or take rounding)
  // use the margin-based form; an older job whose baselines were never refreshed after an edit
  // falls back to price − spent − still due.
  const gap = Math.abs(((q.totals.cost!=null ? q.totals.cost : (q.totals.subtotal||0)-(q.totals.markup||0))) - allowed);
  const p = gap < 0.05
    ? Math.round(((q.totals.markup||0) + allowed - spent - due)*100)/100
    : Math.round(((q.totals.subtotal||0) - spent - due)*100)/100;
  return Math.abs(p) < 0.005 ? 0 : p;
}
function financeQuotedProfit(q){
  return Math.round((q.totals.markup||0)*100)/100;
}
// How current (actual) profit compares to the quoted margin — 1 = exactly on target, >1 = ahead,
// <1 = behind, negative = trading at a loss. Drives the red-to-green indicator's colour/position;
// never shown to the user as a raw number.
function financeProfitMarginRatio(q){
  const quoted = financeQuotedProfit(q);
  const actual = financeActualProfit(q);
  if(quoted<=0.004) return actual>=0 ? 1 : 0;
  return actual/quoted;
}
// Payments received are set against the payment plan in date order (oldest instalment first), so
// each instalment shows as paid, part paid, overdue or due — whether a payment was logged with
// "Mark paid" on the instalment or as a general payment.
function planAllocation(q){
  const dayOf = d => { const v = String(d||''); return v.length>10 ? isoDate(v) : v; };
  const rows = (q.paymentSchedule||[]).map((p,i)=>({p, i, date: dayOf(p.date), amount: Math.round((Number(p.amount)||0)*100)/100}));
  // Billed extras ("Additional work") fall due with the final payment, not the day they're added.
  const planEnd = rows.filter(r=>!/^Additional work: /.test(r.p.label||'')).reduce((m,r)=>r.date>m?r.date:m, '');
  rows.forEach(r=>{ if(/^Additional work: /.test(r.p.label||'') && planEnd && r.date<planEnd) r.date = planEnd; });
  const ordered = rows.slice().sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : a.i-b.i);
  let left = financePaymentsTotal(q);
  const today = isoDate(new Date());
  ordered.forEach(r=>{
    r.paid = Math.max(0, Math.min(r.amount, Math.round(left*100)/100));
    left = Math.round((left - r.paid)*100)/100;
    r.outstanding = Math.round((r.amount - r.paid)*100)/100;
    r.status = r.outstanding<=0.004 ? "paid" : (r.date && r.date < today ? "overdue" : (r.paid>0.004 ? "part" : "due"));
  });
  return rows; // in plan order, each with paid/outstanding/status
}
function financeOverdue(q){
  if(!q.paymentSchedule || q.status==="cancelled" || !["ongoing","finished"].includes(q.status)) return {amount:0, count:0};
  const od = planAllocation(q).filter(r=>r.status==="overdue");
  return {amount: Math.round(sum(od.map(r=>r.outstanding))*100)/100, count: od.length};
}
/* One "materials to order" list per job: every service's materials added together (the same
   sharp sand, cement or screws used by several services become one line), grouped by supplier,
   with each group's order copyable as text to send to that supplier. Ordered status comes from
   the finance tracker's checklist. */
function jobOrderGroups(q){
  const lines = {};
  (q.sections||[]).forEach(s=>(s.materials||[]).forEach(m=>{
    if(!m.name || !(Number(m.qty)>0)) return;
    const k = m.name+'|'+(m.unit||'');
    const sup = (m.supplier||'').trim() || ((S.settings.materials[m.name]||{}).supplier||'').trim() || 'No supplier set';
    const L = lines[k] || (lines[k] = {name:m.name, unit:m.unit||'', qty:0, cost:0, supplier:sup});
    L.qty = Math.round((L.qty + Number(m.qty))*100)/100; L.cost += Number(m.cost)||0;
  }));
  const checklist = (q.finance && q.finance.materials && q.finance.materials.checklist) || [];
  Object.values(lines).forEach(L=>{
    const items = checklist.filter(c=>c.name===L.name && c.source!=="extra");
    L.ordered = items.length && items.every(c=>c.ordered) ? "yes" : (items.some(c=>c.ordered) ? "part" : "no");
  });
  const groups = {};
  Object.values(lines).forEach(L=>{ (groups[L.supplier] = groups[L.supplier]||[]).push(L); });
  return Object.keys(groups).sort((a,b)=> a==='No supplier set' ? 1 : b==='No supplier set' ? -1 : a.localeCompare(b)).map(sup=>({supplier:sup, lines:groups[sup].sort((a,b)=>a.name.localeCompare(b.name))}));
}
function orderText(q, g){
  const fmtQ = n => (Math.round(n*100)/100).toString();
  return `Order for ${q.customer.name||''} (${q.quoteNumber})${q.customer.address?` — delivery to ${q.customer.address}`:''}${q.startDate?`, needed by ${fmtDate(q.startDate)}`:''}:\n` +
    g.lines.map(L=>`- ${fmtQ(L.qty)} ${L.unit} ${L.name}`.replace(/  +/g,' ')).join('\n') + `\n\nThanks, ${q.createdBy||''}${S.settings.company.name?' – '+S.settings.company.name:''}`;
}
function materialsToOrderHtml(q){
  const groups = jobOrderGroups(q);
  if(!groups.length) return '';
  return `<div class="card">
    <h3 style="margin:0 0 4px;font-size:15px;">🧱 Materials to order</h3>
    <div class="hint" style="margin-bottom:8px;">Everything this job needs, with shared items added together and grouped by supplier. Tick items off as ordered in the finance tracker below.</div>
    ${groups.map((g,gi)=>`
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 4px;flex-wrap:wrap;">
        <div style="font-weight:800;font-size:12px;color:var(--green-700);text-transform:uppercase;letter-spacing:.05em;">${esc(g.supplier)}</div>
        <button type="button" class="btn btn-ghost btn-sm" data-action="copyOrder" data-group="${gi}" style="flex:none;">Copy order</button>
      </div>
      <div class="tbl-wrap"><table>
        ${g.lines.map(L=>`<tr><td>${esc(L.name)}</td><td class="num" style="white-space:nowrap;">${L.qty} ${esc(L.unit)}</td><td style="white-space:nowrap;">${L.ordered==="yes"?'<span style="color:var(--ok);font-weight:700;">✓ Ordered</span>':L.ordered==="part"?'<span style="color:var(--warn);font-weight:700;">Part ordered</span>':''}</td></tr>`).join('')}
      </table></div>`).join('')}
  </div>`;
}
function paymentTrackingHtml(q){
  if(!q.finance || !q.paymentSchedule || !q.paymentSchedule.length) return '';
  const rows = planAllocation(q);
  const label = r => r.status==="paid" ? `<span style="color:var(--ok);font-weight:700;">Paid</span>`
    : r.status==="overdue" ? `<span style="color:var(--danger);font-weight:700;">Overdue${r.paid>0.004?` (${gbp(r.outstanding)} left)`:''}</span>`
    : r.status==="part" ? `<span style="color:var(--warn);font-weight:700;">${gbp(r.outstanding)} left</span>` : `<span class="hint" style="margin:0;">Due</span>`;
  const od = financeOverdue(q);
  return `<div class="card">
    <h3 style="margin:0 0 4px;font-size:15px;">Payments against the plan</h3>
    <div class="hint" style="margin-bottom:8px;">Payments received are matched to instalments oldest first.${od.count?` <b style="color:var(--danger);">${gbp(od.amount)} overdue.</b>`:''}</div>
    ${rows.map(r=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);">
        <div style="min-width:0;">
