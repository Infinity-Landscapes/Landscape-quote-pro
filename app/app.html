          <div style="font-weight:600;">${esc(r.p.label)}</div>
          <div class="hint" style="margin:0;">Due ${fmtDate(r.p.date)} · ${gbp(r.amount)} · ${label(r)}</div>
        </div>
        ${r.status!=="paid" && q.status!=="cancelled" ? `<button class="btn btn-ghost btn-sm" data-action="markInstalmentPaid" data-idx="${r.i}" style="flex:none;">Mark paid</button>` : ''}
      </div>`).join('')}
  </div>`;
}
function financePaymentsTotal(q){
  return q.finance ? Math.round(sum(q.finance.payments.map(p=>Number(p.amount)||0))*100)/100 : 0;
}
function financeScheduleTotal(q){
  return Math.round(sum((q.paymentSchedule||[]).map(p=>Number(p.amount)||0))*100)/100;
}
function financeAmountOwed(q){
  return Math.max(0, Math.round((financeScheduleTotal(q) - financePaymentsTotal(q))*100)/100);
}
const FINANCE_CATEGORY_LABEL = {materials:"materials", labor:"labour", runningCosts:"running costs"};
// Called after any action that could push a category's actual spend up — pops a one-off alert
// (never repeats for the same category on the same job) the moment it crosses 80% of quoted.
function checkOverrun(q, category){
  if(!q.finance) return;
  const quoted = financeCategoryQuoted(q, category);
  if(quoted<=0.004) return;
  const actual = financeCategoryActual(q, category);
  if(actual/quoted>=0.8 && !q.finance.overrunAlertsShown[category]){
    q.finance.overrunAlertsShown[category] = true;
    showAlert(`Heads up — ${q.customer.name?esc(q.customer.name):'this job'}'s ${FINANCE_CATEGORY_LABEL[category]} spend has reached ${Math.round(actual/quoted*100)}% of what was quoted.`);
  }
}
// A material added mid-job outside the original quote, flagged as a billable extra: adds it to
// the customer's invoice (the payment schedule) at cost plus the job's usual mark-up and VAT
// treatment, and keeps the quote's own totals consistent with the new schedule total.
// The mark-up and VAT rate a quote was priced at (stored on the quote since Oct 2026; older
// quotes fall back to the mark-up implied by their own totals, and the current VAT rate).
function quoteMarkupRate(q){
  if(q.markupPercent!=null) return (Number(q.markupPercent)||0)/100;
  const t = q.totals||{}; return (t.cost>0.004) ? (t.markup||0)/t.cost : (S.settings.markupPercent||0)/100;
}
function quoteVatRate(q){
  if(q.vatRegistered===false) return 0;
  return q.vatRate!=null ? Number(q.vatRate)||0 : (Number(S.settings.vatRate)||0);
}
// What a customer-facing extras line costs them: cost × (1 + mark-up), plus VAT when charged.
function extraSellPrice(q, e){
  const cost = e.cost!=null ? (Number(e.cost)||0) : extraParts(e).materials;
  return Math.round(cost*(1+quoteMarkupRate(q))*(1+quoteVatRate(q))*100)/100;
}
// Adds a billable extra's cost into a quote's totals (at the quote's mark-up and VAT); returns
// the gross amount added. Used when it's first billed and again whenever the quote is rebuilt
// (editing a job), so a billed extra never drops out of the total.
function applyBillableToTotals(q, actualCost){
  const exVat = Math.round(actualCost*(1+quoteMarkupRate(q))*100)/100;
  const vat = Math.round(exVat*quoteVatRate(q)*100)/100;
  const gross = Math.round((exVat+vat)*100)/100;
  q.totals.cost = Math.round(((q.totals.cost||0)+actualCost)*100)/100;
  q.totals.extrasTotal = Math.round(((q.totals.extrasTotal||0)+actualCost)*100)/100;
  q.totals.markup = Math.round(((q.totals.markup||0)+(exVat-actualCost))*100)/100;
  q.totals.subtotal = Math.round(((q.totals.subtotal||0)+exVat)*100)/100;
  q.totals.vat = Math.round(((q.totals.vat||0)+vat)*100)/100;
  q.totals.total = Math.round(((q.totals.total||0)+gross)*100)/100;
  return gross;
}
function addBillableExtraToInvoice(q, name, actualCost){
  const gross = applyBillableToTotals(q, actualCost);
  if(!q.paymentSchedule) q.paymentSchedule = [];
  q.paymentSchedule.push({label:`Additional work: ${name}`, date: new Date().toISOString().slice(0,10), amount: gross});
  return gross;
}

/* =========================================================================
   FINANCE TRACKER UI — rendered on the job (quote) detail screen once q.finance exists.
   ========================================================================= */
function financeChecklistItemHtml(q, m){
  const variance = m.ordered ? Math.round((m.quotedTotal-(m.actualTotal||0))*100)/100 : null;
  return `<div class="row" style="align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--line-soft);">
    <input type="checkbox" style="margin-top:3px;" ${m.ordered?'checked':''} data-action="toggleChecklistItem" data-id="${esc(m.id)}">
    <div style="flex:1;min-width:0;">
      <div style="font-weight:600;">${esc(m.name)}${m.sectionLabel?` <span class="hint" style="font-weight:400;">(${esc(m.sectionLabel)})</span>`:''}</div>
      <div class="hint">Quoted: ${m.quotedQty?`${m.quotedQty} ${esc(m.unit||'')} — `:''}${gbp(m.quotedTotal)}${m.ordered?` · Paid: ${gbp(m.actualTotal)} · <span style="${variance<0?'color:var(--danger);':'color:var(--ok);'}">${variance<0?'over by '+gbp(Math.abs(variance)):'under by '+gbp(Math.abs(variance))}</span>`:''}</div>
    </div>
  </div>`;
}
function financeUnplannedItemHtml(m){
  return `<div class="row" style="align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--line-soft);">
    <div style="flex:1;min-width:0;">
      <div style="font-weight:600;">${esc(m.name)} <span class="hint" style="font-weight:400;">(unplanned)</span>${m.billable?'<span class="overrun-badge" style="background:var(--ok-bg);color:var(--ok);">BILLED TO CUSTOMER</span>':''}</div>
      <div class="hint">Cost: ${gbp(m.cost)}</div>
    </div>
  </div>`;
}
function financeTrackerHtml(q){
  const fin = q.finance;
  const ratio = financeProfitMarginRatio(q);
  const barPct = Math.round(Math.max(0, Math.min(1, ratio))*100);
  const actualProfit = financeActualProfit(q);
  const quotedProfit = financeQuotedProfit(q);
  const due = financeStillDue(q);
  const categories = [["materials","Materials"],["labor","Labour"],["runningCosts","Running costs &amp; plant"]];
  const owed = financeAmountOwed(q);
  const paid = financePaymentsTotal(q);
  const scheduleTotal = financeScheduleTotal(q);
  const vatOn = S.settings.vatRegistered!==false;
  return `
  <div class="card">
    <h3 style="margin:0 0 4px;font-size:15px;">💰 Job finance tracker</h3>
    <div class="hint" style="margin-bottom:10px;">Actual costs vs. the original quote, updated live as you log spend.</div>

    <div class="hint" style="display:flex;justify-content:space-between;margin-bottom:2px;">
      <span>Profit so far</span>
      <span style="font-weight:800;${actualProfit<0?'color:var(--danger);':''}">${gbp(actualProfit)}</span>
    </div>
    <div class="profit-bar"><div class="marker" style="left:${barPct}%;"></div></div>
    <div class="hint" style="margin-bottom:${due.total>0.004?'2':'14'}px;">Quoted margin: ${gbp(quotedProfit)}</div>
    ${due.total>0.004 ? `<div class="hint" style="margin-bottom:14px;">Allows ${gbp(due.total)} still to come — materials not yet ordered ${gbp(due.materials)} · labour for days not yet worked ${gbp(due.labor)} · running costs for those days ${gbp(due.runningCosts)}</div>` : ''}

    <div class="tbl-wrap"><table>
      <tr><th>Category</th><th class="num">Quoted</th><th class="num">Actual</th><th class="num">Variance</th></tr>
      ${categories.map(([key,label])=>{
        const quoted = financeCategoryQuoted(q,key);
        const actual = financeCategoryActual(q,key);
        const variance = Math.round((quoted-actual)*100)/100;
        const overrun = quoted>0.004 && actual/quoted>=0.8;
        return `<tr>
          <td>${label}${overrun?`<span class="overrun-badge">${actual>quoted?'OVER':'80%+'}</span>`:''}</td>
          <td class="num">${gbp(quoted)}</td>
          <td class="num">${gbp(actual)}</td>
          <td class="num" style="${variance<0?'color:var(--danger);':'color:var(--ok);'}">${variance<0?'-':'+'}${gbp(Math.abs(variance))}</td>
        </tr>`;
      }).join('')}
    </table></div>

    <h4 style="margin:18px 0 8px;font-size:13.5px;">Materials checklist</h4>
    ${(fin.materials.checklist.length===0 && fin.materials.unplanned.length===0) ? `<div class="hint">No quoted materials on this job.</div>` : ''}
    ${fin.materials.checklist.map(m=>financeChecklistItemHtml(q,m)).join('')}
    ${fin.materials.unplanned.map(m=>financeUnplannedItemHtml(m)).join('')}
    <div class="hint" style="margin-top:8px;display:flex;justify-content:space-between;"><span>Materials running total</span><span style="font-weight:700;">${gbp(financeMaterialsActual(fin))} spent / ${gbp(fin.materials.quotedTotal)} quoted</span></div>
    <button class="btn btn-ghost btn-block" style="margin-top:8px;" data-action="addUnplannedMaterial">+ Add unplanned material</button>

    <h4 style="margin:18px 0 8px;font-size:13.5px;">Daily labour log</h4>
    <div class="hint" style="margin-bottom:6px;">Quoted: ${financeQuotedPersonDays(fin).toFixed(2)} person-days (${gbp(fin.labor.quotedCost)}) · Logged: ${financeLaborActualDays(fin).toFixed(2)} person-days (${gbp(financeLaborActualCost(fin))})</div>
    ${fin.labor.log.length? `<div class="tbl-wrap"><table><tr><th>Date</th><th>Person</th><th class="num">Hours</th></tr>${fin.labor.log.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(e.person)}</td><td class="num">${e.hours}</td></tr>`).join('')}</table></div>` : `<div class="hint">No labour logged yet.</div>`}
    <button class="btn btn-ghost btn-block" style="margin-top:8px;" data-action="addLaborEntry">+ Log labour</button>

    <h4 style="margin:18px 0 8px;font-size:13.5px;">Running costs &amp; plant hire</h4>
    <div class="hint" style="margin-bottom:6px;">Quoted: ${gbp(fin.runningCosts.quotedTotal)} · Actual: ${gbp(financeRunningActual(fin))}</div>
    ${fin.runningCosts.entries.length? `<div class="tbl-wrap"><table><tr><th>Description</th><th class="num">Amount</th></tr>${fin.runningCosts.entries.map(e=>`<tr><td>${esc(e.description)}</td><td class="num">${gbp(e.amount)}</td></tr>`).join('')}</table></div>` : `<div class="hint">No running costs logged yet.</div>`}
    <button class="btn btn-ghost btn-block" style="margin-top:8px;" data-action="addRunningCostEntry">+ Add running cost</button>

    <h4 style="margin:18px 0 8px;font-size:13.5px;">Payments received</h4>
    <div class="hint" style="margin-bottom:6px;">Owed: ${gbp(owed)} · Paid: ${gbp(paid)} of ${gbp(scheduleTotal)}</div>
    ${fin.payments.length? `<div class="tbl-wrap"><table><tr><th>Date</th><th>Note</th><th class="num">Amount</th>${vatOn?'<th class="num">VAT set aside</th>':''}</tr>${fin.payments.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(p.note||'')}</td><td class="num">${gbp(p.amount)}</td>${vatOn?`<td class="num">${gbp(p.vatSetAside||0)}</td>`:''}</tr>`).join('')}</table></div>` : `<div class="hint">No payments logged yet.</div>`}
    <button class="btn btn-ghost btn-block" style="margin-top:8px;" data-action="addPayment">+ Log payment received</button>
  </div>`;
}
/* Freeform, timestamped notes per job — delays, delivery issues, anything worth jotting down. */
function activityLogHtml(q){
  const log = q.activityLog||[];
  return `<div class="card">
    <h3 style="margin:0 0 10px;font-size:15px;">📝 Activity log</h3>
    ${log.length===0?`<div class="hint" style="margin-bottom:10px;">No notes yet.</div>`:`
    <div class="stack" style="gap:10px;margin-bottom:10px;">
      ${log.map(n=>`<div style="border-left:3px solid var(--line-soft);padding-left:10px;">
        <div class="hint">${fmtDate(n.at)}</div>
        <div>${esc(n.text)}</div>
      </div>`).join('')}
    </div>`}
    <button class="btn btn-ghost btn-block" data-action="addActivityNote">+ Add note</button>
  </div>`;
}

/* =========================================================================
   DEFAULT SETTINGS
   ========================================================================= */
function defaultSettings(){
  const materials = {};
  // Oct 2026: a brand-new business starts with the full materials list but no prices or
  // suppliers — every figure is theirs to fill in (in Materials, or straight from a quote when
  // something has no price). Infinity's own prices are restored if setup is done for Infinity
  // itself (see applyInfinityDefaults).
  DEFAULT_MATERIALS.forEach(m=>{ materials[m.name] = {unit:m.unit, section:m.section, price:0, supplier:'', vatIncluded:m.vatIncluded!==false}; });
  return {
    onboarded:false,
    pin:"",
    company:{
      // Blank for every new tenant — each business fills these in during setup step 1.
      // (The one pre-existing business gets its real details carried over by the
      // one-time migration in loadAll(), never from these defaults.)
      name:"",
      number:"",
      email:"",
      phone:"",
      address:"",
      vatNo:"",
      bankName:"", sortCode:"", accountNumber:"",
    },
    servicesEnabled: SERVICE_ORDER.filter(k=>!TENANT_ONLY_SERVICES.has(k)),
    // October 2026: Resin bound is no longer a standard service for new businesses (see
    // TENANT_ONLY_SERVICES); a brand-new business starts with none of the extras.
    extraServices: [],
    servicesSeen: SERVICE_ORDER.filter(k=>!TENANT_ONLY_SERVICES.has(k)),
    customServices: [],   // services this business added themselves, beyond the built-in catalogue — {key,label,group}
    materials,
    dayRatePerPerson: 0,     // set in setup step 3
    expensesPerDay: 0,       // set in setup step 3
    // Branding: Infinity keeps its built-in logo, footer, greens and letter wording; any other
    // business uses its own uploaded logo/colour and neutral, editable letter wording.
    brandInfinity: false,
    brandColor: null,
    signOffName: "",
    letterTemplate: {},      // business-level letter wording overrides — see letterTemplate()
    serviceWording: {},      // per-service custom letter lines — see sectionLetterLines()
    expensesIncludeVat: true,
    // Running cost calculator (Settings → Pricing): the business's own cost lines, each with a
    // frequency, converted to a per-working-day figure — see rcDaily. Weekly ÷ 5; monthly and
    // annual divide by these two editable working-day counts (250 = 50 weeks × 5 days).
    runningCostItems: [],
    rcDaysPerMonth: 20,
    rcDaysPerYear: 250,
    vatRegistered: true,
    vatRate: 0.2,
    markupPercent: 0,   // profit margin added on top of cost before VAT — 0 keeps existing totals unchanged until set
    weeklyPaymentAmount: 4000,
    // Which days of the week the crew actually works — index = JS Date.getDay() (0=Sun…6=Sat).
    // Drives calendar job scheduling (see scheduleWorkingDays) instead of a hardcoded Mon–Fri.
    workingDays: [false,true,true,true,true,true,false],
    // Usual site hours, quoted on the letter alongside the ticked working days.
    workStart: "07:30",
    workEnd: "15:30",
    // A sent quote with no reply is flagged "needs chasing" this many days after it was sent (or
    // last chased) — see quoteNeedsChasing.
    chaseAfterDays: 7,
    // Teams/crews — every job and calendar entry is assigned to one (see teamId), and each
    // team's schedule is checked for clashes independently of every other team's (see
    // blockedDateSet). A brand-new tenant starts with one team so there's always somewhere to
    // assign a job without first visiting Settings.
    teams: [{id:uid(), name:"Team 1", staff:[]}],
    quoteCounter: 0,
    emailStyle: "full", // "full" = write the whole quote into the email; "short" = brief note + attach the PDF yourself
    // Every figure below is now per-person-per-day (except the two machine-driven waste rates,
    // which don't scale with headcount) — see each SERVICES[key].calc. These were converted from
    // the old crew-level figures by dividing by 3, matching the quote wizard's default headcount
    // (the "people on site" field defaults to 3), so a 3-person crew sees the same real-world
    // days as before; adjust them here if your crews are typically a different size.
    productivity: {
      turf:16.7, paving:6, blockpaving:5, compositedecking:2.7, timberdecking:2.7, gravel:16.7,
      brickwall:2.7, sleeperwall:10, closeboardfencing:5, timberpanelfencing:8.3, compositefencing:6.7,
      waterfeatures:0.7, pond:16.7, resinbound:5, steeledging:10, flowerbeds:6.7, artificialturf:5,
      pergola:16.7, concretebase:5,
      // Paving's and Block paving's second labour rate — edging, laid separately from the main

      pavingEdging:12,

function ctxFor(settings, peopleOnSite){
  // dayRatePerPerson is what ONE person costs for a day. Every service works out how many
  // total person-days a job needs (see each SERVICES[key].calc and calcWasteRemoval), and
  // labour cost is that many person-days times this single-person rate — never multiplied
  // again by headcount here. Putting more people on the job divides those person-days into
  // fewer calendar days (see priceSection), shortening the schedule without changing the bill.
  const peopleCount = peopleOnSite||1;
  const dayRatePerPerson = settings.dayRatePerPerson||0;
  // A non-VAT-registered business doesn't charge VAT at all, so the whole pricing pipeline
  // treats the rate as 0 — which also correctly leaves vatIncluded-true supplier prices
  // un-stripped below (netOf divides by 1+0), since a business that can't reclaim VAT from
  // HMRC really does pay the full VAT-inclusive price as its net cost.
  const vatRate = settings.vatRegistered===false ? 0 : settings.vatRate;
  // Some material and running-cost prices are entered VAT-inclusive (what the supplier
  // actually charged) — strip that embedded VAT back out before it feeds the quote's own
  // subtotal, so the 20% VAT charged to the customer isn't applied a second time on top
  // of VAT that's already baked into a cost figure.
  const netOf = (price, vatIncluded) => vatIncluded ? (price||0)/(1+vatRate) : (price||0);
  return {
    price:(name)=> { const m = settings.materials[name]; return m ? netOf(m.price, m.vatIncluded) : 0; },
    unit:(name)=> (settings.materials[name] ? settings.materials[name].unit : ''),
    peopleOnSite: peopleCount, dayRatePerPerson, expensesPerDay: netOf(settings.expensesPerDay, settings.expensesIncludeVat), vatRate,

    turfTopsoilBaselineCoverage: settings.turfTopsoilBaselineCoverage!=null ? settings.turfTopsoilBaselineCoverage : 10,

/* Gmail (the viewer's own claude.ai connector, via the "mcp" capability) — used only to put a
   DRAFT in their Gmail with the quote PDF attached; nothing is ever sent from the app. null when
   this view can't reach connectors (preview, not granted). Resolved once, early, in loadAll. */
let _mcpPromise = null;
function getMcp(){
  if(!_mcpPromise) _mcpPromise = (async()=>{ try{ return await claude.use("mcp"); }catch(e){ return null; } })();
  return _mcpPromise;
}
function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(String(r.result).split(',')[1]||'');
    r.onerror = ()=>reject(r.error||new Error("Couldn't read the PDF"));
    r.readAsDataURL(blob);
  });
}
function gmailErrorText(e){
  const code = e && e.code;
  if(code==="server_not_connected" || code==="server_not_found") return "Gmail isn't connected to your Claude account. Add it in claude.ai Settings → Connectors, then try again.";
  if(code==="needs_reauth") return "Your Gmail connection needs signing in again — reconnect Gmail in claude.ai Settings → Connectors, then try again.";
  if(code==="selection_required") return "You have more than one Gmail connected — choose which one to use when Claude asks, then try again.";
  if(code==="not_in_manifest" || code==="not_granted" || code==="consent_required") return "Gmail wasn't allowed for this app. Tap the button again and choose Allow when asked.";
  if(code==="blocked_by_policy" || code==="approval_required") return "Your organisation's settings don't allow this app to use Gmail.";
  if(code==="capability_disabled" || code==="capability_removed") return "Gmail can't be reached from this view of the app.";
  if(code==="tool_error") return "Gmail refused the draft: " + ((e && e.message) || "unknown reason") + ".";
  if(code==="too_big") return `The PDF is still ${Math.round((e.size||0)/1024)} KB after shrinking it, which is too big to attach this way — use Download PDF and attach it in Gmail yourself.`;
  if(code==="bad_request" || code==="transform_error") return "Gmail couldn't take the draft: " + ((e && e.message) || "the request was refused") + ". Use Download PDF and attach it yourself.";
  return "Gmail didn't answer just now. Check your Gmail drafts before trying again — the draft may already be there.";
}

    }catch(e){}

     in-progress draft) as their own tenant; the legacy doc is then marked claimed so it's

    if(!settings.sleeperProducts.length) settings.sleeperProducts.push({id:uid(), name:"Sleeper", price:9, lengthMm:2400, heightMm:200, vatIncluded:true});
    if(!settings.sleeperScrews.length) settings.sleeperScrews.push({id:uid(), name:"Box of 150mm hex head timber screws", price:24.84, screwsPerBox:25, vatIncluded:true});
    settings.sleeperSeeded = true;
    await saveSettings({sleeperProducts: settings.sleeperProducts, sleeperScrews: settings.sleeperScrews, sleeperSeeded: true});
  }
  // anyone with settings saved before "+ Add other…" material dropdowns existed
  if(!settings.customStyleOptions) settings.customStyleOptions = {};
  if(!settings.productivity) settings.productivity = {};
  // September 2026: productivity was redefined from a whole-crew daily rate to a per-PERSON
  // daily rate — calendar time now divides across however many people are on a job, and labour
  // cost no longer multiplies by headcount (see ctxFor/priceSection). Anyone with rates already
  // saved under the old crew-based definition gets those converted once here, by dividing by 3
  // (the quote wizard's long-standing default "people on site"), so a 3-person crew sees the
  // same real-world days as before. Guarded by productivityIsPerPerson so it only ever runs
  // once per business — a brand-new tenant already starts flagged (defaultSettings()), so this
  // never touches an already-correct, never-saved-under-the-old-definition set of rates. The two
  // machine-driven waste rates (digger/grab hire) were never crew-based, so they're left alone.
  if(!settings.productivityIsPerPerson){
    Object.keys(settings.productivity).forEach(k=>{
      if(k==="wasteDigger" || k==="wasteGrab") return;
      if(typeof settings.productivity[k]==="number") settings.productivity[k] = Math.round((settings.productivity[k]/3)*10)/10;
    });
    settings.productivityIsPerPerson = true;
    await saveSettings({productivity: settings.productivity, productivityIsPerPerson: true});
  }
  // merge in productivity defaults for anyone with settings saved before this feature existed
  // (or a new service added since) — never overwrites an already-set, now-per-person rate above
  Object.entries(defaultSettings().productivity).forEach(([k,v])=>{ if(settings.productivity[k]==null) settings.productivity[k]=v; });
  // October 2026: clearance labour's default productivity changed from 23.3 to 20 m²/day/person
  // (see calcWasteRemoval) — nudge anyone still sitting on the untouched old default forward
  // too, but leave alone anyone who's already set their own rate.
  if(settings.productivity.wasteLabour===23.3) settings.productivity.wasteLabour = 20;
  // October 2026: the old hardcoded WASTE_ELIGIBLE list became a tenant-editable per-service
  // "generates spoil?" flag, and the old blanket 150mm dig-out assumption became a per-service
  // editable default — seed both from defaultSettings() for anyone who doesn't have them yet,
  // so an existing business keeps exactly the same waste-removal totals as before (aside from
  // Pond and Block Retaining Wall newly joining the pool, and their standalone digger lines
  // going away, which applies to everyone per the same update) until they choose to change
  // something themselves.
  if(!settings.generatesSpoil) settings.generatesSpoil = {};
  Object.entries(defaultSettings().generatesSpoil).forEach(([k,v])=>{ if(settings.generatesSpoil[k]==null) settings.generatesSpoil[k]=v; });
  if(!settings.digOutDepthDefaults) settings.digOutDepthDefaults = {};
  Object.entries(defaultSettings().digOutDepthDefaults).forEach(([k,v])=>{ if(settings.digOutDepthDefaults[k]==null) settings.digOutDepthDefaults[k]=v; });
  if(settings.diggerBlockDays==null) settings.diggerBlockDays = 5;
  // Block paving's default per-row dig-out depth moved from 180 to 250mm — nudge anyone still on
  // the untouched old default forward, same as clearance labour's rate above.
  if(settings.digOutDepthDefaults.blockpaving===180) settings.digOutDepthDefaults.blockpaving = 250;
  // Pond's default dig-out depth (now per row) moved from 400 to 600mm — same nudge.
  if(settings.digOutDepthDefaults.pond===400) settings.digOutDepthDefaults.pond = 600;
  // Concrete base's depth is now the full dig-out (MOT + concrete) per row, default 200mm.
  if(settings.digOutDepthDefaults.concretebase===100) settings.digOutDepthDefaults.concretebase = 200;
  // September 2026 service-catalogue rebuild (19 services): drop retired keys — split into
  // new services or superseded by one — from anyone's enabled list, and switch on the
  // newly-added services by default (same "pulled straight from your calculator" treatment
  // new tenants already get from defaultSettings().servicesEnabled).
  const RETIRED_SERVICE_KEYS = ["decking","fencing","metalbeds","sleeperbeds","closeboardfencing","timberpanelfencing","compositefencing"];
  settings.servicesEnabled = (settings.servicesEnabled||[]).filter(k=>!RETIRED_SERVICE_KEYS.includes(k));
  // A business saved before extraServices existed is the pre-existing business — it keeps Resin
  // bound, which new businesses no longer get.
  const extrasMissing = !Array.isArray(settings.extraServices);
  if(extrasMissing) settings.extraServices = ["resinbound"];
  // Switch on built-in services this business hasn't seen before, but only once: servicesSeen
  // records every service ever offered to it, so one it has switched off stays off (previously
  // every load switched every service back on). A business saved before servicesSeen existed is
  // treated as having seen what it was offered, after this one last top-up.
  const avail = availableServiceKeys(settings);
  const firstSeen = !Array.isArray(settings.servicesSeen);
  if(firstSeen) settings.servicesSeen = [];
  let seenChanged = false;
  avail.forEach(k=>{
    if(!settings.servicesSeen.includes(k)){
      if(!settings.servicesEnabled.includes(k)) settings.servicesEnabled.push(k);
      settings.servicesSeen.push(k); seenChanged = true;
    }
  });
  if((extrasMissing || seenChanged) && bizDoc && settings.onboarded){
    try{ await saveSettings({servicesEnabled: settings.servicesEnabled, servicesSeen: settings.servicesSeen, extraServices: settings.extraServices}); }catch(e){}
  }
  settings.servicesEnabled = settings.servicesEnabled.filter(k=>avail.includes(k) || !SERVICES[k] || !!(settings.customServices||[]).find(cs=>cs.key===k) || !SERVICE_ORDER.includes(k));
  // anyone with settings saved before the "includes VAT" toggle existed — default to true,
  // since this business's supplier prices and running-cost rate already include VAT
  Object.keys(settings.materials).forEach(name=>{ if(settings.materials[name].vatIncluded===undefined) settings.materials[name].vatIncluded = true; });
  if(settings.expensesIncludeVat===undefined) settings.expensesIncludeVat = true;
  // anyone with settings saved before the VAT-registered toggle existed — default to true,
  // since this business already charges and shows VAT throughout
  if(settings.vatRegistered===undefined) settings.vatRegistered = true;
  // anyone with settings saved before the configurable working week existed — default to
  // the Mon–Fri assumption job scheduling always used to make
  if(!Array.isArray(settings.workingDays) || settings.workingDays.length!==7) settings.workingDays = [false,true,true,true,true,true,false];
  // anyone with settings saved before teams/crews existed — everything they've scheduled so
  // far was effectively one implicit team, so give them a single starting team to assign it to
  // A business whose teams were never saved got a brand-new "Team 1" id on every load, so jobs
  // lost track of their crew — create it once and save it (see the save just after quotes load).
  if(!Array.isArray(settings.teams) || settings.teams.length===0){ settings.teams = [{id:uid(), name:"Team 1", staff:[]}]; settings._teamsUnsaved = true; }
  // anyone with settings saved before "add a service" existed
  if(!settings.customServices) settings.customServices = [];
  // migrate the old boolean waste flag (pre rate-per-item waste pricing) — we can't invent a
  // waste item/rate for it, so just turn waste removal off rather than guess
  settings.customServices.forEach(cs=>{ if(cs.waste===true) cs.waste = null; });
  S.settings = settings;
  registerCustomServices();
  refreshGenericSpoilOptions();

  if(bizDoc){
    try{
      const qsnap = await bizDoc.collection("quotes").orderBy("createdAt","desc").limit(1000).get();
      S.quotes = qsnap.docs.map(d=>deepClone(d.data()));
    }catch(e){ S.quotes = []; }
  }

  if(bizDoc){
    try{
      const csnap = await bizDoc.collection("calendarEntries").orderBy("date","asc").limit(500).get();
      S.calendarEntries = csnap.docs.map(d=>deepClone(d.data()));
    }catch(e){ S.calendarEntries = []; }
  }

  // Backfill a team onto any already-scheduled job or calendar entry saved before teams
  // existed — otherwise blockedDateSet's per-team matching would treat them as belonging to
  // no team at all, silently stopping them from blocking (or being blocked by) anything, which
  // would let a brand-new job double-book straight over an old one. A quote that hasn't been
  // accepted yet (no scheduledDays) doesn't need one — it gets a team when it's accepted.
  if(S.settings._brandFlagNew){ delete S.settings._brandFlagNew; if(S.settings.onboarded) await saveSettings({brandInfinity: S.settings.brandInfinity}); }
  // This business's own logo (kept in its own document) and colours.
  if(bizDoc){ try{ const ls = await bizDoc.collection("branding").doc("logo").get(); S.logo = (ls.exists && ls.data() && ls.data().dataUrl) || null; }catch(e){ S.logo = null; } }
  applyBrandTheme();
  if(S.settings._teamsUnsaved){ delete S.settings._teamsUnsaved; if(S.settings.onboarded) await saveSettings({teams: S.settings.teams}); }
  const fallbackTeamId = (S.settings.teams && S.settings.teams[0]) ? S.settings.teams[0].id : null;
  if(fallbackTeamId){
    for(const q of S.quotes){
      // No team, or a team id that no longer exists (e.g. from the unsaved-team bug above).
      if((q.teamId==null || !teamById(q.teamId)) && q.scheduledDays && q.scheduledDays.length){
        q.teamId = fallbackTeamId;
        await saveQuote(q);
      }
    }
    for(const e of S.calendarEntries){
      if(e.teamId==null || !teamById(e.teamId)){
        e.teamId = fallbackTeamId;
        await saveCalendarEntry(e);
      }
    }
  }

  if(bizDoc && settings.onboarded){
    try{
      const dsnap = await bizDoc.collection("drafts").doc("current").get();
      if(dsnap.exists && dsnap.data() && dsnap.data().draft){
        S._savedDraft = deepClone(dsnap.data().draft);
        S._savedEditingQuoteId = dsnap.data().editingQuoteId || null;
      }
    }catch(e){}
  }

  S.screen = settings.onboarded ? "login" : "setup";
  render();
}

/* Pass `partial` (just the fields this action changed) whenever possible — this business's
   settings can be open in more than one tab/device at once, and db.set() is a full-document
   replace, so a save from a stale tab can silently wipe out a change another tab just made
   to a DIFFERENT field (e.g. saving Materials from one tab resetting a Pricing field someone
   else just set). update() merges nested objects instead of replacing the whole document, so
   a save only touches the fields it actually changed. Falls back to a full set() when there's
   no partial (onboarding, where the document may not exist yet) or if update() rejects because
   the document genuinely doesn't exist yet. */
/* The store only takes plain JSON — a Date object, for one, makes the whole write fail. Every
   write goes through toStorable (Dates become ISO strings, undefined values are dropped), and a
   write that still fails is reported instead of silently swallowed: an accepted job whose save
   failed used to look fine on screen, then reload as "awaiting approval". */
function toStorable(o){ return deepClone(o); }
let _saveFailShownAt = 0;
function reportSaveFailure(what, err){
  try{ console.warn("Save failed:", what, err); }catch(e){}
  if(Date.now() - _saveFailShownAt < 15000) return; // one warning per burst
  _saveFailShownAt = Date.now();
  const msg = `${what} couldn't be saved to your account${err && err.code ? ` (${err.code})` : ''}. It's still on this screen, but it will be lost if the app is reloaded — check your connection and try that step again.`;
  if(!S._modal){ S._modal = {type:"alert", message:msg}; setTimeout(()=>{ if(S._modal && S._modal.message===msg) render(); }, 0); }
}
async function saveSettings(partial){
  const doc = businessDoc();
  if(!doc) return;
  if(partial){
    try{ await doc.update(toStorable(partial)); return; }catch(e){}
  }
  try{ await doc.set(toStorable(S.settings)); }catch(e){ reportSaveFailure("Your settings", e); }
}
// Returns false when the write failed (the quote is still kept in memory for this session).
async function saveQuote(q){
  const doc = businessDoc();
  let ok = true;
  if(doc){ try{ await doc.collection("quotes").doc(q.id).set(toStorable(q)); }catch(e){ ok = false; reportSaveFailure(`Quote ${q.quoteNumber||''}`.trim(), e); } }
  const idx = S.quotes.findIndex(x=>x.id===q.id);
  if(idx>=0) S.quotes[idx]=q; else S.quotes.unshift(q);
  return ok;
}
async function deleteQuoteRemote(id){
  const doc = businessDoc();
  if(doc){ try{ await doc.collection("quotes").doc(id).delete(); }catch(e){ reportSaveFailure("The delete", e); return false; } }
  S.quotes = S.quotes.filter(q=>q.id!==id);
  return true;
}
/* Manually-added calendar entries — not linked to any quote/job. See CALENDAR SCHEDULING. */
async function saveCalendarEntry(e){
  const doc = businessDoc();
  if(doc){ try{ await doc.collection("calendarEntries").doc(e.id).set(toStorable(e)); }catch(err){ reportSaveFailure("That calendar entry", err); } }
  const idx = S.calendarEntries.findIndex(x=>x.id===e.id);
  if(idx>=0) S.calendarEntries[idx]=e; else S.calendarEntries.push(e);
}
async function deleteCalendarEntryRemote(id){
  const doc = businessDoc();
  if(doc){ try{ await doc.collection("calendarEntries").doc(id).delete(); }catch(err){} }
  S.calendarEntries = S.calendarEntries.filter(e=>e.id!==id);
}

/* ---- in-progress quote draft: auto-saved so nothing typed is ever lost ----
   Saves are debounced while typing (so we're not hitting the db on every keystroke),
   but that leaves a short window where a step change or edit hasn't reached the db yet —
   on a phone, switching apps or letting the tab go to the background can suspend JS
   before that timer fires, so the most recent progress never gets saved and "resume"
   picks up an older, or completely empty, draft. To close that gap: (a) a click-driven
   save (finishing a step, toggling a service, etc.) writes right away instead of waiting,
   since clicks are discrete events with nothing to coalesce, and (b) visibilitychange/
   pagehide/beforeunload force any still-pending debounced save out immediately. */
let _draftSaveTimer = null;
let _pendingDraftSave = null; // {snapshot, editingQuoteId} captured but not yet written
async function writeDraftSnapshot(snapshot, editingQuoteId){
  const doc = businessDoc();
  if(!doc) return;
  try{ await doc.collection("drafts").doc("current").set(toStorable({draft: snapshot, editingQuoteId, savedAt: new Date().toISOString()})); }catch(e){ try{ console.warn("Draft save failed", e); }catch(_){} }
}
function scheduleDraftSave(immediate){
  if(!db || !tenantUid || !S.draft || S._tour) return;
  clearTimeout(_draftSaveTimer);
  const snapshot = deepClone(S.draft);
  const editingQuoteId = S.editingQuoteId || null;
  _pendingDraftSave = {snapshot, editingQuoteId};
  if(immediate){
    const p = _pendingDraftSave; _pendingDraftSave = null;
    writeDraftSnapshot(p.snapshot, p.editingQuoteId);
    return;
  }
  _draftSaveTimer = setTimeout(()=>{
    const p = _pendingDraftSave; _pendingDraftSave = null;
    writeDraftSnapshot(p.snapshot, p.editingQuoteId);
  }, 600);
}
/* Force out any debounced save that hasn't fired yet — called when the tab is about to
   lose focus or close, so a pending edit isn't stranded behind the 600ms delay. */
function flushDraftSave(){
  if(!_pendingDraftSave) return;
  clearTimeout(_draftSaveTimer);
  const p = _pendingDraftSave; _pendingDraftSave = null;
  writeDraftSnapshot(p.snapshot, p.editingQuoteId);
}
async function clearSavedDraft(){
  clearTimeout(_draftSaveTimer);
  _pendingDraftSave = null;
  S._savedDraft = null;
  S._savedEditingQuoteId = null;
  const doc = businessDoc();
  if(doc){ try{ await doc.collection("drafts").doc("current").delete(); }catch(e){} }
}

function goto(screen, extra){ S.screen = screen; Object.assign(S, extra||{}); render(); window.scrollTo(0,0); }

/* =========================================================================
   NEW-QUOTE DRAFT HELPERS
   ========================================================================= */
function newDraft(){
  return {
    // Pre-filled with whoever wrote the most recent quote, since it's usually the same person.
    createdBy: ((S.quotes||[]).find(q=>q.createdBy)||{}).createdBy || "", customer:{name:"",knownAs:"",email:"",phone:"",address:""},
    serviceKeys: [], serviceIdx: 0,
    sectionsRaw: {},     // key -> {rows:[...], options:{...}, notes:[{id,text,customerFacing}]}
    people: 3,
    extras: [],
    generalNotes: [],    // notes not tied to any particular measurement step — see wizExtras
    step: "who",         // who -> services -> measure -> people -> extras -> preview
  };
}
// A new measurement step starts with one row; "+ Add line" adds another.
function ensureRows(def, key){
  return [mkRow(def.cols, key)];
}
function ensureSectionState(key){
  if(key==="waste"){
    if(!S.draft.sectionsRaw.waste){
      const p = S.settings.productivity || {};
      S.draft.sectionsRaw.waste = {rows: [], options: {
        diggerProductivity: p.wasteDigger!=null ? p.wasteDigger : 50,
        grabM3PerLoad: S.settings.wasteGrabM3PerLoad!=null ? S.settings.wasteGrabM3PerLoad : 5,
        labourProductivity: p.wasteLabour!=null ? p.wasteLabour : 20,
      }, notes: []};
    }
    // Backfill for a draft started before per-step notes existed.
    if(!S.draft.sectionsRaw.waste.notes) S.draft.sectionsRaw.waste.notes = [];
    return S.draft.sectionsRaw.waste;
  }
  const def = SERVICES[key];
  if(!S.draft.sectionsRaw[key]){
    const opts = {};
    // The dig-out-depth option's key is "digOutDepth" — see DEPTH_OPTION_KEY.
    const depthOptKey = DEPTH_OPTION_KEY[key] || "digOutDepth";
    def.options.forEach(o=>{
      if(o.key==="productivity" && S.settings.productivity && S.settings.productivity[key]!=null){
        // productivity's starting value comes from the business's saved default, not a
        // hardcoded number
        opts[o.key] = S.settings.productivity[key];
      } else if(o.key===depthOptKey && S.settings.digOutDepthDefaults && S.settings.digOutDepthDefaults[key]!=null){
        // likewise for this service's dig-out depth — see settings.digOutDepthDefaults
        opts[o.key] = S.settings.digOutDepthDefaults[key];
      } else if(o.key==="edgingProductivity" && EDGING_PRODUCTIVITY_SETTINGS_KEY[key] && S.settings.productivity && S.settings.productivity[EDGING_PRODUCTIVITY_SETTINGS_KEY[key]]!=null){
        // and for the edging productivity rate (Paving/Block paving) — see
        // EDGING_PRODUCTIVITY_SETTINGS_KEY. Before October 2026 Paving's saved edging rate was
        // never actually read back here, so new quotes always started at a hardcoded 12.
        opts[o.key] = S.settings.productivity[EDGING_PRODUCTIVITY_SETTINGS_KEY[key]];
      } else {
        opts[o.key] = o.default;
      }
    });
    S.draft.sectionsRaw[key] = {rows: ensureRows(def, key), options: opts, notes: []};
  }
  if(!S.draft.sectionsRaw[key].notes) S.draft.sectionsRaw[key].notes = [];
  return S.draft.sectionsRaw[key];
}

/* Builds the same {key,area,options,...} priced entries buildQuoteFromDraft would, from the
   wizard's current (possibly not-yet-saved) rows/options — lets the Measurements wizard show a
   live waste-removal preview without waiting for the whole quote to be built. */
function draftWasteSections(d){
  const ctx = ctxFor(S.settings, d.people||3);
  return d.serviceKeys.map(key=>{
    const st = ensureSectionState(key);
    return priceSection(key, st.rows, st.options, ctx, st.notes);
  });
}
/* The live "Waste removal & site clearance" preview for the draft's current state — null when
   no waste-eligible service (or decking with dig-out) is in the quote yet, in which case the
   Measurements wizard skips the waste page entirely (same rule calcWasteRemoval itself uses). */
function draftWastePreview(d){
  const ctx = ctxFor(S.settings, d.people||3);
  const opts = S.draft.sectionsRaw.waste ? S.draft.sectionsRaw.waste.options : null;
  const notes = S.draft.sectionsRaw.waste ? S.draft.sectionsRaw.waste.notes : null;
  return calcWasteRemoval(draftWasteSections(d), ctx, opts, notes);
}

/* Re-open a previously saved quote in the wizard so it can be changed and re-saved
   in place — rebuilds a draft from the quote's stored sections rather than starting fresh. */
function startEditQuote(quoteId, force){
  const q = S.quotes.find(x=>x.id===quoteId);
  if(!q) return;
  // Already editing this quote (live or saved draft) → just carry on with it.
  if(S.draft && S.editingQuoteId===quoteId){ goto("newquote"); return; }
  if(!S.draft && S._savedDraft && S._savedEditingQuoteId===quoteId){
    S.draft = S._savedDraft; S.editingQuoteId = quoteId; S._savedDraft = null; S._savedEditingQuoteId = null; goto("newquote"); return;
  }
  // Another unfinished quote would be overwritten — ask first.
  const other = S.draft || S._savedDraft;
  const isEmptyDraft = o => !(o.customer && (o.customer.name||'').trim()) && !(o.serviceKeys||[]).length && !(o.extras||[]).length;
  if(other && !force && !isEmptyDraft(other)){
    const who = (other.customer && other.customer.name) ? other.customer.name : "an unnamed customer";
    showConfirm(`You have an unfinished quote for ${who}. Editing this quote will discard it. Carry on?`, async ()=>{
      S.draft = null; S._savedDraft = null; S._savedEditingQuoteId = null; S.editingQuoteId = null;
      startEditQuote(quoteId, true);
    }, {confirmLabel:"Discard it and edit", danger:true});
    return;
  }
  S._savedDraft = null; S._savedEditingQuoteId = null;
  const serviceKeys = q.sections.filter(s=>s.key!=="waste" && SERVICES[s.key]).map(s=>s.key);
  const frozenSections = deepClone(q.sections.filter(s=>s.key!=="waste" && !SERVICES[s.key]));
  const sectionsRaw = {};
  q.sections.forEach(s=>{
    if(s.key!=="waste" && !SERVICES[s.key]) return;
    if(s.key==="waste"){ sectionsRaw.waste = {rows: [], options: deepClone(s.options), notes: deepClone(s.notes||[])}; return; }
    sectionsRaw[s.key] = {rows: deepClone(s.rows), options: deepClone(s.options), notes: deepClone(s.notes||[])};
  });
  S.draft = {
    createdBy: q.createdBy || "",
    customer: deepClone(q.customer),
    serviceKeys, serviceIdx: 0,
    sectionsRaw, frozenSections,
    people: q.people || 3,
    extras: deepClone(q.extras || []),
    generalNotes: deepClone(q.generalNotes || []),
    step: "preview",   // jump straight to the summary — every earlier step is one click back via the step pills
  };
  S.editingQuoteId = q.id;
  S._showAccept = false;
  goto("newquote");
}

/* =========================================================================
   BRANDING — each business's own logo and colours (Oct 2026). Infinity (the original business)
   keeps its built-in logo, letter footer and greens unless it uploads something else. A logo is

   document small; the colour picked from it (settings.brandColor, editable) recolours the app,
   the quote letter and the payment plan.
   ========================================================================= */
const INFINITY_NAME = "infinity landscapes and design";
// "Infinity Landscapes and Design", "… Ltd", "… LTD." and "… Limited" are all Infinity.
function isInfinityName(name){ return String(name||'').toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim().replace(/ (ltd|limited)$/,'') === INFINITY_NAME; }
function isInfinity(){ return !!(S.settings && S.settings.brandInfinity); }
function brandLogoSrc(){ return S.logo || (isInfinity() ? LOGO_DATA_URI : null); }
function brandInitials(){ const n = (S.settings && S.settings.company && S.settings.company.name) || ''; return (n.split(/\s+/).filter(w=>/^[A-Za-z0-9]/.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join('')) || 'Q'; }
// Small mark for the top bar / setup header.
function brandMarkHtml(){
  if(S.logo) return `<img src="${S.logo}" alt="" class="brand-logo" style="height:34px;max-width:110px;">`;
  if(isInfinity()) return `<div class="brand-mark">${BRAND_MARK_SVG}</div>`;
  return `<div class="brand-initials">${esc(brandInitials())}</div>`;
}
// Big logo (login, settings): the logo, or the company name in brand colour.
function brandBigHtml(h){
  const src = brandLogoSrc();
  return src ? `<img src="${src}" alt="${esc(S.settings.company.name||'')}" style="height:${h}px;max-width:100%;object-fit:contain;">`
    : `<div class="letter-name" style="font-size:${Math.round(h/2.6)}px;">${esc(S.settings.company.name||'Your business')}</div>`;
}
function hexToHsl(hex){
  const m = String(hex||'').match(/^#?([0-9a-f]{6})$/i); if(!m) return null;
  const n = parseInt(m[1],16); let r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0, s=0; const l=(mx+mn)/2;
  if(mx!==mn){ const d=mx-mn; s = l>0.5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx===r ? (g-b)/d+(g<b?6:0) : mx===g ? (b-r)/d+2 : (r-g)/d+4; h*=60; }
  return {h, s, l};
}
function hslHex(h, s, l){
  s=Math.max(0,Math.min(1,s)); l=Math.max(0,Math.min(1,l));
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('');
}
function lumOf(hex){ const n=parseInt(hex.slice(1),16); const c=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);}); return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]; }
// The business's palette from one brand colour; filled buttons keep 4.5:1 contrast with white.
function brandPalette(hex){
  const c = hexToHsl(hex); if(!c) return null;
  const h = c.h, s = Math.max(0.18, Math.min(0.85, c.s));
  let pl = Math.min(c.l, 0.45); let primary = hslHex(h, s, pl);
  while(1.05/(lumOf(primary)+0.05) < 4.6 && pl > 0.08){ pl -= 0.02; primary = hslHex(h, s, pl); }
  return {
    g50: hslHex(h, s*0.55, 0.96), g100: hslHex(h, s*0.5, 0.9), g300: hslHex(h, s*0.6, 0.72), g500: hslHex(h, s, 0.55),
    g600: hslHex(h, s, 0.45), g700: hslHex(h, s, 0.35), g800: hslHex(h, s, 0.25),
    primary, primaryHover: hslHex(h, s, Math.max(0.05, pl-0.08)),
    d50: hslHex(h, s*0.3, 0.13), d100: hslHex(h, s*0.32, 0.17), d700: hslHex(h, s*0.8, 0.7), d800: hslHex(h, s*0.6, 0.8),
  };
}
function applyBrandTheme(){
  const old = document.getElementById('brandTheme'); if(old) old.remove();
  const hex = S.settings && S.settings.brandColor;
  const P = hex ? brandPalette(hex) : null;
  if(!P) return;
  const light = `--green-50:${P.g50};--green-100:${P.g100};--green-300:${P.g300};--green-500:${P.g500};--green-600:${P.g600};--green-700:${P.g700};--green-800:${P.g800};--primary:${P.primary};--primary-hover:${P.primaryHover};--brand-50:${P.g50};--brand-100:${P.g100};--brand-500:${P.g500};--brand-600:${P.g600};--brand-700:${P.g700};--brand-800:${P.g800};`;
  const dark = `--green-50:${P.d50};--green-100:${P.d100};--green-700:${P.d700};--green-800:${P.d800};`;
  const st = document.createElement('style'); st.id = 'brandTheme';
  st.textContent = `:root{${light}} @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){${dark}} } :root[data-theme="dark"]{${dark}}`;
  document.head.appendChild(st);
}
// Main colour of a logo: the most common saturated hue (ignoring white, black and greys).
function logoMainColour(img){
  try{
    const W = 80, H = Math.max(1, Math.round(80*img.height/img.width));
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, W, H);
    const d = cx.getImageData(0,0,W,H).data;
    const bins = {};
    for(let i=0;i<d.length;i+=4){
      if(d[i+3] < 200) continue;
      const hex = '#'+[d[i],d[i+1],d[i+2]].map(v=>v.toString(16).padStart(2,'0')).join('');
      const c = hexToHsl(hex);
      if(!c || c.s < 0.25 || c.l < 0.12 || c.l > 0.9) continue;
      const b = Math.round(c.h/15)%24;
      const e = bins[b] || (bins[b] = {w:0, r:0, g:0, bl:0});
      e.w += c.s; e.r += d[i]*c.s; e.g += d[i+1]*c.s; e.bl += d[i+2]*c.s;
    }
    const best = Object.values(bins).sort((a,b)=>b.w-a.w)[0];
    if(!best || best.w < 3) return null;
    return '#'+[best.r/best.w, best.g/best.w, best.bl/best.w].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
  }catch(e){ return null; }
}
// Shrinks an uploaded logo to fit 600×240 (PNG, or JPEG on white if that's too big to store).
function processLogoFile(file){
  return new Promise((resolve, reject)=>{
    if(!file || !/^image\//.test(file.type)) return reject(new Error("Please choose an image file (PNG or JPG)."));
    const fr = new FileReader();
    fr.onerror = ()=>reject(new Error("That file couldn't be read."));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("That image couldn't be opened — try a PNG or JPG."));
      img.onload = ()=>{ try{
        const k = Math.min(1, 600/img.width, 240/img.height);
        const w = Math.max(1, Math.round(img.width*k)), h = Math.max(1, Math.round(img.height*k));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, w, h);
        let url = cv.toDataURL('image/png');
        if(url.length > 180000){ const c2 = document.createElement('canvas'); c2.width=w; c2.height=h; const x2=c2.getContext('2d'); x2.fillStyle='#fff'; x2.fillRect(0,0,w,h); x2.drawImage(img,0,0,w,h); url = c2.toDataURL('image/jpeg', 0.85); }
        if(url.length > 240000) return reject(new Error("That logo is too detailed to store — try a smaller or simpler image."));
        resolve({dataUrl:url, colour: logoMainColour(img)});
      }catch(e){ reject(new Error("That image couldn't be used — try a PNG or JPG.")); } };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

// Setting up Infinity itself (by name) brings back its own prices, suppliers, rates, logo and
// letter wording; any other name keeps the blank, neutral starting point.
function applyInfinityDefaults(s, on){
  if(on && !s.brandInfinity){
    DEFAULT_MATERIALS.forEach(m=>{ if(s.materials[m.name]){ s.materials[m.name].price = m.price; s.materials[m.name].supplier = m.supplier||''; } });
    FENCE_ONLY_MATERIALS.forEach(n=>{ if(s.materials[n]) s.materials[n].price = 0; });
    if(!(s.dayRatePerPerson>0)) s.dayRatePerPerson = 150;
    if(!(s.expensesPerDay>0)) s.expensesPerDay = 515;
    s.brandInfinity = true; s._infApplied = true;
  } else if(!on && s._infApplied){
    DEFAULT_MATERIALS.forEach(m=>{ if(s.materials[m.name]){ s.materials[m.name].price = 0; s.materials[m.name].supplier = ''; } });
    s.dayRatePerPerson = 0; s.expensesPerDay = 0;
    s.brandInfinity = false; delete s._infApplied;
  }
}
function setupCollect(st){
  const s = S.settings;
  if(st===1){
    s.company.name = val('f_name'); s.company.number = val('f_number'); s.company.vatNo = val('f_vat');
    if(S._freshTenant) applyInfinityDefaults(s, isInfinityName(s.company.name));
    s.company.email = val('f_email'); s.company.phone = val('f_phone'); s.company.address = val('f_address');
    s.company.bankName = val('f_bank'); s.company.sortCode = val('f_sort'); s.company.accountNumber = val('f_acct');
  } else if(st===3){
    s.dayRatePerPerson = numval('f_dayrate'); s.expensesPerDay = numval('f_expenses');
    s.vatRegistered = chk('f_vatregistered');
    s.vatRate = pctVal('f_vatrate', s.vatRate); s.weeklyPaymentAmount = numval('f_weekly');
    s.expensesIncludeVat = chk('f_expensesvat');
    s.markupPercent = numval('f_markup');
    const wd = [false,false,false,false,false,false,false];
    document.querySelectorAll('[data-setup-workday]').forEach(inp=>{ wd[parseInt(inp.getAttribute('data-setup-workday'),10)] = inp.checked; });
    if(wd.some(Boolean)) s.workingDays = wd;
    if(val('f_workStart')) s.workStart = val('f_workStart');
    if(val('f_workEnd')) s.workEnd = val('f_workEnd');
    // Infinity's own digger/grab hire rates are starting defaults, not universal ones — every
    // new tenant confirms or changes them here, rather than silently inheriting another
    // business's plant costs.
    if(!s.materials['Digger hire']) s.materials['Digger hire'] = {unit:'day', section:'Plant', price:300, supplier:'', vatIncluded:false};
    if(!s.materials['Grab hire']) s.materials['Grab hire'] = {unit:'load', section:'Plant', price:360, supplier:'', vatIncluded:true};
    s.materials['Digger hire'].price = numval('f_diggerrate');
    s.materials['Grab hire'].price = numval('f_grabrate');
  }
}
function val(id){ const e=document.getElementById(id); return e?e.value.trim():''; }
function numval(id){ const e=document.getElementById(id); return e? (parseFloat(e.value)||0):0; }
// VAT rate typed as a percentage (20 → 0.2); an old-style fraction (0.2) is still understood.
function pctVal(id, fallback){ const e=document.getElementById(id); if(!e) return fallback; const v = parseFloat(String(e.value).replace('%','')); if(isNaN(v) || v<0) return fallback; return v>=1 ? Math.round(v*1000)/100000 : v; }
function pctText(rate){ return String(+((Number(rate)||0)*100).toFixed(2)); }
function chk(id){ const e=document.getElementById(id); return e ? !!e.checked : false; }

async function setupNext(){
  const st = S._setupStep||1;
  setupCollect(st);
  if(st===3){
    if(!(S.settings.dayRatePerPerson>0) || !(S.settings.expensesPerDay>0)){ S.err = "Enter your day rate per person and your daily running costs — every quote is priced from them."; renderSetup(); return; }
    S.err = "";
  }
  if(st===4){
    const p1=val('f_pin'), p2=val('f_pin2');
    if(!p1 || p1.length<4){ S.err="Choose a PIN of at least 4 digits."; renderSetup(); return; }
    if(p1!==p2){ S.err="PINs don't match."; renderSetup(); return; }
    S.settings.pin = p1; S.settings.onboarded = true; S.err=""; delete S.settings._infApplied; S._freshTenant = false;
    // First login: the walkthrough starts now, and again at the next unlock until it's finished
    // or skipped (see startTour / endTour).
    S.settings.tutorialPending = true;
    await saveSettings();
    S.authed = true;
    goto("menu");
    autoStartTour();
    return;
  }
  S.err = ""; S._setupStep = st+1; renderSetup();
}

/* ---- Chasing sent quotes ----
   A sent quote remembers when it was sent (sentAt) and every follow-up (q.chases). It "needs
   chasing" once settings.chaseAfterDays have passed since it was sent or last chased. Call /
   Text / Email buttons open the phone's own app (nothing is sent automatically) and log the
   follow-up on the quote's activity log. */
function daysSinceIso(iso){
  if(!iso) return null;
  const a = new Date(iso); a.setHours(0,0,0,0);
  const b = new Date(); b.setHours(0,0,0,0);
  return Math.max(0, Math.round((b-a)/86400000));
}
function quoteSentAt(q){ return q.sentAt || (q.status==="sent" ? q.createdAt : null); }
function quoteLastChase(q){ const c = (q.chases||[]); return c.length ? c[c.length-1] : null; }
function quoteLastContactAt(q){ const c = quoteLastChase(q); return c ? c.at : quoteSentAt(q); }
function quoteNeedsChasing(q){
  if(q.status!=="sent") return false;
  const n = daysSinceIso(quoteLastContactAt(q));
  return n!=null && n >= (Number(S.settings.chaseAfterDays)||7);
}
function agoText(n){ return n===0 ? 'today' : n===1 ? 'yesterday' : `${n} days ago`; }
function chaseMessageText(q){
  const c = S.settings.company||{};
  const who = (q.customer.knownAs||q.customer.name||'').trim();
  return `Hi${who?' '+who:''}, just checking you received our quote ${q.quoteNumber} for your garden works (${gbp(q.totals.total)}). Happy to answer any questions or talk through any changes. Thanks, ${q.createdBy||c.name||''}${c.name&&q.createdBy?' – '+c.name:''}${c.phone?' – '+c.phone:''}`;
}
function telHref(num){ return 'tel:' + String(num||'').replace(/[^\d+]/g,''); }
function smsHref(num, body){ return 'sms:' + String(num||'').replace(/[^\d+]/g,'') + '?&body=' + encodeURIComponent(body); }
function chaseButtonsHtml(q, compact){
  const ph = (q.customer.phone||'').trim(), em = (q.customer.email||'').trim();
  const sz = compact ? 'btn-sm' : 'btn-sm';
  return `<div class="row chase-btns" style="gap:6px;margin-top:8px;">
    ${ph ? `<button type="button" class="btn btn-ghost ${sz}" data-action="chaseQuote" data-how="call" data-id="${q.id}">📞 Call</button>` : `<span class="btn btn-ghost ${sz}" style="opacity:.45;cursor:default;" title="No phone number on this quote">📞 Call</span>`}
    ${ph ? `<button type="button" class="btn btn-ghost ${sz}" data-action="chaseQuote" data-how="text" data-id="${q.id}">💬 Text</button>` : `<span class="btn btn-ghost ${sz}" style="opacity:.45;cursor:default;" title="No phone number on this quote">💬 Text</span>`}
    <button type="button" class="btn btn-ghost ${sz}" data-action="chaseQuote" data-how="email" data-id="${q.id}">✉ Email</button>
  </div>`;
}
function chaseStatusText(q){
  const sent = daysSinceIso(quoteSentAt(q));
  const last = quoteLastChase(q);
  return `Sent ${agoText(sent)}${last?` · chased ${agoText(daysSinceIso(last.at))} (${last.how})`:''}`;
}
function quoteListItemHtml(q){
  const chase = q.status==="sent";
  const needs = quoteNeedsChasing(q);
  const od = financeOverdue(q);
  return `<div class="quote-list-item" data-action="openQuote" data-id="${q.id}" style="${chase?'flex-wrap:wrap;':''}">

/* =========================================================================
   RENDER: BUSINESS OVERVIEW — a live roll-up across every job's finance tracker. "Active" here
   means a job still being tracked day-to-day: ongoing or finished, but not cancelled (a
   cancelled job's finance data is kept but it no longer counts toward the business's live
   totals). Overrun frequency is measured the same way the per-job overrun alert is (actual
   spend at/over 80% of quoted), counted across jobs rather than fired as a one-off alert.
   ========================================================================= */
function renderOverview(){
  const jobs = S.quotes.filter(q=>q.finance && q.status!=="cancelled");
  const totalProfit = Math.round(sum(jobs.map(q=>financeActualProfit(q)))*100)/100;
  const totalOwed = Math.round(sum(jobs.map(q=>financeAmountOwed(q)))*100)/100;
  const totalPaid = Math.round(sum(jobs.map(q=>financePaymentsTotal(q)))*100)/100;
  const overdueJobs = jobs.filter(q=>financeOverdue(q).count>0);
  const totalOverdue = Math.round(sum(overdueJobs.map(q=>financeOverdue(q).amount))*100)/100;
  const overrunCounts = {materials:0, labor:0, runningCosts:0};
  jobs.forEach(q=>{
    Object.keys(overrunCounts).forEach(cat=>{
      const quoted = financeCategoryQuoted(q,cat);
      if(quoted>0.004 && financeCategoryActual(q,cat)/quoted>=0.8) overrunCounts[cat]++;
    });
  });
  let worstCategory=null, worstCount=0;
  Object.keys(overrunCounts).forEach(k=>{ if(overrunCounts[k]>worstCount){ worstCount=overrunCounts[k]; worstCategory=k; } });
  App.innerHTML = shell(`
    <div class="card">
      <h2 style="margin:0 0 4px;font-size:18px;">📊 Business overview</h2>
      <div class="hint" style="margin-bottom:14px;">Live totals across every ongoing or finished job's finance tracker.</div>
      <div class="row" style="gap:10px;flex-wrap:wrap;">
        <div class="kfig"><div class="l">Total profit</div><div class="v" style="${totalProfit<0?'color:var(--danger);':''}">${gbp(totalProfit)}</div></div>
        <div class="kfig"><div class="l">Owed by customers</div><div class="v">${gbp(totalOwed)}</div></div>
        <div class="kfig"><div class="l">Paid so far</div><div class="v">${gbp(totalPaid)}</div></div>
        <div class="kfig"><div class="l">Overdue</div><div class="v" style="${totalOverdue>0.004?'color:var(--danger);':''}">${gbp(totalOverdue)}</div></div>
      </div>
      <div class="hint" style="margin-top:14px;">
        ${jobs.length===0 ? 'No jobs with a finance tracker yet — this fills in once a quote is accepted.' : (worstCategory ? `${FINANCE_CATEGORY_LABEL[worstCategory][0].toUpperCase()}${FINANCE_CATEGORY_LABEL[worstCategory].slice(1)} overruns most often — at 80%+ of quoted on ${worstCount} of ${jobs.length} job${jobs.length===1?'':'s'}.` : 'No cost category is currently overrunning on 80%+ of its quoted spend.')}
      </div>
    </div>
    ${overdueJobs.length ? `<div class="card" style="border-color:var(--danger);">
      <h3 style="margin:0 0 10px;font-size:15px;">Overdue payments</h3>
      ${overdueJobs.map(q=>quoteListItemHtml(q)).join('')}
    </div>` : ''}
    <div class="card">
      <h3 style="margin:0 0 10px;font-size:15px;">Jobs</h3>
      ${jobs.length===0?`<div class="empty"><div class="em-ic">📊</div>Nothing to show yet.</div>`:jobs.map(q=>quoteListItemHtml(q)).join('')}
    </div>
  `, "overview");
}

/* =========================================================================
   RENDER: CALENDAR — a month grid showing when every scheduled (ongoing or finished) job is
   booked in, alongside any manually-added calendar entries, so the business can see its
   visual schedule at a glance. Cells for days outside the configured working week are
   shaded; a job chip opens that job, a manual entry chip opens it for editing/removal.
   ========================================================================= */
function monthGridDates(year, month){
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7; // Monday-first grid, regardless of locale
  const gridStart = addDays(first, -startOffset);
  const cells = [];
  for(let i=0;i<42;i++) cells.push(addDays(gridStart, i)); // always 6 full weeks — simplest, consistent grid height
  return cells;
}
function calendarEntriesForRange(startStr, endStr, teamFilter){
  const map = {};
  const addTo = (dateStr, bucket, item) => { const m = (map[dateStr] = map[dateStr] || {jobs:[], manual:[]}); m[bucket].push(item); };
  S.quotes.forEach(q=>{
    if(q.status==="cancelled") return;
    if(teamFilter && q.teamId!==teamFilter) return;
    (q.scheduledDays||[]).forEach(d=>{ if(d>=startStr && d<=endStr) addTo(d, "jobs", q); });
  });
  (S.calendarEntries||[]).forEach(e=>{
    if(teamFilter && e.teamId!==teamFilter) return;
    entryScheduledDays(e).forEach(d=>{ if(d>=startStr && d<=endStr) addTo(d, "manual", e); });
  });
  return map;
}
function renderCalendar(){
  const now = new Date();
  const ym = S._calMonth || {year: now.getFullYear(), month: now.getMonth()};
  const cells = monthGridDates(ym.year, ym.month);

  const entryMap = calendarEntriesForRange(isoDate(cells[0]), isoDate(cells[cells.length-1]), teamFilter);
  const todayStr = isoDate(now);
  const monthLabel = new Date(ym.year, ym.month, 1).toLocaleDateString('en-GB',{month:'long', year:'numeric'});
  const wd = workingDaysOf(S.settings);
  const teams = S.settings.teams||[];

  App.innerHTML = shell(`

        <div class="row" style="gap:6px;">
          <button class="btn btn-ghost btn-sm" data-action="calPrevMonth">‹</button>
          <button class="btn btn-ghost btn-sm" data-action="calToday">Today</button>

        </div>
      </div>
      <div class="hint" id="calMonthLabel" style="margin-bottom:10px;">${monthLabel} — job bookings and calendar entries. Shaded days aren't part of your working week.</div>
      ${teams.length>1 ? `<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:12px;">
        <button type="button" class="btn btn-sm ${!teamFilter?'btn-primary':'btn-ghost'}" data-action="calTeamFilter" data-team="">All teams</button>
        ${teams.map(tm=>`<button type="button" class="btn btn-sm ${teamFilter===tm.id?'btn-primary':'btn-ghost'}" data-action="calTeamFilter" data-team="${tm.id}"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${teamColor(tm.id)};margin-right:6px;vertical-align:middle;"></span>${esc(tm.name)}</button>`).join('')}
      </div>` : ''}
      <div class="cal-grid">
        ${DOW.map(([label])=>`<div class="cal-dow">${label}</div>`).join('')}
        ${cells.map(d=>{
          const dateStr = isoDate(d);
          const inMonth = d.getMonth()===ym.month;
          const nonworking = !wd[d.getDay()];
          const info = entryMap[dateStr] || {jobs:[], manual:[]};
          return `<div class="cal-cell ${inMonth?'':'cal-cell-off'} ${nonworking?'cal-cell-nonworking':''} ${dateStr===todayStr?'cal-cell-today':''}">
            <div class="cal-cell-head">

            </div>

                return `<div class="cal-entry ${e.isJob?'cal-entry-manualjob':''}" style="border-left-color:${teamColor(e.teamId)};" data-action="editCalendarEntry" data-id="${e.id}" title="${esc(teamLabel(e.teamId))} — ${e.isJob?'Job':'Entry'}: ${esc(e.title)}${spanNote} — ${e.blocksDay?'blocks this day':'does not block this day'}">

      <div class="hint" style="margin-top:14px;">Each entry's left edge is coloured by its team. 📋 = a scheduled job, 🧰 = a manual entry marked as a job, 🔒 = blocks that day from other scheduling for that team.</div>

          ${chaseButtonsHtml(q)}

            <button class="btn btn-danger btn-block" data-action="cancelJob">Cancel this job</button>

        ${["finished","cancelled"].includes(q.status) ? `
        <div class="card">
          <h3 style="margin:0 0 10px;font-size:15px;">Job status</h3>

          <button class="btn btn-primary btn-block" data-action="confirmAccept">Generate payment plan</button>
        </div>`:''}

/* =========================================================================
   LETTER WORDING (Oct 2026). Three layers, most specific first:
     1. this quote's own edits (q.letterEdits — "Edit letter wording" on a saved quote);
     2. the business's wording (Settings → Quote letter: settings.letterTemplate, and
        settings.serviceWording for a service's lines);
     3. the standard wording — Infinity's own for Infinity, neutral text for everyone else; each
        service's standard lines are generated from the job's own figures (SERVICE_COPY).
   Placeholders in the paragraphs: {company} {customer} {total} {vat} {hours} {days}.
   In a service's custom lines: {area} {length} {depth}.
   ========================================================================= */
const LETTER_STD = {
  infinity: {
    intro: "Thank you for choosing {company} for your garden works. With our wealth of experience, our perfectionist attitude, and a keen eye for detail, {company} are the number one choice to convert aspirations into reality.",
    closing: "Thank you, we look forward to adding value to your property.",
  },
  neutral: {
    intro: "Thank you for asking {company} to quote for your garden works. Please find the details of our quote below.",
    closing: "Thank you for the opportunity to quote — we look forward to hearing from you.",
  },
  price: "We have calculated the cost of the works and the price comes to {total}{vat}. Our general working hours are {hours} depending on weather and light. We expect this to take us approximately {days} to complete, and this quote includes:",
  siteTidy: "Site to be kept tidy and clean throughout, and left as clean, or cleaner, than when we started.",
  signOff: "Yours sincerely,",
  waste: "All excavated spoil and waste materials removed from site and disposed of responsibly.",
};
const LETTER_FIELDS = [["intro","Opening paragraph"],["price","Price paragraph"],["siteTidy","Site tidiness line"],["closing","Closing line"],["signOff","Sign-off"],["waste","Waste removal line"]];
function letterStandard(field){ const b = isInfinity() ? LETTER_STD.infinity : LETTER_STD.neutral; return b[field]!=null ? b[field] : (LETTER_STD[field]||''); }
function letterTemplate(field){ const t = (S.settings.letterTemplate||{})[field]; return (t!=null && String(t).trim()!=='') ? String(t) : letterStandard(field); }
function fillLetter(tpl, q, dash){
  const vatOn = q.vatRegistered!==false, days = q.totals.totalDays;
  return String(tpl)
    .replace(/\{company\}/g, ()=>S.settings.company.name||'')
    .replace(/\{customer\}/g, ()=>unesc(q.customer.knownAs||q.customer.name||''))
    .replace(/\{total\}/g, ()=>gbp(q.totals.total))
    .replace(/\{vat\}/g, ()=>vatOn ? `, this includes VAT (${gbp(q.totals.vat)})` : '')
    .replace(/\{hours\}/g, ()=>workingHoursText(dash||'–'))
    .replace(/\{days\}/g, ()=>`${days} working day${days===1?'':'s'}`);
}
// One paragraph of a quote's letter, as plain text.
function letterPart(q, field, dash){
  const e = q.letterEdits && q.letterEdits[field];
  return fillLetter((e!=null && String(e).trim()!=='') ? e : letterTemplate(field), q, dash);
}
// The letter is signed by whoever created the quote ("Your name" on the quote's first step).
function signerName(q){ return unesc(q.createdBy||'') || (isInfinity() ? 'The Infinity team' : (S.settings.company.name || '')); }
// A section's bullet lines for the letter, as plain text.
function sectionLetterLines(q, s){
  const own = q.letterEdits && q.letterEdits.sections && q.letterEdits.sections[s.key];
  const split = t => String(t).split('\n').map(x=>x.trim()).filter(Boolean);
  if(own!=null && String(own).trim()!=='') return split(own);
  const biz = (S.settings.serviceWording||{})[s.key];
  if(s.key!=="waste" && biz!=null && String(biz).trim()!==''){
    const {unit, area} = sectionMeasureRate(s, 0);
    return split(biz).map(l=>l.replace(/\{area\}/g, ()=>qtyText(area,unit)).replace(/\{length\}/g, ()=>`${(Number(s.area)||0).toFixed(2)}m`).replace(/\{depth\}/g, ()=>`${Math.round(Number(s.digOutDepth)||0)}mm`));
  }
  if(s.key==="waste") return [letterPart(q, 'waste')];
  return sectionCopy(s).map(l=>unesc(String(l).replace(/<[^>]+>/g,'')));
}
// Standard lines for a service (for Settings → Quote letter's "start from the standard wording"),
// generated from a sample job with that service's default options.
function standardServiceLines(key){
  try{
    const def = SERVICES[key]; if(!def) return [];
    const opts = {}; (def.options||[]).forEach(o=>{ if(o.default!==undefined) opts[o.key] = o.default; });
    const depth = (S.settings.digOutDepthDefaults||{})[key]||150;
    const sample = {key, options:opts, rows:[], area:10, digOutDepth:depth};
    // The sample job has no products picked, so mark the gaps for the business to fill in, and
    // put the job's own dig-out depth back as {depth}.
    return sectionCopy(sample).map(l=>unesc(String(l).replace(/<[^>]+>/g,'')).trim()
      .replace(new RegExp('\\b'+depth+'mm','g'), '{depth}')
      .replace(/ of \./g, ' of [product].').replace(/^([a-z])/, '[product] $1')).filter(Boolean);
  }catch(e){ return []; }
}

// Edit box shown in place of a paragraph/section while a saved quote's letter is being edited.
function letterEditBox(field, q, value){
  const isSec = field.indexOf('section:')===0;
  const cur = isSec ? value : ((q.letterEdits && q.letterEdits[field]!=null && String(q.letterEdits[field]).trim()!=='') ? q.letterEdits[field] : letterTemplate(field));
  const lines = String(cur||'').split('\n').length;
  return `<div class="field" style="margin:6px 0 10px;">
    ${isSec ? `<div class="hint" style="margin:0 0 3px;">One line per bullet point</div>` : (field==='signOff'?`<div class="hint" style="margin:0 0 3px;">Sign-off</div>`:'')}
    <textarea data-letter-field="${esc(field)}" rows="${Math.max(isSec?3:2, Math.min(12, lines + (isSec?0:1)))}" style="width:100%;font:inherit;font-size:13.5px;">${esc(cur||'')}</textarea>
  </div>`;
}

/* Plain-text version of the quote letter, for the "Email quote" mailto: body */
function quoteLetterPlainText(q){
  const c = S.settings.company;
  const sections = q.sections.filter(s=>s.key!=="waste" && s.subtotal>0.004);
  const waste = q.sections.find(s=>s.key==="waste");
  const days = q.totals.totalDays;
  const vatOn = q.vatRegistered!==false;
  const vatRate = quoteVatRate(q);
  const L = [];
  L.push(`Dear ${unesc(q.customer.knownAs||q.customer.name)},`, '');
  L.push(letterPart(q,'intro','-'), '');
  L.push(letterPart(q,'price','-'), '');
  L.push('WORKS TO BE COMPLETED');
  sections.forEach(s=>{
    const {unit, area, totalIncVat, rate} = sectionMeasureRate(s, vatRate);
    L.push(`${unesc(s.label)} - ${qtyText(area,unit)} - ${gbp(totalIncVat)}${vatOn?' inc VAT':''}${rate!=null?` (${gbp(rate)}/${unit})`:''}`);
    sectionLetterLines(q,s).forEach(li=>L.push(`  - ${li}`));
    customerFacingNoteTexts(s.notes).forEach(n=>L.push(`  - ${unesc(n)}`));
    L.push('');
  });
  if(waste){
    const {unit, area, totalIncVat, rate} = sectionMeasureRate(waste, vatRate);
    L.push(`Waste removal & site clearance - ${qtyText(area,unit)} - ${gbp(totalIncVat)}${vatOn?' inc VAT':''}${rate!=null?` (${gbp(rate)}/${unit})`:''}`);
    sectionLetterLines(q,waste).forEach(li=>L.push(`  - ${li}`));
    customerFacingNoteTexts(waste.notes).forEach(n=>L.push(`  - ${unesc(n)}`));
    L.push('');
  }
  const mats = quoteMaterialsList(q);
  if(mats.length){
    L.push('MATERIALS ALLOWED FOR');
    mats.forEach(m=>L.push(`  - ${unesc(m.name)}: ${m.qty} ${unesc(m.unit)}`));
    L.push('');
  }
  if(q.extras && q.extras.length){
    L.push('ADDITIONAL WORKS');
    q.extras.forEach(e=>L.push(`  - ${unesc(e.description)}${extraParts(e).legacy&&(Number(e.qty)||0)>1?` (x${e.qty})`:''} - ${gbp(extraSellPrice(q,e))}${q.vatRegistered!==false?' inc VAT':''}`));
    L.push('');
  }
  if(customerFacingNoteTexts(q.generalNotes).length){
    L.push('NOTES');
    customerFacingNoteTexts(q.generalNotes).forEach(n=>L.push(`  - ${unesc(n)}`));
    L.push('');
  }
  L.push(letterPart(q,'siteTidy','-'), '');
  if(vatOn){
    L.push(`Subtotal (ex VAT): ${gbp(q.totals.subtotal)}`);
    L.push(`VAT @ ${+(quoteVatRate(q)*100).toFixed(1)}%: ${gbp(q.totals.vat)}`);
  }
  L.push(`Total: ${gbp(q.totals.total)}`, '');
  L.push(letterPart(q,'closing','-'), '');
  L.push(letterPart(q,'signOff','-'), signerName(q), c.name);
  if(c.phone) L.push(c.phone);
  if(c.email) L.push(c.email);
  return L.join('\n');
}
